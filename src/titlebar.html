<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>TPbrowser Unified Top Bar</title>
<style>
/*__TP_FONT_FACE__*/
  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --font-heading: "Cormorant Garamond Gnosis", "Cormorant Garamond", Georgia, serif;
    --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
    --tb-bg: #1F1F1F;
    --tb-card: #272727;
    --tb-border: rgba(255, 255, 255, 0.12);
    --tb-border-subtle: rgba(255, 255, 255, 0.08);
    --tb-text: #E2BE68;
    --tb-sub: #A7A7A7;
    --tb-btn-bg: rgba(255, 255, 255, 0.045);
    --tb-btn-hover: rgba(255, 255, 255, 0.09);
    --tb-btn-fg: #F5F2EB;
    --tb-omni-bg: #0B0D12;
    --tb-omni-border: rgba(255, 255, 255, 0.11);
    --tb-accent-grad: linear-gradient(135deg, #E2BE68 0%, #B5872E 100%);
    --tb-accent-fg: #FFFFFF;
    --tb-accent-soft: rgba(212, 175, 55, 0.16);
    --tb-gold: #E2BE68;
    --tb-gold-line: rgba(212, 175, 55, 0.30);
    --tb-bg-hover: rgba(255, 255, 255, 0.08);
    --tb-ok: #34D399;
    --tb-ok-soft: rgba(16, 185, 129, 0.14);
    --tb-danger: #F87171;
    --tb-danger-soft: rgba(239, 68, 68, 0.14);
    --tb-shadow: 0 16px 42px rgba(0, 0, 0, 0.56);
  }

  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --tb-bg: #F4F4F5;
    --tb-card: #FFFFFF;
    --tb-border: rgba(122, 81, 11, 0.22);
    --tb-border-subtle: rgba(24, 19, 12, 0.10);
    --tb-text: #18130C;
    --tb-sub: #52525B;
    --tb-btn-bg: rgba(24, 19, 12, 0.055);
    --tb-btn-hover: rgba(24, 19, 12, 0.10);
    --tb-btn-fg: #18130C;
    --tb-omni-bg: #FFFFFF;
    --tb-omni-border: rgba(24, 19, 12, 0.16);
    --tb-accent-grad: linear-gradient(135deg, #A8741A 0%, #7A510B 100%);
    --tb-accent-fg: #FFFFFF;
    --tb-accent-soft: rgba(138, 92, 15, 0.12);
    --tb-gold: #8A5E10;
    --tb-gold-line: rgba(154, 107, 22, 0.32);
    --tb-bg-hover: rgba(24, 19, 12, 0.075);
    --tb-ok: #15803D;
    --tb-ok-soft: rgba(21, 128, 61, 0.11);
    --tb-danger: #C9302C;
    --tb-danger-soft: rgba(201, 48, 44, 0.11);
    --tb-shadow: 0 14px 36px rgba(24, 19, 12, 0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    color: var(--tb-btn-fg);
    font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    border-bottom: none;
    display: flex;
    flex-direction: column;
  }

  .tb-main-bar {
    width: 100%;
    height: 40px;
    min-height: 40px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding-left: 10px;
    box-sizing: border-box;
    background: var(--tb-bg);
    border-bottom: 1px solid var(--tb-border-subtle);
  }

  .tb-brand {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }
  .tb-monogram {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--tb-card);
    border: 1px solid var(--tb-border-subtle);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    overflow: hidden;
    transition: border-color 0.14s var(--ease-ui), transform 0.12s ease;
  }
  .tb-monogram:hover { border-color: var(--tb-gold); }
  .tb-monogram img {
    width: 20px;
    height: 20px;
    display: block;
    object-fit: contain;
  }

  .tb-nav-group {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .tb-ico-btn {
    height: 28px;
    min-width: 28px;
    padding: 0 7px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--tb-sub);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background-color 0.14s var(--ease-ui), color 0.14s var(--ease-ui), border-color 0.14s var(--ease-ui);
    white-space: nowrap;
  }
  .tb-ico-btn:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-btn-fg);
    border-color: var(--tb-border-subtle);
  }
  .tb-ico-btn.bookmarked {
    color: var(--tb-gold);
  }
  .tb-ico-btn.bookmarked svg {
    fill: currentColor;
  }
  .tb-ico-btn.newtab-after-url {
    height: 28px;
    width: 28px;
    padding: 0;
    background: var(--tb-btn-bg);
    border-color: var(--tb-border-subtle);
    color: var(--tb-btn-fg);
    flex-shrink: 0;
  }
  .tb-ico-btn.newtab-after-url:hover {
    border-color: var(--tb-gold-line);
    color: var(--tb-gold);
    background: var(--tb-accent-soft);
  }
  .tb-ico-btn svg {
    width: 13.5px;
    height: 13.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .tb-drag-spacer {
    flex: 1;
    min-width: 8px;
    height: 100%;
    cursor: default;
  }
  body.mode-horizontal .tb-drag-spacer {
    flex: 0 0 4px;
    min-width: 4px;
  }

  .tb-omni-wrap {
    position: relative;
    flex: 0 1 295px;
    width: clamp(190px, 23vw, 295px);
    min-width: 145px;
  }
  body.mode-horizontal .tb-omni-wrap {
    flex: 0 1 220px;
    width: clamp(145px, 17.5vw, 220px);
  }
  .tb-omni-form {
    width: 100%;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--tb-omni-bg);
    border: 1px solid var(--tb-omni-border);
    border-radius: 9px;
    padding: 0 4px 0 9px;
    transition: border-color 0.16s var(--ease-ui), box-shadow 0.16s var(--ease-ui);
  }
  .tb-omni-form:hover { border-color: var(--tb-gold-line); }
  .tb-omni-form:focus-within {
    border-color: var(--tb-gold);
    box-shadow: 0 0 0 2px var(--tb-accent-soft);
  }

  /* Dropdown gợi ý URL & Tìm kiếm thông minh */
  .tb-url-dropdown {
    position: absolute;
    top: 32px;
    left: 0;
    width: clamp(340px, 32vw, 520px);
    max-height: 310px;
    background: var(--tb-card);
    border: 1px solid var(--tb-gold-line);
    border-radius: 12px;
    box-shadow: var(--tb-shadow);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    z-index: 99999;
    color: var(--tb-btn-fg);
  }
  .tb-url-dropdown[hidden] { display: none; }
  .tb-url-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 9px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    color: var(--tb-sub);
    border: 1px solid transparent;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .tb-url-row:hover, .tb-url-row.selected {
    background: var(--tb-accent-soft);
    color: var(--tb-btn-fg);
    border-color: var(--tb-gold-line);
  }
  .tb-url-ico {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .tb-url-ico img {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    object-fit: contain;
  }
  .tb-url-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .tb-url-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--tb-btn-fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tb-url-subtitle {
    font-size: 10px;
    color: var(--tb-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tb-url-badge {
    font-size: 9.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--tb-btn-bg);
    color: var(--tb-sub);
    border: 1px solid var(--tb-border-subtle);
    flex-shrink: 0;
  }
  .tb-url-row.selected .tb-url-badge {
    color: var(--tb-gold);
    border-color: var(--tb-gold-line);
  }

  /* ================= HORIZONTAL TABS (CHROME/EDGE AUTO-SCALE) ================= */
  .tb-horiz-tabs {
    display: none;
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    align-items: center;
    gap: 3px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    padding: 0 2px;
  }
  .tb-horiz-tabs::-webkit-scrollbar { display: none; }
  body.mode-horizontal .tb-horiz-tabs { display: flex; }

  .tb-tab-item {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 6px 0 8px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--tb-sub);
    font-size: 11.5px;
    font-weight: 500;
    cursor: grab;
    /* Tự động co giãn đều như Chrome/Edge */
    flex: 1 1 165px;
    min-width: 44px;
    max-width: 185px;
    overflow: hidden;
    transition: background-color 0.14s var(--ease-ui), color 0.14s var(--ease-ui), border-color 0.14s var(--ease-ui), opacity 0.18s ease;
  }
  .tb-tab-item:active { cursor: grabbing; }
  .tb-tab-item:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-btn-fg);
  }
  .tb-tab-item.active {
    background: var(--tb-card);
    color: var(--tb-btn-fg);
    border-color: var(--tb-gold-line);
    font-weight: 600;
    flex-shrink: 0.35; /* Tab đang mở ưu tiên rộng hơn tab nền một chút */
    min-width: 68px;
  }
  .tb-tab-item.active::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 1px;
    height: 2px;
    border-radius: 99px;
    background: var(--tb-gold);
  }
  .tb-tab-item.sleeping { opacity: 0.5; }
  .tb-tab-item.sleeping .tb-tab-fav { filter: grayscale(0.85); }
  .tb-tab-item.dragging { opacity: 0.45; }
  .tb-tab-item.drop-before { box-shadow: inset 2.5px 0 0 var(--tb-gold); }
  .tb-tab-item.drop-after { box-shadow: inset -2.5px 0 0 var(--tb-gold); }
  .tb-tab-drop-end {
    align-self: stretch;
    min-width: 86px;
    margin: 3px 4px;
    border: 1px dashed var(--tb-gold);
    border-radius: 6px;
    color: var(--tb-btn-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    opacity: 0.72;
  }
  .tb-tab-drop-end.active { background: color-mix(in srgb, var(--tb-gold) 18%, transparent); opacity: 1; }

  /* Khi thanh tab có nhiều tab bị co nhỏ, ẩn bớt nút X trên tab không active để ưu tiên hiển thị tiêu đề & icon */
  .tb-horiz-tabs.is-crowded .tb-tab-item:not(.active):not(:hover) .tb-tab-close {
    display: none;
  }
  .tb-horiz-tabs.is-crowded .tb-tab-item {
    padding: 0 5px 0 6px;
    gap: 4px;
  }

  .tb-tab-fav {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .tb-tab-title {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tb-container-tag {
    font-size: 9px;
    font-weight: 700;
    color: var(--tb-gold);
    background: var(--tb-accent-soft);
    padding: 1px 4px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .tb-worker-badge {
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
  .tb-worker-badge.bot {
    background: rgba(245, 158, 11, 0.18);
    color: #D97706;
    border: 1px solid rgba(245, 158, 11, 0.4);
  }
  .tb-worker-badge.ai {
    background: var(--tb-ok-soft);
    color: var(--tb-ok);
    border: 1px solid rgba(16, 185, 129, 0.4);
  }
  .tb-tab-close {
    width: 16px;
    height: 16px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--tb-sub);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.12s ease, background-color 0.12s ease, color 0.12s ease;
  }
  .tb-tab-item.active .tb-tab-close { opacity: 0.65; }
  .tb-tab-item:hover .tb-tab-close { opacity: 1; }
  .tb-tab-close:hover {
    opacity: 1 !important;
    color: var(--tb-danger);
    background: var(--tb-danger-soft);
  }

  .omni-sec {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--tb-sub);
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }
  .omni-sec svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
  }
  #tb_url_input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--tb-btn-fg);
    font-size: 12px;
    outline: none;
    user-select: text;
  }
  #tb_url_input::placeholder { color: var(--tb-sub); }
  .omni-mini-btn {
    height: 21px;
    width: 22px;
    padding: 0;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--tb-sub);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .omni-mini-btn:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-btn-fg);
  }
  .omni-mini-btn svg {
    width: 12.5px;
    height: 12.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
  }

  .tb-right-tools {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-left: auto;
    height: 100%;
    flex-shrink: 0;
  }

  /* Khu vực ghim Extension */
  .tb-pinned-ext-zone {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 0 3px;
    height: 28px;
    border-radius: 8px;
    background: var(--tb-btn-bg);
    border: 1px solid var(--tb-border-subtle);
  }
  .tb-pinned-ext-btn {
    height: 22px;
    min-width: 22px;
    padding: 0 5px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--tb-sub);
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .tb-pinned-ext-btn:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-btn-fg);
  }
  .tb-pinned-ext-btn.on {
    color: var(--tb-ok);
  }
  .tb-pinned-ext-btn svg {
    width: 12.5px;
    height: 12.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
  }

  /* Menu Extension Popover */
  .tb-ext-popover {
    display: none;
    position: absolute;
    top: 36px;
    right: 0;
    width: 268px;
    background: var(--tb-card);
    border: 1px solid var(--tb-gold-line);
    border-radius: 12px;
    box-shadow: var(--tb-shadow);
    padding: 10px;
    z-index: 9999;
    color: var(--tb-btn-fg);
  }
  .tb-ext-popover.open { display: block; }
  .tb-tab-ctx-menu {
    display: none;
    position: fixed;
    z-index: 10050;
    min-width: 192px;
    max-width: 256px;
    max-height: 326px;
    overflow-y: auto;
    padding: 6px;
    background: var(--tb-card);
    border: 1px solid rgba(226, 190, 104, 0.28);
    border-radius: 12px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.56);
    color: var(--tb-btn-fg);
  }
  html[data-theme="carrara-light"] .tb-tab-ctx-menu {
    border-color: rgba(122, 81, 11, 0.26);
    box-shadow: 0 12px 30px rgba(48, 34, 12, 0.18);
  }
  .tb-tab-ctx-menu.open {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .tb-tab-ctx-menu.compact { padding: 4px; gap: 1px; }
  .tb-tab-ctx-menu button {
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--tb-btn-fg);
    padding: 6px 10px;
    text-align: left;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tb-tab-ctx-menu button:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-gold);
  }
  .tb-tab-ctx-menu button.danger:hover {
    background: rgba(239, 68, 68, 0.16);
    color: #f87171;
  }
  .tb-tab-ctx-sep {
    height: 1px;
    background: var(--tb-border-subtle);
    margin: 3px 6px;
  }
  .tb-ext-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 7px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--tb-border-subtle);
  }
  .tb-ext-title {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--tb-gold);
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }
  .tb-ext-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 190px;
    overflow-y: auto;
  }
  .tb-ext-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    background: var(--tb-btn-bg);
    border: 1px solid transparent;
  }
  .tb-ext-row:hover { border-color: var(--tb-border-subtle); }
  .tb-ext-name {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--tb-btn-fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tb-ext-sub {
    font-size: 10px;
    color: var(--tb-sub);
  }
  .tb-ext-pin-btn {
    border: 1px solid var(--tb-border-subtle);
    background: transparent;
    color: var(--tb-sub);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .tb-ext-pin-btn.pinned {
    color: var(--tb-gold);
    background: var(--tb-accent-soft);
    border-color: var(--tb-gold-line);
  }

  .zoom-pill {
    display: inline-flex;
    align-items: center;
    height: 26px;
    border-radius: 8px;
    border: 1px solid var(--tb-border-subtle);
    background: var(--tb-btn-bg);
    overflow: hidden;
  }
  .zoom-pill button {
    border: none;
    background: transparent;
    color: var(--tb-sub);
    height: 100%;
    padding: 0 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .zoom-pill button:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-btn-fg);
  }

  .tb-win-controls {
    display: flex;
    align-items: center;
    height: 100%;
    margin-left: 4px;
    border-left: 1px solid var(--tb-border-subtle);
    flex-shrink: 0;
  }
  .tb-win-btn {
    height: 100%;
    min-width: 38px;
    border: none;
    background: transparent;
    color: var(--tb-sub);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .tb-win-btn svg {
    width: 11.5px;
    height: 11.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
  }
  .tb-win-btn:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-btn-fg);
  }
  .tb-win-btn.close-btn:hover {
    background: #c42b1c;
    color: #ffffff;
  }

  /* Bookmarks Bar */
  .tb-bookmarks-bar {
    display: none;
    width: 100%;
    height: 28px;
    min-height: 28px;
    align-items: center;
    gap: 4px;
    padding: 0 10px;
    background: var(--tb-bg);
    border-top: 1px solid var(--tb-border-subtle);
    overflow-x: auto;
    scrollbar-width: none;
    box-sizing: border-box;
  }
  .tb-bookmarks-bar::-webkit-scrollbar { display: none; }
  body.mode-horizontal.show-bm-bar .tb-bookmarks-bar { display: flex; }
  .tb-bm-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 8px;
    border-radius: 6px;
    font-size: 11.5px;
    color: var(--tb-sub);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    flex-shrink: 0;
  }
  .tb-bm-item:hover {
    background: var(--tb-btn-hover);
    border-color: var(--tb-border-subtle);
    color: var(--tb-btn-fg);
  }
  .tb-bm-fav {
    width: 13px;
    height: 13px;
    border-radius: 3px;
    display: inline-block;
    object-fit: contain;
    flex-shrink: 0;
  }
  .tb-bm-title {
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Command Bar Overlay */
  #command_bar_overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(6, 8, 12, 0.56);
    align-items: flex-start;
    justify-content: center;
    padding-top: 7vh;
  }
  .cmd-card {
    width: min(640px, 92vw);
    max-height: 78vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--tb-gold-line);
    border-radius: 14px;
    background: var(--tb-card);
    color: var(--tb-btn-fg);
    box-shadow: var(--tb-shadow);
  }
  .cmd-input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-bottom: 1px solid var(--tb-border-subtle);
  }
  .cmd-input-wrap svg {
    width: 15px;
    height: 15px;
    stroke: var(--tb-gold);
    fill: none;
    stroke-width: 1.8;
    flex-shrink: 0;
  }
  #command_bar_input {
    flex: 1;
    min-width: 0;
    padding: 14px 0;
    border: 0;
    outline: none;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 14.5px;
    user-select: text;
  }
  #command_bar_input::placeholder { color: var(--tb-sub); }
  .cmd-esc-hint {
    font-size: 10px;
    font-weight: 700;
    color: var(--tb-sub);
    background: var(--tb-btn-bg);
    border: 1px solid var(--tb-border-subtle);
    padding: 2px 7px;
    border-radius: 5px;
  }
  #command_bar_results {
    max-height: 58vh;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cmd-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--tb-sub);
    border: 1px solid transparent;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .cmd-row:hover { background: var(--tb-bg-hover); color: var(--tb-btn-fg); }
  .cmd-row[aria-selected="true"] {
    background: var(--tb-accent-soft);
    border-color: var(--tb-gold-line);
    color: var(--tb-btn-fg);
  }
  .cmd-row-label {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
  .cmd-row-badge {
    font-size: 10px;
    font-weight: 600;
    color: var(--tb-sub);
    background: var(--tb-btn-bg);
    padding: 2px 8px;
    border-radius: 99px;
    flex-shrink: 0;
  }
  .cmd-row[aria-selected="true"] .cmd-row-badge {
    color: var(--tb-gold);
    background: rgba(212, 175, 55, 0.16);
  }

  @media (max-width: 1040px) {
    .hide-compact { display: none; }
  }
</style>
</head>
<body>

    <div class="tb-right-tools tb-no-drag">
      <button type="button" class="tb-ico-btn" id="btn_bookmark" onclick="sendRust({cmd:'bookmark_active'})" title="Thêm / Bỏ Bookmark trang này (Ctrl+D)" aria-label="Thêm Bookmark">
        <svg viewBox="0 0 16 16"><path d="M8 2.2l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z"/></svg>

      <!-- Khu vực ghim Extension -->
      <div id="tb_pinned_extensions" class="tb-pinned-ext-zone" aria-label="Tiện ích đã ghim"></div>

      <div style="position:relative;">
        <button type="button" class="tb-ico-btn" id="btn_downloads" onclick="toggleDownloadsMenu(event)" title="Tải xuống" aria-label="Tải xuống">
          <svg viewBox="0 0 16 16"><path d="M8 2.5v7M5.2 7.5 8 10.3l2.8-2.8M3 12.5h10"/></svg>
          <span id="tb_download_count" class="tb-badge" style="display:none;"></span>
        </button>
        <div id="tb_download_popover" class="tb-ext-popover tb-no-drag" role="dialog" aria-label="Tải xuống">
          <div class="tb-ext-head"><span class="tb-ext-title">Tải xuống</span></div>
          <div id="tb_download_list" class="tb-ext-list"></div>

      </div>

      <!-- Menu Extension -->
      <div style="position:relative;">
        <button type="button" class="tb-ico-btn" id="btn_extensions" onclick="toggleExtensionMenu(event)" title="Tiện ích mở rộng (Extensions)" aria-label="Tiện ích mở rộng">
          <svg viewBox="0 0 16 16"><path d="M6.2 3a1.5 1.5 0 0 1 3 0v1h2.3a1 1 0 0 1 1 1v2.2h1a1.5 1.5 0 0 1 0 3h-1V12.5a1 1 0 0 1-1 1H9.2v-1a1.5 1.5 0 0 0-3 0v1H3.5a1 1 0 0 1-1-1V9.8h1a1.5 1.5 0 0 0 0-3h-1V5a1 1 0 0 1 1-1h2.7V3z"/></svg>
        </button>

      <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'print_active'})" title="In hoặc lưu PDF (Ctrl+P)">
        <svg viewBox="0 0 16 16"><path d="M4 6V2.8h8V6M4 11H2.5V6.5h11V11H12"/><path d="M4 9.5h8v3.7H4z"/></svg>

      <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'open_devtools'})" title="Developer Tools (F12)">
        <svg viewBox="0 0 16 16"><path d="M2.5 3.5h11v9h-11z"/><path d="m5 6 2 2-2 2M8.5 10h2.5"/></svg>
      </button>

      <div class="zoom-pill hide-compact" title="Thu phóng trang (Ctrl+ / Ctrl- / Ctrl+0)">
        <button type="button" onclick="sendRust({cmd:'zoom_step', delta:-10})" title="Thu nhỏ (Ctrl+-)">-</button>
        <button type="button" id="lbl_zoom_pct" onclick="sendRust({cmd:'zoom_reset'})" title="Đặt lại 100% (Ctrl+0)">100%</button>
        <button type="button" onclick="sendRust({cmd:'zoom_step', delta:10})" title="Phóng to (Ctrl++)">+</button>

        <svg viewBox="0 0 12 12"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg>

  <div id="tb_bookmarks_bar" class="tb-bookmarks-bar tb-no-drag"></div>

  <script>/*__TP_MOTION_JS__*/</script>
  <script>/*__TP_BRAND_ASSETS_JS__*/</script>
  <script>
    var currentUrl = "";
    var currentTheme = document.documentElement.getAttribute("data-theme") || "obsidian-gold";
    var currentLogoStyle = "ribbon";
    var lastSyncState = null;

    var defaultExtensions = [
      { id: "ublock", name: "uBlock Origin Lite + ABPVN", desc: "Khiên chặn quảng cáo 3 lớp", pinned: true, enabled: true },
      { id: "ai_cowork", name: "TP AI Cowork", desc: "Trợ lý tự động hóa tác vụ", pinned: true, enabled: true }
    ];
    var pinnedExtIds = { ublock: true, ai_cowork: true };

    function syncTitlebarBrand() {
      var img = document.getElementById("tb_brand_icon");
      if (img && window.__tpResolveBrandAsset) {
        var src = window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme);
        if (src && img.getAttribute("src") !== src) img.src = src;
      }
    }

    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    function openTabInContainer(containerId) {
      sendRust({cmd:"new_tab", url:"tp://newtab", isolated:false, container_id:containerId || "default"});
    }

    function submitUrl(e) {
      e.preventDefault();
      var inp = document.getElementById("tb_url_input");
      var val = (inp.value || "").trim();
      if (!val) return;
      if (val.toLowerCase().startsWith("@ai ")) {
        sendRust({ cmd: "run_ai_prompt", prompt: val.slice(4).trim() });
      } else {
        sendRust({ cmd: "navigate_active", url: val });
      }
      inp.blur();
    }

    function copyCurrentUrl() {
      var val = currentUrl || document.getElementById("tb_url_input").value || "tp://newtab";
      sendRust({ cmd: "copy_to_clipboard", text: val });
      var btn = document.getElementById("btn_copy_url");
      if (btn) {
        var prev = btn.innerHTML;
        btn.textContent = "✓";
        btn.style.color = "var(--tb-ok)";
        setTimeout(function(){
          btn.innerHTML = prev;
          btn.style.color = "";
        }, 1100);
      }
    }

    function getExtensionsList() {
      if (lastSyncState && Array.isArray(lastSyncState.extensions) && lastSyncState.extensions.length) {
        return lastSyncState.extensions;
      }
      return defaultExtensions;
    }

    function renderPinnedExtensions() {
      var zone = document.getElementById("tb_pinned_extensions");
      if (!zone) return;
      zone.replaceChildren();
      var list = getExtensionsList().filter(function(ext) { return !!pinnedExtIds[ext.id]; });
      zone.style.display = list.length ? "inline-flex" : "none";
      list.forEach(function(ext) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tb-pinned-ext-btn" + (ext.enabled !== false ? " on" : "");
        b.title = ext.name + (ext.desc ? " — " + ext.desc : "");
        if (ext.id === "ublock") {
          b.innerHTML = '<svg viewBox="0 0 16 16"><path d="M8 2L3 4.2v3.6c0 3.2 2.1 5.4 5 6.4 2.9-1 5-3.2 5-6.4V4.2L8 2Z"/></svg>';
          b.onclick = function() { sendRust({ cmd: "open_extension", id: "ublock", page: "popup" }); };
        } else if (ext.id === "ai_cowork") {
          b.textContent = "AI";
          b.onclick = function() { sendRust({ cmd: "open_chat_channel", channel: "ai" }); };
        } else {
          b.textContent = (ext.name || "E").slice(0, 2).toUpperCase();
          b.onclick = function() { sendRust({ cmd: "open_extension", id: ext.id, page: "popup" }); };
        }
        zone.appendChild(b);
      });
    }

    function renderDownloads() {
      var box = document.getElementById("tb_download_list");
      var badge = document.getElementById("tb_download_count");
      if (!box || !badge) return;
      var list = (lastSyncState && Array.isArray(lastSyncState.downloads)) ? lastSyncState.downloads : [];
      box.replaceChildren();
      var active = list.filter(function(x) { return x.status === "downloading"; }).length;
      badge.textContent = active ? String(active) : "";
      badge.style.display = active ? "inline-flex" : "none";
      if (!list.length) {
        var empty = document.createElement("div"); empty.className = "tb-ext-empty"; empty.textContent = "Chưa có tệp tải xuống"; box.appendChild(empty); return;
      }
      list.slice().reverse().forEach(function(item) {
        var row = document.createElement("div"); row.className = "tb-ext-row";
        var meta = document.createElement("div"); meta.style.cssText = "min-width:0;flex:1;";
        var fullPath = String(item.path || item.uri || "Tệp tải xuống");
        var baseName = fullPath.split(/[\\/]/).pop() || fullPath;
        var name = document.createElement("div"); name.className = "tb-ext-name"; name.title = fullPath; name.textContent = baseName;
        var status = document.createElement("div"); status.className = "tb-ext-desc"; status.textContent = item.status === "complete" ? "Đã tải xong" : item.status === "failed" ? "Tải thất bại" : "Đang tải...";
        meta.appendChild(name); meta.appendChild(status); row.appendChild(meta);
        if (item.path && item.status === "complete") {
          var openBtn = document.createElement("button");
          openBtn.type = "button";
          openBtn.className = "tb-ext-pin-btn";
          openBtn.textContent = "Mở";
          openBtn.onclick = function(ev) {
            ev.stopPropagation();
            sendRust({ cmd: "open_downloaded_file", path: item.path });
          };
          row.appendChild(openBtn);
        }
        var dirBtn = document.createElement("button");
        dirBtn.type = "button";
        dirBtn.className = "tb-ext-pin-btn";
        dirBtn.title = "Mở thư mục";
        dirBtn.textContent = "📁";
        dirBtn.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "open_download_folder", path: item.path || "" });
        };
        row.appendChild(dirBtn);
        box.appendChild(row);
      });
    }

    function getZenContextPrefs() {
      var p = lastSyncState && lastSyncState.context_menu_prefs && typeof lastSyncState.context_menu_prefs === "object"
        ? lastSyncState.context_menu_prefs
        : {};
      return {
        hide_separators: p.hide_separators !== false,
        clean_copy_link: p.clean_copy_link !== false,
        hide_mute: !!p.hide_mute,
        hide_unload: !!p.hide_unload,
        hide_pin_essentials: !!p.hide_pin_essentials,
        hide_split: !!p.hide_split,
        hide_move_space: !!p.hide_move_space,
        hide_duplicate: !!p.hide_duplicate,
        hide_close_others: !!p.hide_close_others
      };
    }

    function cleanTrackingUrl(raw) {
      var str = String(raw || "").trim();
      if (!/^https?:\/\//i.test(str)) return str;
      try {
        var u = new URL(str);
        var strip = ["fbclid","gclid","dclid","msclkid","mc_cid","mc_eid","si","igsh","ref_src","_hsenc","_hsmi"];
        var toDel = [];
        u.searchParams.forEach(function(_, k) {
          var kl = k.toLowerCase();
          if (kl.indexOf("utm_") === 0 || strip.indexOf(kl) !== -1) toDel.push(k);
        });
        toDel.forEach(function(k) { u.searchParams.delete(k); });
        return u.toString();
      } catch (_) { return str; }
    }

    function closeHorizTabContextMenu() {
      var m = document.getElementById("tb_tab_context_menu");
      if (!m || !m.classList.contains("open")) return;
      m.classList.remove("open");
      m.replaceChildren();
      sendRust({ cmd: "close_titlebar_popover" });
    }

    function openHorizTabContextMenu(x, y, tab, isAct) {
      var m = document.getElementById("tb_tab_context_menu");
      if (!m) return;
      var dl = document.getElementById("tb_download_popover"); if (dl) dl.classList.remove("open");
      var ext = document.getElementById("tb_ext_popover"); if (ext) ext.classList.remove("open");
      m.replaceChildren();
      var prefs = getZenContextPrefs();
      m.classList.toggle("compact", prefs.hide_separators);
      function addItem(label, onClick, isDanger) {
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("role", "menuitem");
        if (isDanger) b.className = "danger";
        b.textContent = label;
        b.onclick = function() {
          closeHorizTabContextMenu();
          onClick();
        };
        m.appendChild(b);
      }
      function addSep() {
        if (prefs.hide_separators) return;

    function resolveTabFavicon(t) {
      if (!t) return "";

        return window.__tpResolveBrandAsset ? window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme) : "";

      if (t.favicon) return t.favicon;
      try {
        if (t.url && (t.url.startsWith("http://") || t.url.startsWith("https://"))) {
          var host = new URL(t.url).hostname;
          if (host) return "https://www.google.com/s2/favicons?sz=32&domain=" + encodeURIComponent(host);
        }
      } catch (_) {}
      return "";

    function updateHorizontalCrowdedState() {
      var box = document.getElementById("tb_horiz_tabs");

      var count = box.children.length;
      if (!count) {
        box.classList.remove("is-crowded");

    var horizontalDragTabId = null;

    function appendHorizontalEndDropTarget(box, tabs) {
      var zone = document.createElement("div");
      zone.className = "tb-tab-drop-end tb-no-drag";
      zone.textContent = "Thả ở cuối";
      zone.addEventListener("dragover", function(ev) {
        if (horizontalDragTabId) {
          ev.preventDefault();
          ev.dataTransfer.dropEffect = "move";
          zone.classList.add("active");
        }
      });
      zone.addEventListener("dragleave", function() { zone.classList.remove("active"); });
      zone.addEventListener("drop", function(ev) {
        zone.classList.remove("active");
        var sourceId = Number(ev.dataTransfer.getData("text/tp-tab-id"));
        horizontalDragTabId = null;
        var source = tabs.find(function(t) { return t.id === sourceId; });
        var targets = tabs.filter(function(t) {
          return !t.worker_kind && source && t.id !== source.id && !!t.pinned === !!source.pinned && !!t.essential === !!source.essential;
        });
        var target = targets.length ? targets[targets.length - 1] : null;
        if (!source || !target) return;
        ev.preventDefault();
        sendRust({ cmd: "reorder_tab", source_id: source.id, target_id: target.id, after: true });
      });
      box.appendChild(zone);
    }

    function renderHorizontalTopTabs(tabs, activeIdx) {
      var box = document.getElementById("tb_horiz_tabs");
      if (!box) return;
      box.replaceChildren();
      if (!Array.isArray(tabs)) return;
      var activeEl = null;
      for (var i = 0; i < tabs.length; i++) {
        (function(idx, t) {
          var item = document.createElement("div");
          var isAct = idx === activeIdx;
          item.className = "tb-tab-item tb-no-drag" + (isAct ? " active" : "") + (t.sleeping ? " sleeping" : "");
          item.title = (t.title || t.url || "") + (t.sleeping ? " (Đang ngủ đông)" : "");
          item.onclick = function() { sendRust({ cmd: "focus_index", index: t.native_idx }); };
          item.addEventListener("contextmenu", function(ev) {
            ev.preventDefault();
            ev.stopPropagation();
            openHorizTabContextMenu(ev.clientX, ev.clientY, t, isAct);
          });

          if (!t.worker_kind && typeof t.id === "number") {
            item.draggable = true;
            item.addEventListener("dragstart", function(ev) {
              item.classList.add("dragging");
              horizontalDragTabId = t.id;
              ev.dataTransfer.setData("text/tp-tab-id", String(t.id));
              ev.dataTransfer.effectAllowed = "move";
            });
            item.addEventListener("dragend", function(ev) {
              item.classList.remove("dragging");
              var strip = document.getElementById("tb_horiz_tabs");
              var rect = strip && strip.getBoundingClientRect();
              var outsideStrip = rect && (ev.clientX < rect.left - 24 || ev.clientX > rect.right + 24
                || ev.clientY < rect.top - 24 || ev.clientY > rect.bottom + 24);
              if (outsideStrip && horizontalDragTabId === t.id) {
                sendRust({
                  cmd: "detach_tab_to_new_window",
                  tab_id: t.id,
                  intent: "drag_out",
                  screen_x: Number.isFinite(ev.screenX) ? Math.trunc(ev.screenX) : null,
                  screen_y: Number.isFinite(ev.screenY) ? Math.trunc(ev.screenY) : null
                });
              }
              horizontalDragTabId = null;
            });
            item.addEventListener("dragover", function(ev) {
              if (horizontalDragTabId && horizontalDragTabId !== t.id) {
                ev.preventDefault();
                ev.dataTransfer.dropEffect = "move";
                var rect = item.getBoundingClientRect();
                var isLeft = (ev.clientX - rect.left) < rect.width * 0.5;
                item.classList.toggle("drop-before", isLeft);
                item.classList.toggle("drop-after", !isLeft);
              }
            });
            item.addEventListener("dragleave", function() {
              item.classList.remove("drop-before", "drop-after");
            });
            item.addEventListener("drop", function(ev) {
              item.classList.remove("drop-before", "drop-after");
              var sourceId = Number(ev.dataTransfer.getData("text/tp-tab-id"));
              horizontalDragTabId = null;
              if (!sourceId || sourceId === t.id) return;
              ev.preventDefault();
              var rect = item.getBoundingClientRect();
              var after = (ev.clientX - rect.left) >= rect.width * 0.5;
              sendRust({ cmd: "reorder_tab", source_id: sourceId, target_id: t.id, after: after });
            });
          }

          var favUrl = resolveTabFavicon(t);
          var img = document.createElement("img");
          img.className = "tb-tab-fav";
          img.src = favUrl || fallbackWebFavicon();
          img.alt = "";
          img.draggable = false;
          img.onerror = function() {

          item.appendChild(img);

          if (t.worker_kind === "bot" || t.worker_kind === "ai") {

          var span = document.createElement("span");

          span.textContent = t.title || (t.url === "tp://newtab" ? "Trang Bắt Đầu" : (t.url === "tp://workspace" ? "Sàn TMĐT" : t.url));
          item.appendChild(span);

          if (t.container_id && t.container_id !== "default") {
            var ct = document.createElement("span");
            ct.className = "tb-container-tag";
            ct.textContent = t.container_id;
            item.appendChild(ct);
          }

          if (t.audible || t.muted) {
            var aud = document.createElement("span");
            aud.style.cssText = "font-size:10px;flex-shrink:0;opacity:0.85;";
            aud.textContent = t.muted ? "🔇" : "🔊";
            aud.title = t.muted ? "Bật tiếng Tab" : "Tắt tiếng Tab";
            aud.onclick = function(ev) {
              ev.stopPropagation();
              sendRust({ cmd: "toggle_tab_mute", tab_id: t.id });
            };
            item.appendChild(aud);
          }

          var cls = document.createElement("button");
          cls.type = "button";
          cls.className = "tb-tab-close tb-no-drag";
          cls.textContent = "×";
          cls.title = "Đóng tab (Ctrl+W)";
          cls.onclick = function(ev) {
            ev.stopPropagation();
            sendRust({ cmd: "close_index", index: t.native_idx });
          };
          item.appendChild(cls);
          box.appendChild(item);
          if (isAct) activeEl = item;
        })(i, tabs[i]);
      }

      appendHorizontalEndDropTarget(box, tabs);
      updateHorizontalCrowdedState();
      if (activeEl && typeof activeEl.scrollIntoView === "function") {
        activeEl.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      }
    }

    function renderCommandBar() {
      var s = lastSyncState || {};
      var i = document.getElementById("command_bar_input");
      var b = document.getElementById("command_bar_results");
      var rawQ = (i.value || "").trim();
      var q = rawQ.toLocaleLowerCase();
      var tabs = (s.tabs || []).filter(function(t) { return !t.worker_kind; }).map(function(t) {

      });
      var ws = (s.workspaces || []).map(function(w) {
        return { label: (w.icon ? w.icon + " " : "") + (w.name || w.id), detail: "Space", id: w.id, cmd: "set_active_workspace" };
      });
      var activeTab = (s.tabs || [])[s.active_idx || 0];
      var cs = [
        { label: "Sao chép URL (Ctrl+Shift+C)", cmd: "copy_active_url" },
        { label: "Ghim / Bỏ ghim Tab", cmd: "toggle_tab_pinned" },
        { label: "Nhân đôi Tab hiện tại", cmd: "duplicate_tab", id: activeTab && activeTab.id },
        { label: "Chia khung: Đổi chế độ (Alt+M)", cmd: "cycle_view_mode" },
        { label: "Chia khung: Đảo vị trí", cmd: "swap_split_tabs" },
        { label: "Chia khung: Hủy chia", cmd: "unsplit" },
        { label: "Zen Boosts: Tùy biến CSS trang này", cmd: "open_boosts_panel" },
        { label: "Zen Boosts: Zap ẩn phần tử rác", cmd: "start_zap_mode" },
        { label: "Back", cmd: "nav_back" },
        { label: "Forward", cmd: "nav_forward" },
        { label: "Reload", cmd: "reload" },
        { label: "New Tab", cmd: "new_tab" },
        { label: "Close Tab", cmd: "close_tab_by_id", id: activeTab && activeTab.id }
      ].map(function(x) { x.detail = "Lệnh"; return x; });

      var direct = [];
      if (rawQ) {
        if (q.indexOf("@ai ") === 0) {
          direct.push({ label: "AI Cowork: " + rawQ.slice(4), detail: "AI", cmd: "run_ai_prompt", value: rawQ.slice(4).trim() });
        } else {
          direct.push({ label: "Mở / Tìm: " + rawQ, detail: "URL", cmd: "navigate_active", value: rawQ });
        }
      }
      var matched = tabs.concat(ws, cs).filter(function(x) {
        return !q || (x.label + " " + x.detail).toLocaleLowerCase().includes(q);
      });
      commandBarItems = direct.concat(matched);
      commandBarSelected = Math.max(0, Math.min(commandBarSelected, Math.max(0, commandBarItems.length - 1)));
      b.replaceChildren();
      var selectedEl = null;
      commandBarItems.forEach(function(x, n) {
        var r = document.createElement("div");
        r.className = "cmd-row";

        r.setAttribute("aria-selected", String(isSel));

        lbl.className = "cmd-row-label";
        lbl.textContent = x.label;
        var badge = document.createElement("span");
        badge.className = "cmd-row-badge";
        badge.textContent = x.detail;
        r.appendChild(lbl);
        r.appendChild(badge);
        r.onclick = function() { activateCommandBar(n); };
        b.appendChild(r);
        if (isSel) selectedEl = r;
      });
      if (selectedEl && typeof selectedEl.scrollIntoView === "function") {
        selectedEl.scrollIntoView({ block: "nearest" });

    function activateCommandBar(n) {
      var x = commandBarItems[n];
      if (!x) return;
      closeCommandBar(false);
      if (x.cmd === "focus_tab_by_id" || x.cmd === "close_tab_by_id" || x.cmd === "duplicate_tab") {
        if (x.id != null) sendRust({ cmd: x.cmd, tab_id: x.id });
      } else if (x.cmd === "set_active_workspace") {
        sendRust({ cmd: x.cmd, workspace_id: x.id });
      } else if (x.cmd === "new_tab") {
        sendRust({ cmd: "new_tab", url: "tp://newtab", isolated: false });
      } else if (x.cmd === "navigate_active") {
        sendRust({ cmd: x.cmd, url: x.value });
      } else if (x.cmd === "run_ai_prompt") {
        sendRust({ cmd: "open_chat_channel", channel: "ai" });
        sendRust({ cmd: "run_ai_prompt", prompt: x.value });
      } else {
        sendRust({ cmd: x.cmd });
      }
    }

    function openCommandBar() {
      var o = document.getElementById("command_bar_overlay");
      var i = document.getElementById("command_bar_input");
      commandBarFocus = document.activeElement;
      o.style.display = "flex";
      i.value = "";
      commandBarSelected = 0;
      renderCommandBar();
      i.focus();
    }

    document.getElementById("command_bar_input").addEventListener("input", function() {
      commandBarSelected = 0;
      renderCommandBar();
    });
    document.getElementById("command_bar_input").addEventListener("keydown", function(e) {
      if (e.key === "Escape") { e.preventDefault(); closeCommandBar(false); }
      else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (commandBarItems.length) {
          commandBarSelected = (commandBarSelected + (e.key === "ArrowDown" ? 1 : -1) + commandBarItems.length) % commandBarItems.length;
          renderCommandBar();
        }
      } else if (e.key === "Enter") {
        e.preventDefault();
        activateCommandBar(commandBarSelected);
      }
    });
    document.getElementById("command_bar_overlay").addEventListener("mousedown", function(e) {
      if (e.target === this) closeCommandBar(false);
    });
    window.__tpOpenCommandBar = openCommandBar;
    window.__tpCloseCommandBar = closeCommandBar;

    var urlDropdownItems = [];
    var urlDropdownSelected = -1;
    var urlDropdownOpen = false;

    function openUrlDropdown() {
      var box = document.getElementById("tb_url_dropdown");
      if (!box) return;
      closeExtensionMenu();
      urlDropdownOpen = true;
      box.hidden = false;
      sendRust({ cmd: "open_titlebar_popover" });
    }

    function closeUrlDropdown() {
      var box = document.getElementById("tb_url_dropdown");
      if (!box || !urlDropdownOpen) return;
      urlDropdownOpen = false;
      urlDropdownSelected = -1;
      box.hidden = true;
      sendRust({ cmd: "close_titlebar_popover" });
    }

    function highlightUrlDropdownSelected() {
      var box = document.getElementById("tb_url_dropdown");
      if (!box) return;
      var rows = box.querySelectorAll(".tb-url-row");
      rows.forEach(function(r, idx) {
        var isSel = idx === urlDropdownSelected;
        r.classList.toggle("selected", isSel);
        if (isSel && typeof r.scrollIntoView === "function") {
          r.scrollIntoView({ block: "nearest" });
        }
      });
      if (urlDropdownSelected >= 0 && urlDropdownItems[urlDropdownSelected]) {
        var item = urlDropdownItems[urlDropdownSelected];
        var inp = document.getElementById("tb_url_input");
        if (inp && item.url && item.kind !== "search" && item.kind !== "ai") {
          inp.value = item.url;
        }
      }
    }

    function executeUrlDropdownItem(item) {
      if (!item) return;
      closeUrlDropdown();
      var inp = document.getElementById("tb_url_input");
      if (inp) inp.blur();
      if (item.cmd === "focus_tab_by_id" && item.tab_id) {
        sendRust({ cmd: "focus_tab_by_id", tab_id: item.tab_id });
      } else if (item.cmd === "run_ai_prompt" && item.prompt) {
        sendRust({ cmd: "open_chat_channel", channel: "ai" });
        sendRust({ cmd: "run_ai_prompt", prompt: item.prompt });
      } else if (item.cmd === "navigate_active" && item.url) {
        sendRust({ cmd: "navigate_active", url: item.url });
      } else if (item.url) {
        sendRust({ cmd: "navigate_active", url: item.url });
      }
    }

    function urlInputLooksLikeAddress(input) {
      var value = (input || "").trim();
      if (!value || /\s/.test(value)) return false;
      if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return true;
      var host = value.split(/[\/?#]/, 1)[0].toLowerCase();
      if (host === "localhost" || host.indexOf("localhost:") === 0) return true;
      var address = host.split(":", 1)[0];
      var ipv4 = address.split(".");
      if (ipv4.length === 4 && ipv4.every(function(part) { return /^(?:0|[1-9]\d{0,2})$/.test(part) && Number(part) <= 255; })) return true;
      return address.indexOf(".") > 0 && !address.startsWith(".") && !address.endsWith(".");
    }

    function urlSuggestionScore(query, title, url, recentRank) {
      var meta = arguments[4];
      if (!query) return recentRank || 0;
      var q = query.toLowerCase();
      var loweredTitle = (title || "").toLowerCase();
      var loweredUrl = (url || "").toLowerCase();
      var host = loweredUrl.replace(/^[a-z][a-z0-9+.-]*:\/\//, "").split(/[\/?#]/, 1)[0];
      var score = 0;
      if (host.indexOf(q) === 0) score += 140;
      if (loweredUrl.indexOf(q) === 0) score += 120;
      if (loweredTitle.indexOf(q) === 0) score += 100;
      if (loweredTitle.includes(q)) score += 60;
      if (loweredUrl.includes(q)) score += 40;
      if (meta) {
        var kw = String(meta.keyword || "").trim().toLowerCase();
        var folder = String(meta.folder || "").trim().toLowerCase();
        var tags = Array.isArray(meta.tags) ? meta.tags.map(function(t) { return String(t || "").toLowerCase(); }) : [];
        if (kw && (q === kw || q === "@" + kw)) score += 960;
        else if (kw && kw.indexOf(q) === 0) score += 180;
        if (folder && folder.includes(q)) score += 50;
        for (var ti = 0; ti < tags.length; ti++) {
          var tg = tags[ti];
          if (!tg) continue;
          if (q === tg || q === "#" + tg) score += 160;
          else if (tg.includes(q)) score += 55;
        }
      }
      return score + (recentRank || 0);
    }

    function renderUrlDropdown(query) {
      var box = document.getElementById("tb_url_dropdown");
      if (!box) return;
      var st = lastSyncState || {};
      var raw = (query != null ? query : (document.getElementById("tb_url_input").value || "")).trim();
      var q = raw.toLowerCase();
      var items = [];
      var seenUrls = Object.create(null);

      function addSuggestion(item, recentRank, meta) {
        if (!item.url || seenUrls[item.url]) return;
        seenUrls[item.url] = true;
        item.score = urlSuggestionScore(q, item.title, item.url, recentRank, meta);
        items.push(item);
      }

      if (raw.startsWith("@ai ")) {
        var promptText = raw.slice(4).trim();
        items.push({ title: "Giao việc cho AI Cowork: " + promptText, subtitle: "Bấm Enter để gửi prompt vào kênh AI", badge: "AI Cowork", ico: "🤖", cmd: "run_ai_prompt", prompt: promptText, kind: "ai", score: 1000 });
      }

      (st.tabs || []).forEach(function(t, index) {
        if (t.worker_kind) return;
        var tTitle = t.title || t.url || "Tab";
        var tUrl = t.url || "";
        if (!q || urlSuggestionScore(q, tTitle, tUrl, 0) > 0) addSuggestion({ title: tTitle, subtitle: tUrl, badge: "Đang mở", fav: resolveTabFavicon(t), cmd: "focus_tab_by_id", tab_id: t.id, url: tUrl, kind: "tab", categoryOrder: 0 }, Math.max(0, 16 - index));
      });

      (st.bookmarks || []).forEach(function(b, index) {
        var bTitle = b.title || b.url || "Bookmark";
        var bUrl = b.url || "";
        var meta = { folder: b.folder || "", tags: Array.isArray(b.tags) ? b.tags : [], keyword: b.keyword || "" };
        if (!q || urlSuggestionScore(q, bTitle, bUrl, 0, meta) > 0) {
          var subParts = [];
          if (meta.folder) subParts.push("[" + meta.folder + "]");
          subParts.push(bUrl);
          if (meta.keyword) subParts.push("@" + meta.keyword);
          if (meta.tags.length) subParts.push(meta.tags.map(function(t) { return "#" + t; }).join(" "));
          addSuggestion({ title: bTitle, subtitle: subParts.join(" • "), badge: "Bookmark", fav: "", cmd: "navigate_active", url: bUrl, kind: "bookmark", categoryOrder: 1 }, Math.max(0, 8 - index), meta);
        }
      });

      var hist = (st.history || []).slice().reverse();
      hist.forEach(function(h, index) {
        var hTitle = h.title || h.url || "Lịch sử";
        var hUrl = h.url || "";
        if (!q || urlSuggestionScore(q, hTitle, hUrl, 0) > 0) addSuggestion({ title: hTitle, subtitle: hUrl, badge: "Lịch sử", fav: "", cmd: "navigate_active", url: hUrl, kind: "history", categoryOrder: 2 }, Math.max(0, 48 - index));
      });

      if (raw && !raw.startsWith("@ai ")) {
        var isAddress = urlInputLooksLikeAddress(raw);
        items.push({ title: isAddress ? "Mở trực tiếp: " + raw : "Tìm kiếm trên Web: " + raw, subtitle: isAddress ? raw : "Dùng công cụ tìm kiếm đã chọn", badge: isAddress ? "URL" : "Tìm kiếm", ico: isAddress ? "🌐" : "🔍", cmd: "navigate_active", url: raw, kind: isAddress ? "url" : "search", score: 900, categoryOrder: -1 });
      }

      items.sort(function(a, b) { return b.score - a.score || (a.categoryOrder || 0) - (b.categoryOrder || 0); });
      urlDropdownItems = items.slice(0, 20);
      urlDropdownSelected = -1;
      box.replaceChildren();

      if (urlDropdownItems.length === 0) {
        var empty = document.createElement("div");
        empty.style.cssText = "padding:12px;text-align:center;font-size:11.5px;color:var(--tb-sub);";
        empty.textContent = "Không tìm thấy gợi ý phù hợp";
        box.appendChild(empty);
        return;
      }

      urlDropdownItems.forEach(function(item, idx) {
        var row = document.createElement("div");
        row.className = "tb-url-row";
        row.setAttribute("role", "option");

        var ico = document.createElement("div");
        ico.className = "tb-url-ico";
        if (item.fav) {
          var img = document.createElement("img");
          img.src = item.fav;
          img.alt = "";
          img.onerror = function() { img.replaceWith(document.createTextNode("🌐")); };
          ico.appendChild(img);
        } else if (item.ico) {
          ico.textContent = item.ico;
        } else {
          ico.textContent = item.kind === "bookmark" ? "⭐" : "🕒";
        }
        row.appendChild(ico);

        var main = document.createElement("div");
        main.className = "tb-url-main";

        var tit = document.createElement("div");
        tit.className = "tb-url-title";
        tit.textContent = item.title;
        main.appendChild(tit);

        if (item.subtitle) {
          var sub = document.createElement("div");
          sub.className = "tb-url-subtitle";
          sub.textContent = item.subtitle;
          main.appendChild(sub);
        }
        row.appendChild(main);

        if (item.badge) {
          var bd = document.createElement("span");
          bd.className = "tb-url-badge";
          bd.textContent = item.badge;
          row.appendChild(bd);
        }

        row.onmousedown = function(ev) {
          ev.preventDefault();
          executeUrlDropdownItem(item);
        };
        box.appendChild(row);
      });
    }

    var urlDropdownRenderTimer = null;
    function scheduleUrlDropdownRender(query) {
      if (urlDropdownRenderTimer) clearTimeout(urlDropdownRenderTimer);
      urlDropdownRenderTimer = setTimeout(function() {
        urlDropdownRenderTimer = null;
        renderUrlDropdown(query);
      }, 80);
    }

    var omniInp = document.getElementById("tb_url_input");
    if (omniInp) {
      omniInp.addEventListener("focus", function() {
        renderUrlDropdown(omniInp.value);
        openUrlDropdown();
      });
      omniInp.addEventListener("input", function() {
        scheduleUrlDropdownRender(omniInp.value);
        openUrlDropdown();
      });
      omniInp.addEventListener("keydown", function(e) {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (urlDropdownItems.length) {
            urlDropdownSelected = (urlDropdownSelected + 1) % urlDropdownItems.length;
            highlightUrlDropdownSelected();
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (urlDropdownItems.length) {
            urlDropdownSelected = (urlDropdownSelected - 1 + urlDropdownItems.length) % urlDropdownItems.length;
            highlightUrlDropdownSelected();
          }
        } else if (e.key === "Enter") {
          if (urlDropdownOpen && urlDropdownSelected >= 0 && urlDropdownItems[urlDropdownSelected]) {
            e.preventDefault();
            executeUrlDropdownItem(urlDropdownItems[urlDropdownSelected]);
          } else {
            closeUrlDropdown();
          }
        } else if (e.key === "Escape") {
          e.preventDefault();
          closeUrlDropdown();
          omniInp.blur();
        }
      });
    }

    window.__tpSyncTitlebar = function (st) {
      if (!st) return;
      lastSyncState = lastSyncState ? Object.assign({}, lastSyncState, st) : st;
      if (Array.isArray(st.pinned_extensions)) {
        pinnedExtIds = {};
        st.pinned_extensions.forEach(function(id) { pinnedExtIds[id] = true; });
      }
      renderPinnedExtensions();
      renderDownloads();
      if (st.ui_theme) {
        currentTheme = st.ui_theme;
        document.documentElement.setAttribute("data-theme", st.ui_theme);
      }
      if (st.logo_style) {
        currentLogoStyle = st.logo_style;
      }
      syncTitlebarBrand();
      if (st.orientation) {
        document.body.classList.toggle("mode-horizontal", st.orientation === "horizontal");
        document.body.classList.toggle("mode-vertical", st.orientation !== "horizontal");
      }
      if (typeof st.show_bookmarks_bar === "boolean") {
        document.body.classList.toggle("show-bm-bar", st.show_bookmarks_bar);
      }
      if (Array.isArray(st.bookmarks)) {
        renderBookmarksBar(st.bookmarks);
      }
      if (Array.isArray(st.tabs)) {
        renderHorizontalTopTabs(st.tabs, typeof st.active_idx === "number" ? st.active_idx : 0);
      }
      if (typeof st.active_url === "string") {
        currentUrl = st.active_url;
        var inp = document.getElementById("tb_url_input");
        if (inp && document.activeElement !== inp) {
          inp.value = (st.active_url === "tp://newtab" || st.active_url === "tp://history") ? "" : st.active_url;
        }
        var sec = document.getElementById("tb_sec_ico");
        if (sec) {
          sec.style.color = st.active_url.startsWith("https://") ? "var(--tb-ok)" : "var(--tb-sub)";
        }
      }
      if (typeof st.is_bookmarked === "boolean") {
        var bm = document.getElementById("btn_bookmark");
        if (bm) bm.classList.toggle("bookmarked", st.is_bookmarked);
      }
      if (typeof st.zoom_pct === "number") {
        var zLbl = document.getElementById("lbl_zoom_pct");
        if (zLbl) zLbl.textContent = st.zoom_pct + "%";
      }
      var maxBtn = document.getElementById("btn_max");
      if (maxBtn) {
        maxBtn.innerHTML = st.maximized
          ? '<svg viewBox="0 0 12 12"><rect x="2" y="3.5" width="6.5" height="6.5" rx="1"/><path d="M4 3.5V2.5C4 2.2 4.2 2 4.5 2H9.5C9.8 2 10 2.2 10 2.5V7.5C10 7.8 9.8 8 9.5 8H8.5"/></svg>'
          : '<svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>';
      }
    };

    window.addEventListener("tp_config_changed", function (ev) {
      if (ev && ev.detail) {
        if (ev.detail.ui_theme) {
          currentTheme = ev.detail.ui_theme;
          document.documentElement.setAttribute("data-theme", currentTheme);
        }
        if (ev.detail.logo_style) {
          currentLogoStyle = ev.detail.logo_style;
        }
        syncTitlebarBrand();
      }
    });

    window.__tpExecuteTranslation = function(req) {
      if (!req || !Array.isArray(req.texts)) return;
      var targetLang = req.target_lang || "vi";
      var tabId = req.tab_id;
      var reqId = req.req_id;

      function translateSingle(text) {
        if (!text || !text.trim()) return Promise.resolve(text);
        var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" + encodeURIComponent(targetLang) + "&dt=t&q=" + encodeURIComponent(text);
        return fetch(url)
          .then(function(res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function(data) {
            if (data && Array.isArray(data[0])) {
              return data[0].map(function(item) { return item[0] || ""; }).join("");
            }
            return text;
          })
          .catch(function(err) {
            return text;
          });
      }

      Promise.all(req.texts.map(function(t) { return translateSingle(t); }))
        .then(function(translations) {
          sendRust({
            cmd: "translate_res",
            tab_id: tabId,
            req_id: reqId,
            translations: translations
          });
        })
        .catch(function() {
          sendRust({
            cmd: "translate_res",
            tab_id: tabId,
            req_id: reqId,
            translations: req.texts
          });
        });
    };

    /*__TP_BOOTSTRAP_JS__*/
    if (window.__TP_BOOTSTRAP__ && window.__tpSyncTitlebar) {
      window.__tpSyncTitlebar(window.__TP_BOOTSTRAP__);
    } else {
      syncTitlebarBrand();
      renderPinnedExtensions();
    }
    sendRust({ cmd: "ui_shell_ready", shell: "titlebar" });
  </script>
</body>
</html>
