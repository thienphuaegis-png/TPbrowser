<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>TPbrowser AI Cowork Panel</title>
<style>
/*__TP_FONT_FACE__*/

  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --font-heading: "Cormorant Garamond Gnosis", "Cormorant Garamond", Georgia, serif;
    --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-main: #0B0C0E;
    --bg-side: #111318;
    --bg-card: #181B22;
    --bg-subtle: #222630;
    --text-primary: #F5F2EB;
    --text-secondary: #C8C0B0;
    --text-muted: #8E8779;
    --accent: #C99B3B;
    --accent-grad: linear-gradient(135deg, #E2BE68 0%, #B5872E 100%);
    --accent-fg: #140F05;
    --accent-soft: rgba(212, 175, 55, 0.16);
    --accent-text: #E2BE68;
    --border-col: rgba(212, 175, 55, 0.28);
    --shadow-card: 0 12px 36px rgba(0, 0, 0, 0.45);
    --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.3);
  }
  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --bg-main: #F6F2EA;
    --bg-side: #EFE9DC;
    --bg-card: #FFFFFF;
    --bg-subtle: #E5DCC9;
    --text-primary: #18130C;
    --text-secondary: #3D3222;
    --text-muted: #61533E;
    --accent: #9A6B16;
    --accent-grad: linear-gradient(135deg, #C79535 0%, #9A6B16 100%);
    --accent-fg: #FFFFFF;
    --accent-soft: rgba(154, 107, 22, 0.14);
    --accent-text: #8A5E10;
    --border-col: rgba(154, 107, 22, 0.32);
    --shadow-card: 0 10px 28px rgba(92, 61, 8, 0.08);
    --shadow-soft: 0 2px 8px rgba(92, 61, 8, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-side);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 12px;
    border-top: 1px solid var(--border-col);
    border-left: 1px solid var(--border-col);
    border-right: 1px solid var(--border-col);
    border-bottom: 1px solid var(--border-col);
    display: flex;
    flex-direction: column;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .ai-header {
    padding: 12px 12px 10px 12px;
    background: var(--bg-side);
    border-bottom: 1px solid var(--border-col);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .ai-title-box {
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .ai-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .ai-dot.working {
    background: #f59e0b;
  }
  .ai-title {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 15.5px;
    color: var(--accent-text);
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .hdr-btns {
    display: flex;
    gap: 4px;
    flex-wrap: nowrap;
  }
  .ui-ico {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .hdr-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    color: var(--text-secondary);
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
    transition: color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .hdr-btn.ico-only {
    width: 26px;
    height: 26px;
    padding: 0;
  }
  .hdr-btn.ico-badge {
    height: 26px;
    padding: 0 7px;
  }
  .hdr-mini-cnt {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent-text);
  }
  .hdr-btn:hover {
    color: var(--text-primary);
    border-color: var(--accent);
  }
  .hdr-btn:active {
    transform: scale(0.96);
  }
  .hdr-btn.bubble-btn {
    background: var(--accent-soft);
    color: var(--accent-text);
  }
  .hdr-btn.rec-btn.active {
    background: #ef4444;
    color: #ffffff;
    border-color: #ef4444;
  }

  #skills_drawer, #settings_drawer {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-col);
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 8px;
    max-height: 60vh;
    overflow-y: auto;
  }
  #skills_drawer.open, #settings_drawer.open { display: flex; }

  .skill-card {
    background: var(--bg-main);
    border: 1px solid var(--border-col);
    border-radius: 12px;
    padding: 9px 11px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .skill-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .skill-name {
    font-weight: 600;
    font-size: 12px;
    color: var(--text-primary);
  }
  .skill-domain {
    font-size: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    border-radius: 999px;
    padding: 1px 6px;
    color: var(--text-secondary);
  }
  .skill-notes {
    font-size: 11px;
    color: var(--text-secondary);
  }
  .skill-steps-badge {
    font-size: 10px;
    color: var(--accent-text);
  }

  .st-row label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 3px;
  }
  .st-row select, .st-row input[type="text"], .st-row input[type="password"] {
    width: 100%;
    border: 1px solid var(--border-col);
    background: var(--bg-main);
    color: var(--text-primary);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 11.5px;
    outline: none;
  }
  .chk-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-secondary);
    cursor: pointer;
    padding-top: 2px;
  }
  .st-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }
  .key-status {
    font-size: 11px;
    color: var(--accent-text);
  }

  /* Context & Quick Actions (Hover Reveal cho các chip phụ để thoáng mắt) */
  .context-bar {
    padding: 8px 12px;
    background: var(--bg-side);
    border-bottom: 1px solid var(--border-col);
  }
  .ctx-line {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ctx-line b {
    color: var(--text-secondary);
    font-weight: 600;
  }
  .quick-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 7px;
  }
  .q-chip {
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .q-chip:hover {
    color: var(--text-primary);
    border-color: var(--accent);
  }
  .q-chip:active {
    transform: scale(0.96);
  }

  /* Chat Stream */
  #chat_stream {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--bg-side);
  }
  .msg {
    padding: 10px 12px;
    border: 1px solid var(--border-col);
    border-radius: 12px;
    line-height: 1.5;
    font-size: 12px;
    word-break: break-word;
  }
  .msg.user {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
    align-self: flex-end;
    max-width: 90%;
    font-weight: 500;
  }
  .msg.ai {
    background: var(--bg-card);
    color: var(--text-primary);
    align-self: flex-start;
    max-width: 95%;
  }
  .msg.sys, .msg.skill-learned {
    background: var(--accent-soft);
    color: var(--accent-text);
    border-color: var(--border-col);
    font-size: 11.5px;
  }

  /* Footer Input */
  .ai-footer {
    padding: 10px 12px;
    background: var(--bg-side);
    border-top: 1px solid var(--border-col);
  }
  .auto-min-bar { margin-bottom: 6px; }
  .prompt-form {
    display: flex;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    border-radius: 999px;
    padding: 4px 4px 4px 14px;
    align-items: center;
  }
  .prompt-form:focus-within {
    border-color: var(--accent);
  }
  .prompt-form input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-primary);
    font-size: 12px;
    padding: 5px 0;
    outline: none;
  }
  .prompt-form input::placeholder {
    color: var(--text-muted);
  }
  .prompt-form button {
    background: var(--accent-grad, var(--accent));
    color: var(--accent-fg);
    border: none;
    border-radius: 999px;
    padding: 6px 15px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .prompt-form button:active {
    transform: scale(0.96);
  }

  /* --- PLANNER & ACTIVE COWORK UI --- */
  .ai-view-switch {
    display: flex;
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
    margin: 6px 10px 2px;
    flex-shrink: 0;
  }
  .ai-view-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
    white-space: nowrap;
  }
  .ai-view-tab.active {
    background: var(--accent-grad, var(--accent));
    color: var(--accent-fg);
    font-weight: 700;
  }
  .ai-view-tab:active {
    transform: scale(0.96);
  }
  .planner-badge {
    min-width: 15px;
    height: 15px;
    line-height: 15px;
    border-radius: 999px;
    background: #EF4444;
    color: #FFF;
    font-size: 9px;
    font-weight: 800;
    text-align: center;
    padding: 0 4px;
    display: none;
  }
  .planner-badge.show {
    display: inline-block;
  }

  #planner_view {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .planner-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .planner-filter-pills {
    display: inline-flex;
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    border-radius: 999px;
    padding: 2px;
    gap: 2px;
  }
  .pf-pill {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    cursor: pointer;
  }
  .pf-pill.active {
    background: var(--accent);
    color: var(--accent-fg);
  }
  .task-creator-box {
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .task-creator-box input, .task-creator-box select {
    border: 1px solid var(--border-col);
    background: var(--bg-main);
    color: var(--text-primary);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 11px;
    outline: none;
  }
  .task-card {
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .task-card.active-cowork {
    border-color: var(--gold-bright);
    box-shadow: 0 0 0 2px rgba(226, 190, 104, 0.28);
  }
  .task-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
  }
  .task-card-title {
    font-family: var(--font-heading);
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.25;
  }
  .task-card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 10.5px;
  }
  .task-tag {
    background: var(--accent-soft);
    color: var(--accent-text);
    border: 1px solid var(--border-col);
    border-radius: 999px;
    padding: 1px 7px;
    font-weight: 600;
    font-size: 10px;
  }
  .task-steps-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 4px;
  }
  .task-step-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-main);
    border: 1px solid rgba(212, 175, 55, 0.12);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .task-step-row.done {
    opacity: 0.55;
  }
  .task-step-row.done .task-step-text {
    text-decoration: line-through;
  }
  .task-step-actor {
    font-size: 9px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .actor-ai {
    background: rgba(59, 130, 246, 0.18);
    color: #60A5FA;
    border: 1px solid rgba(59, 130, 246, 0.35);
  }
  .actor-user {
    background: rgba(16, 185, 129, 0.18);
    color: #34D399;
    border: 1px solid rgba(16, 185, 129, 0.35);
  }
  .task-card-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
    border-top: 1px solid var(--border-col);
    padding-top: 6px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
  <div class="ai-header">
    <div class="ai-title-box">
      <div class="ai-dot" id="ai_status_dot"></div>
      <span class="ai-title">AI Cowork</span>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn ico-only rec-btn" id="btn_record_skill" onclick="toggleSkillRecording()" title="Làm mẫu 1 lần (Record thao tác web thành Skill)">
        <svg class="ui-ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2.2" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="hdr-btn ico-badge skill-btn" id="btn_skills_drawer" onclick="toggleSkillsDrawer()" title="Sổ tay Skills đã học">
        <svg class="ui-ico" viewBox="0 0 16 16"><path d="M3 3.5h4.5a1.5 1.5 0 0 1 1.5 1.5v8.5a1 1 0 0 0-1-1H3V3.5ZM13 3.5H8.5A1.5 1.5 0 0 0 7 5v8.5a1 1 0 0 1 1-1H13V3.5Z"/></svg>
        <span class="hdr-mini-cnt" id="skills_count_badge">0</span>
      </button>
      <button class="hdr-btn ico-only" id="btn_ai_dock_toggle" onclick="sendRust({cmd:'toggle_chat_dock_style'})" title="Gắn Ngăn Phải / Thả Cửa Sổ Nổi">
        <svg class="ui-ico" viewBox="0 0 16 16"><path d="M3 8h10M5.5 5.5L3 8l2.5 2.5M10.5 5.5L13 8l-2.5 2.5"/></svg>
      </button>
      <button class="hdr-btn ico-only" onclick="sendRust({cmd:'open_settings_modal', section:'ai_cowork'})" title="Cài Đặt AI &amp; Cowork (Alt+,)">
        <svg class="ui-ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.8v1.5M8 12.7v1.5M1.8 8h1.5M12.7 8h1.5M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg>
      </button>
      <button class="hdr-btn ico-only bubble-btn" onclick="sendRust({cmd:'set_ai_mode', mode:'bubble'})" title="Thu gọn thành Bong bóng chat nổi">
        <svg class="ui-ico" viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg>
      </button>
    </div>
  </div>

  <!-- NGĂN QUẢN LÝ & LƯU SKILL (DẠY BẰNG LỜI + LÀM MẪU RECORD) -->
  <div id="skills_drawer">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <b style="font-family:var(--font-heading); font-size:14.5px; letter-spacing:0.6px; color:var(--accent-text);">SỔ TAY KỸ NĂNG (SKILLS ĐÃ HỌC)</b>
      <button class="hdr-btn" onclick="openNewSkillForm()">+ Dạy Skill mới</button>
    </div>

    <div id="skill_editor_box" style="display:none; background:var(--bg-main); border:1px solid var(--border-col); border-radius:12px; padding:10px; flex-direction:column; gap:6px;">
      <div style="font-family:var(--font-heading); font-weight:700; font-size:14px; color:var(--accent-text);" id="skill_editor_title">Lưu Kỹ Năng Mới</div>
      <div class="st-row">
        <label>Tên kỹ năng (Gợi nhớ để gọi nhanh)</label>
        <input id="sk_name_inp" type="text" placeholder="Ví dụ: Lọc đơn Hôm nay trên Shopee" />
      </div>
      <div class="st-row">
        <label>Tên miền áp dụng (để * nếu dùng cho mọi trang)</label>
        <input id="sk_domain_inp" type="text" placeholder="banhang.shopee.vn" />
      </div>
      <div class="st-row">
        <label>Lời dặn / Quy tắc của anh Phú (Dạy bằng lời)</label>
        <input id="sk_notes_inp" type="text" placeholder="Ví dụ: Luôn bấm tab Đang diễn ra trước khi đọc bảng..." />
      </div>
      <div class="st-row">
        <label>Các bước thao tác mẫu đã ghi nhận (JSON Steps)</label>
        <input id="sk_steps_inp" type="text" value="[]" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:6px;">
        <button type="button" class="hdr-btn" onclick="closeSkillEditor()">Hủy</button>
        <button type="button" class="hdr-btn" style="background:var(--accent-grad, var(--accent)); color:var(--accent-fg); border-color:transparent;" onclick="saveSkillFromEditor()">Lưu Thành Skill</button>
      </div>
    </div>

    <div id="skills_list_box" style="display:flex; flex-direction:column; gap:6px;"></div>
  </div>

  <!-- NGĂN CÀI ĐẶT API KEY DO NGƯỜI DÙNG TỰ THÊM (BYOK) -->
  <div id="settings_drawer">
    <div class="st-row">
      <label>Nhà cung cấp AI (Provider)</label>
      <select id="cfg_provider" onchange="onProviderChange()">
        <option value="gemini">Google Gemini API (Nhập Gemini Key)</option>
        <option value="openai">OpenAI / 9Router Tương Thích (Base URL + Key)</option>
      </select>
    </div>
    <div class="st-row" id="base_url_row" style="display:none;">
      <label>Endpoint Base URL (OpenAI / 9Router)</label>
      <input id="cfg_base_url" type="text" placeholder="http://127.0.0.1:20128/v1" value="http://127.0.0.1:20128/v1" />
    </div>
    <div class="st-row">
      <label>API Key (Người dùng tự thêm)</label>
      <div style="display:flex; gap:4px;">
        <input id="cfg_api_key" type="password" placeholder="Dán API Key của anh vào đây..." />
        <button type="button" class="hdr-btn" onclick="toggleShowKey()">Hiện</button>
      </div>
    </div>
    <div class="st-row">
      <label>Model</label>
      <input id="cfg_model" type="text" value="gemini-2.5-flash" placeholder="gemini-2.5-flash" />
    </div>
    <label class="chk-row">
      <input id="cfg_auto_min" type="checkbox" checked />
      <span>Tự thu gọn cửa sổ chat thành Bong bóng khi đang làm việc</span>
    </label>
    <div class="st-actions">

        <svg class="ui-ico" viewBox="0 0 16 16"><rect x="2.5" y="4" width="8.5" height="9.5" rx="1.5"/><path d="M5.5 2.5h7a1 1 0 0 1 1 1v7.5"/></svg>

  <div id="chat_stream">
    <div class="msg ai">
      <b>AI Cowork sẵn sàng</b> — Nhắn việc cần làm hoặc rê chuột lên các biểu tượng phía trên để xem chức năng (Tóm tắt trang, Tổng hợp Tab, Làm mẫu Skill).
    </div>
  </div>

  <!-- BẢNG KẾ HOẠCH & NHẮC VIỆC COWORK (PHASE 3) -->
  <div id="planner_view" style="display:none;">
    <div class="planner-bar">
      <div class="planner-filter-pills">
        <button class="pf-pill active" id="pf_all" onclick="setPlannerFilter('all')">Tất Cả</button>

      <button class="hdr-btn" onclick="toggleTaskCreatorBox()">+ Việc mới</button>
    </div>

    <!-- HỘP TẠO VIỆC NHANH / TỰ ĐỘNG TỪ ZALO -->
    <div id="task_creator_box" class="task-creator-box" style="display:none;">
      <b style="font-size:12px; color:var(--accent-text);">Tạo Đầu Việc Mới / Giao Việc AI</b>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
        <select id="new_task_due_preset" onchange="applyDuePreset(this.value)">
          <option value="today_17">Hạn: Hôm nay 17:00</option>
          <option value="plus_1h">Hạn: +1 tiếng nữa</option>
          <option value="plus_3h">Hạn: +3 tiếng nữa</option>
          <option value="tomorrow_09">Hạn: Sáng mai 09:00</option>
        </select>
        <input id="new_task_steps_raw" type="text" placeholder="Checklist (phân cách bằng dấu phẩy)" value="Thu thập số liệu [AI], Duyệt báo cáo [Bạn], Gửi Zalo [AI]" />
      </div>
      <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:4px;">
        <button type="button" class="hdr-btn" onclick="toggleTaskCreatorBox(false)">Hủy</button>
        <button type="button" class="hdr-btn" style="background:var(--accent-grad, var(--accent)); color:var(--accent-fg); border-color:transparent;" onclick="createTaskFromForm()">Lưu Kế Hoạch</button>
      </div>
    </div>

    <div id="tasks_list_container" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <div class="ai-footer">
    <div class="auto-min-bar" style="display:flex; flex-direction:column; gap:4px; align-items:flex-start;">
      <label class="chk-row" style="font-size:11px;" title="AI tự mở Tab riêng có nhãn AI để thao tác, không đụng vào Tab anh đang xem">
        <input id="quick_worker_tab" type="checkbox" checked />
        <span>Chạy trên Tab ngầm AI (không chiếm Tab chính)</span>
      </label>
      <label class="chk-row" style="font-size:11px;">
        <input id="quick_auto_min" type="checkbox" checked onchange="syncAutoMinCheckbox(this.checked)" />
        <span>Giao việc xong tự thu gọn thành Bong bóng</span>
      </label>
    </div>
    <form class="prompt-form" onsubmit="handlePromptSubmit(event)">
      <input id="ai_prompt_inp" type="text" placeholder="Nhắn việc cho AI..." autocomplete="off" />
      <button type="submit">GỬI</button>
    </form>
  </div>

  <script>
    var aiConfig = {
      provider: "openai",
      api_key: "",
      model: "gemini-3.8-flash",
      base_url: "http://127.0.0.1:8045/v1",
      auto_minimize_on_task: true
    };
    var learnedSkills = [];
    var isRecording = false;
    var recordedSteps = [];
    var currentActiveUrl = "";
    var pendingPrompt = "";
    var currentAiTargetTabId = null;
    var isWorking = false;

    function extractDomain(url) {
      if (!url || url === "tp://newtab") return "*";
      return String(url)
        .replace(/^https?:\/\//i, "")
        .replace(/^www\./i, "")
        .split("/")[0]
        .toLowerCase();
    }

    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    // --- TASK PLANNER & ACTIVE COWORK LOGIC (PHASE 3) ---
    var currentPlannerTasks = [];
    var plannerFilter = "all";
    var activeCoworkTaskId = null;

    function setAiViewMode(mode) {
      var isPlanner = (mode === "planner");
      document.getElementById("tab_mode_cowork").classList.toggle("active", !isPlanner);
      document.getElementById("tab_mode_planner").classList.toggle("active", isPlanner);
      document.getElementById("chat_stream").style.display = isPlanner ? "none" : "flex";
      document.querySelector(".context-bar").style.display = isPlanner ? "none" : "flex";
      document.querySelector(".ai-footer").style.display = isPlanner ? "none" : "block";
      document.getElementById("planner_view").style.display = isPlanner ? "flex" : "none";
      if (isPlanner) {
        renderPlannerTasks();
      }
    }

    function setPlannerFilter(filter) {
      plannerFilter = filter;
      document.getElementById("pf_all").classList.toggle("active", filter === "all");
      document.getElementById("pf_todo").classList.toggle("active", filter === "todo");
      document.getElementById("pf_done").classList.toggle("active", filter === "done");
      renderPlannerTasks();
    }

    function toggleTaskCreatorBox(force) {
      var box = document.getElementById("task_creator_box");
      if (!box) return;
      var show = (force !== undefined) ? force : (box.style.display === "none");
      box.style.display = show ? "flex" : "none";
      if (show) document.getElementById("new_task_title").focus();
    }

    function applyDuePreset(val) {
      // helper if needed
    }

    function saveTasksToRust() {
      sendRust({ cmd: "save_tasks_json", tasks_json: JSON.stringify(currentPlannerTasks) });
      renderPlannerTasks();
    }

    function createTaskFromForm() {
      var title = (document.getElementById("new_task_title").value || "").trim();
      if (!title) return;
      var source = document.getElementById("new_task_source").value || "manual";
      var contact = (document.getElementById("new_task_contact").value || "").trim();
      var duePreset = document.getElementById("new_task_due_preset").value;
      var nowEpoch = Math.floor(Date.now() / 1000);
      var dueEpoch = nowEpoch + 3600;
      var dueText = "+1 tiếng nữa";

      if (duePreset === "today_17") {
        var d = new Date(); d.setHours(17, 0, 0, 0);
        dueEpoch = Math.floor(d.getTime() / 1000);
        dueText = "Hôm nay 17:00";
      } else if (duePreset === "plus_3h") {
        dueEpoch = nowEpoch + 10800;
        dueText = "+3 tiếng nữa";
      } else if (duePreset === "tomorrow_09") {
        var tm = new Date(); tm.setDate(tm.getDate() + 1); tm.setHours(9, 0, 0, 0);
        dueEpoch = Math.floor(tm.getTime() / 1000);
        dueText = "Sáng mai 09:00";
      }

      var rawSteps = (document.getElementById("new_task_steps_raw").value || "").split(",");
      var steps = [];
      for (var i = 0; i < rawSteps.length; i++) {
        var st = rawSteps[i].trim();
        if (st) {
          var isAi = /\[ai\]/i.test(st);
          var cleanText = st.replace(/\[(ai|bạn|user)\]/gi, "").trim();
          steps.push({
            id: "s_" + (i + 1),
            text: cleanText,
            done: false,
            actor: isAi ? "ai" : "user"
          });
        }
      }
      if (steps.length === 0) {
        steps.push({ id: "s_1", text: title, done: false, actor: "ai" });
      }

      var newTask = {
        id: "task_" + Date.now(),
        title: title,
        source: source,
        source_contact: contact,
        created_at_epoch: nowEpoch,
        due_at_epoch: dueEpoch,
        due_text: dueText,
        remind_at_epoch: dueEpoch - 900,
        reminded: false,
        status: "todo",
        steps: steps
      };

      currentPlannerTasks.unshift(newTask);
      saveTasksToRust();
      toggleTaskCreatorBox(false);
      document.getElementById("new_task_title").value = "";
      document.getElementById("new_task_contact").value = "";
    }

    function toggleTaskStep(taskId, stepId) {
      for (var i = 0; i < currentPlannerTasks.length; i++) {
        var t = currentPlannerTasks[i];
        if (t.id === taskId && t.steps) {
          for (var j = 0; j < t.steps.length; j++) {
            if (t.steps[j].id === stepId) {
              t.steps[j].done = !t.steps[j].done;
              break;
            }
          }
          // If all steps done, mark task done
          var allDone = t.steps.every(function(s){ return s.done; });
          if (allDone) t.status = "done";
          else if (t.status === "done") t.status = "todo";
          break;
        }
      }
      saveTasksToRust();
    }

    function completeTask(taskId) {
      for (var i = 0; i < currentPlannerTasks.length; i++) {
        if (currentPlannerTasks[i].id === taskId) {
          currentPlannerTasks[i].status = "done";
          if (currentPlannerTasks[i].steps) {
            currentPlannerTasks[i].steps.forEach(function(s){ s.done = true; });
          }
          break;
        }
      }
      if (activeCoworkTaskId === taskId) activeCoworkTaskId = null;
      saveTasksToRust();
    }

    function deleteTask(taskId) {
      currentPlannerTasks = currentPlannerTasks.filter(function(t){ return t.id !== taskId; });
      if (activeCoworkTaskId === taskId) activeCoworkTaskId = null;
      saveTasksToRust();
    }

    function startActiveCowork(taskId) {
      activeCoworkTaskId = taskId;
      var task = currentPlannerTasks.find(function(t){ return t.id === taskId; });
      if (!task) return;
      var pendingStep = (task.steps || []).find(function(s){ return !s.done; });
      var stepText = pendingStep ? pendingStep.text : task.title;
      // Broadcast active status
      sendRust({
        cmd: "sync_bubble_status",
        working: true,
        recording: false,
        status_text: "Cowork: " + stepText,
        last_reply: "Đang cùng làm: " + task.title
      });
      // Switch back to chat view and trigger assistant focus
      setAiViewMode("cowork");
      appendMessage("user", "Bắt đầu làm việc cho kế hoạch: " + task.title + " (Bước: " + stepText + ")");
      triggerCoworkTask("Tôi đang thực hiện đầu việc: " + task.title + ". Hãy hỗ trợ tôi bước: " + stepText);
    }

    function runAiStepDirect(taskId, stepText) {
      setAiViewMode("cowork");
      appendMessage("user", "AI hãy làm bước này: " + stepText);
      triggerCoworkTask("AI hãy làm bước này trong kế hoạch: " + stepText);
    }

    function draftZaloReport(taskId) {
      var task = currentPlannerTasks.find(function(t){ return t.id === taskId; });
      if (!task) return;
      var doneSteps = (task.steps || []).filter(function(s){ return s.done; }).length;
      var totalSteps = (task.steps || []).length;
      var reportMsg = "Dạ anh " + (task.source_contact || "Phú") + ", em cập nhật tiến độ công việc [" + task.title + "]: đã hoàn thành (" + doneSteps + "/" + totalSteps + " bước). ";
      if (doneSteps === totalSteps) {
        reportMsg += "Đầu việc đã hoàn tất 100% rồi ạ!";
      } else {
        reportMsg += "Hiện em đang tiếp tục triển khai các bước tiếp theo.";
      }
      sendRust({ cmd: "paste_to_chat", channel: task.source || "zalo", text: reportMsg });
    }

    function renderPlannerTasks() {
      var container = document.getElementById("tasks_list_container");
      if (!container) return;
      container.innerHTML = "";

      var todoCount = currentPlannerTasks.filter(function(t){ return t.status !== "done"; }).length;
      var badge = document.getElementById("planner_task_count");
      if (badge) {
        badge.textContent = todoCount;
        badge.classList.toggle("show", todoCount > 0);
      }

      var filtered = currentPlannerTasks.filter(function(t){
        if (plannerFilter === "todo") return t.status !== "done";
        if (plannerFilter === "done") return t.status === "done";
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = "<div style='text-align:center; padding:24px 10px; color:var(--text-muted); font-size:11.5px;'>✨ " + (plannerFilter === "done" ? "Chưa có việc nào hoàn thành." : "Không có đầu việc nào. Bấm '+ Việc mới' hoặc bôi đen tin nhắn Zalo để tạo!") + "</div>";
        return;
      }

      filtered.forEach(function(t){
        var card = document.createElement("div");
        card.className = "task-card" + (activeCoworkTaskId === t.id ? " active-cowork" : "");
        var sourceLabel = t.source === "zalo" ? "Zalo" : (t.source === "messenger" ? "Messenger" : (t.source === "web" ? "Web" : "Cá nhân"));
        var contactStr = t.source_contact ? (" • Từ: " + escapeHtml(t.source_contact)) : "";

        var stepsHtml = "";
        if (t.steps && t.steps.length > 0) {
          stepsHtml = "<div class='task-steps-list'>";
          t.steps.forEach(function(s){
            var isAi = s.actor === "ai";
            stepsHtml += "<div class='task-step-row" + (s.done ? " done" : "") + "'>" +
              "<input type='checkbox'" + (s.done ? " checked" : "") + " onchange='toggleTaskStep(\"" + t.id + "\", \"" + s.id + "\")' />" +
              "<span class='task-step-actor " + (isAi ? "actor-ai" : "actor-user") + "'>" + (isAi ? "🤖 AI" : "👤 Bạn") + "</span>" +
              "<span class='task-step-text' style='flex:1;'>" + escapeHtml(s.text) + "</span>" +
              (isAi && !s.done ? ("<button class='hdr-btn' style='font-size:9.5px; padding:2px 7px;' onclick='runAiStepDirect(\"" + t.id + "\", \"" + escapeHtml(s.text) + "\")'>⚡ Chạy</button>") : "") +
              "</div>";
          });
          stepsHtml += "</div>";
        }

        card.innerHTML =
          "<div class='task-card-header'>" +
            "<div style='flex:1;'>" +
              "<div class='task-card-title'>" + escapeHtml(t.title) + "</div>" +
              "<div class='task-card-meta'>" +
                "<span class='task-tag'>" + sourceLabel + contactStr + "</span>" +
                "<span style='color:var(--text-muted);'>⏰ " + escapeHtml(t.due_text || "Hôm nay") + "</span>" +
              "</div>" +
            "</div>" +
            (t.status === "done" ? "<span style='color:#34D399; font-weight:700; font-size:11px;'>✅ Đã xong</span>" : "") +
          "</div>" +
          stepsHtml +
          "<div class='task-card-actions'>" +
            (t.status !== "done" ? "<button class='hdr-btn' style='background:var(--accent-grad, var(--accent)); color:var(--accent-fg); border-color:transparent;' onclick='startActiveCowork(\"" + t.id + "\")'>🚀 Cùng Làm (Cowork)</button>" : "") +
            "<button class='hdr-btn' onclick='draftZaloReport(\"" + t.id + "\")' title='Soạn nhanh tiến độ và điền vào ô chat'>📝 Báo Cáo Zalo</button>" +
            (t.status !== "done" ? "<button class='hdr-btn' onclick='completeTask(\"" + t.id + "\")'>✅ Đã xong</button>" : "") +
            "<button class='hdr-btn' style='color:#EF4444;' onclick='deleteTask(\"" + t.id + "\")'>🗑️</button>" +
          "</div>";
        container.appendChild(card);
      });
    }

    // --- RUST SYNC HANDLERS ---
    window.__tpSyncTasks = function(tasks) {
      if (Array.isArray(tasks)) {
        currentPlannerTasks = tasks;
      } else if (typeof tasks === "string") {
        try { currentPlannerTasks = JSON.parse(tasks); } catch (_) {}
      }
      renderPlannerTasks();
    };

    window.__tpReceiveTaskFromSelection = function(data) {
      if (!data) return;
      setAiViewMode("planner");
      toggleTaskCreatorBox(true);
      var text = (data.text || "").trim();
      var cleanTitle = text.split("\n")[0].substring(0, 80);
      document.getElementById("new_task_title").value = cleanTitle;
      document.getElementById("new_task_source").value = data.source || "zalo";
      document.getElementById("new_task_contact").value = data.contact || "";

      // Auto breakdown steps
      var suggestedSteps = "Đọc & phân tích yêu cầu [AI], Thực hiện xử lý [AI], Báo cáo lại cho " + (data.contact || "Zalo") + " [Bạn]";
      document.getElementById("new_task_steps_raw").value = suggestedSteps;
    };

    window.__tpSnoozeTaskLocal = function(taskId, nextEpoch) {
      for (var i = 0; i < currentPlannerTasks.length; i++) {
        if (currentPlannerTasks[i].id === taskId) {
          currentPlannerTasks[i].remind_at_epoch = nextEpoch;
          currentPlannerTasks[i].reminded = false;
          break;
        }
      }
      saveTasksToRust();
    };

    window.__tpCompleteTaskLocal = function(taskId) {
      completeTask(taskId);
    };

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function appendMessage(role, htmlText) {
      var stream = document.getElementById("chat_stream");
      var div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML = htmlText;
      stream.appendChild(div);
      stream.scrollTop = stream.scrollHeight;
    }

    function toggleSettingsDrawer(forceOpen) {
      var dr = document.getElementById("settings_drawer");
      var sk = document.getElementById("skills_drawer");
      if (sk) sk.classList.remove("open");
      if (forceOpen === true) {
        dr.classList.add("open");
      } else if (forceOpen === false) {
        dr.classList.remove("open");
      } else {
        dr.classList.toggle("open");
      }
    }

    function toggleSkillsDrawer(forceOpen) {
      var sk = document.getElementById("skills_drawer");
      var dr = document.getElementById("settings_drawer");
      if (dr) dr.classList.remove("open");
      if (forceOpen === true) sk.classList.add("open");
      else if (forceOpen === false) sk.classList.remove("open");
      else sk.classList.toggle("open");
      renderSkillsList();
    }

    function renderSkillsList() {
      var badge = document.getElementById("skills_count_badge");
      if (badge) badge.textContent = String(learnedSkills.length);
      var box = document.getElementById("skills_list_box");
      if (!box) return;
      if (learnedSkills.length === 0) {

    function upsertSkill(newSkill) {

      var idx = learnedSkills.findIndex(function (s) {
        return (s.name || "").toLowerCase() === newSkill.name.toLowerCase();
      });
      if (idx >= 0) {
        learnedSkills[idx] = Object.assign({}, learnedSkills[idx], newSkill);
      } else {
        learnedSkills.push(newSkill);
      }
      renderSkillsList();
      sendRust({
        cmd: "save_skills_json",
        skills_json: JSON.stringify(learnedSkills)
      });
      appendMessage(
        "skill-learned",
        "📚 <b>Đã học & lưu Skill:</b> <code>" +
          escapeHtml(newSkill.name) +
          "</code> (Tên miền: <b>" +
          escapeHtml(newSkill.domain || "*") +
          "</b> • " +
          (Array.isArray(newSkill.steps) ? newSkill.steps.length : 0) +
          " bước)."

    function normalizeOpenAiBase(raw) {
      var u = String(raw || "http://127.0.0.1:20128/v1").trim().replace(/\/+$/, "");
      if (u.endsWith("/chat/completions")) {
        u = u.slice(0, -"/chat/completions".length);
      }
      if (!/\/v\d+$/i.test(u)) {
        u = u + "/v1";
      }
      return u;
    }

    function parseLlmJsonOrText(rawContent) {
      var s = String(rawContent || "").trim();
      if (!s) return { reply: "AI không trả về nội dung.", actions: [] };
      var stripped = s.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/```\s*$/, "").trim();
      try {
        var obj = JSON.parse(stripped);
        if (obj && typeof obj === "object") return obj;
      } catch (_) {}
      var firstBrace = stripped.indexOf("{");
      var lastBrace = stripped.lastIndexOf("}");
      if (firstBrace !== -1 && lastBrace > firstBrace) {
        try {
          var subObj = JSON.parse(stripped.slice(firstBrace, lastBrace + 1));
          if (subObj && typeof subObj === "object") return subObj;
        } catch (_) {}
      }
      return { reply: stripped, actions: [] };
    }

    async function testAiKeyNow() {
      var provider = document.getElementById("cfg_provider").value;
      var apiKey = document.getElementById("cfg_api_key").value.trim();
      var model = document.getElementById("cfg_model").value.trim() || "gemini-2.5-flash";
      var baseUrl = normalizeOpenAiBase(document.getElementById("cfg_base_url").value);

      lbl.textContent = "⏳ Đang kiểm tra kết nối Key...";
      var t0 = Date.now();

      try {
        if (provider === "gemini") {
          if (!apiKey) throw new Error("Chưa nhập Gemini API Key");
          var ep =
            "https://generativelanguage.googleapis.com/v1beta/models/" +
            encodeURIComponent(model) +
            ":generateContent?key=" +
            encodeURIComponent(apiKey);
          var r = await fetch(ep, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "ping" }] }] })
          });

          if (apiKey) headers["Authorization"] = "Bearer " + apiKey;
          var r2 = await fetch(baseUrl + "/chat/completions", {
            method: "POST",
            headers: headers,
            body: JSON.stringify({
              model: model,
              messages: [{ role: "user", content: "Trả lời ngắn: OK" }],
              max_tokens: 16
            })
          });
          if (!r2.ok) throw new Error("HTTP " + r2.status);
        }
        var dt = Date.now() - t0;
        lbl.style.color = "#059669";
        lbl.textContent = "🟢 Key ĂN 100% (" + model + " • " + dt + "ms)";
        appendMessage(
          "system",
          "🟢 <b>Kiểm tra Key thành công!</b> Endpoint: <code>" +
            escapeHtml(provider === "openai" ? baseUrl : "Google Gemini") +
            "</code> • Model: <b>" +
            escapeHtml(model) +
            "</b> • Độ trễ: <b>" +

            "ms</b>."
        );

        lbl.style.color = "#dc2626";
        lbl.textContent = "🔴 Lỗi: " + (e.message || String(e));

      pendingPrompt = promptText.trim();
      appendMessage("user", escapeHtml(pendingPrompt));

      // Nếu bật "Tự thu gọn khi làm việc", lập tức thu ngăn phải về chế độ Bong bóng nổi!
      if (aiConfig.auto_minimize_on_task) {
        sendRust({ cmd: "set_ai_mode", mode: "bubble" });
      }

      var useWorker = true;
      var wChk = document.getElementById("quick_worker_tab");
      if (wChk) useWorker = !!wChk.checked;
      updateBubbleAndStatus(true, useWorker ? "⚡ AI đang chuẩn bị Tab ngầm riêng..." : "⚡ AI đang đọc nội dung trang đang mở...", "Đang xử lý: " + pendingPrompt);

      // Yêu cầu Rust lấy ngữ cảnh DOM (trên Tab ngầm AI riêng hoặc Tab đang mở)
      sendRust({ cmd: "request_dom_context_for_ai", use_worker: useWorker, prompt: pendingPrompt });
    };

    // Rust gọi hàm này khi đã thu thập xong DOM của trang mục tiêu
    window.__tpReceiveDomContext = async function (ctx) {
      var prompt = pendingPrompt || "Tóm tắt trang này";
      var activeUrl = (ctx && ctx.url) || "";
      currentActiveUrl = activeUrl;
      currentAiTargetTabId = (ctx && ctx.target_tab_id) ? ctx.target_tab_id : null;
      var activeTitle = (ctx && ctx.title) || "";
      var visibleText = (ctx && ctx.visible_text) || "";
      var elements = (ctx && ctx.elements) || [];
      var allTabs = (ctx && ctx.all_tabs) || [];

      document.getElementById("ctx_active_page").innerHTML =
        (ctx && ctx.is_worker ? "Tab ngầm AI: <b>" : "Đang nhìn: <b>") + escapeHtml(activeTitle || activeUrl || "Trang hiện tại") + "</b> (" + allTabs.length + " tab)";

      updateBubbleAndStatus(true, "🔵 AI đang phân tích & áp dụng Skill...", "Đang phân tích trang: " + activeTitle);

      try {
        var result = await runAiOrSmartFallback(prompt, activeUrl, activeTitle, visibleText, elements, allTabs);
        var replyText = result.reply || "Đã hoàn thành yêu cầu.";
        var actions = Array.isArray(result.actions) ? result.actions : [];

        if (result.save_skill && result.save_skill.name) {
          upsertSkill(result.save_skill);
        }

        if (actions.length > 0) {
          for (var i = 0; i < actions.length; i++) {
            var act = actions[i];
            var stepMsg = "🟢 AI đang thao tác (" + (i + 1) + "/" + actions.length + "): " + (act.type || "action");
            updateBubbleAndStatus(true, stepMsg, replyText);
            appendMessage("system", "⚡ Thực thi trên trang: <b>" + escapeHtml(JSON.stringify(act)) + "</b>");
            sendRust({
              cmd: "execute_dom_action",
              target_tab_id: currentAiTargetTabId,
              action_json: JSON.stringify(act)
            });
            await new Promise(function (r) { setTimeout(r, 420); });
          }
        }

        appendMessage("ai", escapeHtml(replyText).replace(/\n/g, "<br/>"));
        updateBubbleAndStatus(false, "✅ Đã xong: " + replyText.slice(0, 65), replyText);
      } catch (err) {
        var errMsg = "Lỗi khi gọi AI: " + (err && err.message ? err.message : String(err));
        appendMessage("system", escapeHtml(errMsg));
        updateBubbleAndStatus(false, "⚠ " + errMsg.slice(0, 60), errMsg);
      }
    };

    function getRelevantSkillsForUrl(url) {
      var dom = extractDomain(url);
      return learnedSkills.filter(function (s) {
        var sd = (s.domain || "*").toLowerCase();
        return sd === "*" || dom.includes(sd) || sd.includes(dom);
      });

    async function runAiOrSmartFallback(prompt, url, title, visibleText, elements, allTabs) {
      var pLower = prompt.toLowerCase();

      var matchedSkill = learnedSkills.find(function (s) {
        return s.name && pLower.includes(s.name.toLowerCase()) && Array.isArray(s.steps) && s.steps.length > 0;
      });
      if (matchedSkill && !pLower.includes("sửa") && !pLower.includes("lưu")) {
        return {
          reply: "Em đã nhận diện và chạy Skill '" + matchedSkill.name + "' (" + matchedSkill.steps.length + " bước chuẩn anh đã dạy).",
          actions: matchedSkill.steps
        };
      }

      // 1. Kiểm tra nếu người dùng có nhập API Key (hoặc chọn OpenAI/9Router local)
      if (aiConfig.api_key || aiConfig.provider === "openai") {
        try {
          return await callConfiguredLlm(prompt, url, title, visibleText, elements, allTabs);
        } catch (apiErr) {
          appendMessage("system", "Lưu ý API (" + escapeHtml(apiErr.message) + ") -> Chuyển sang bộ xử lý Cowork trực tiếp trên DOM.");
        }
      }

      // 2. Bộ xử lý Cowork nội bộ thông minh (hoạt động ngay cả khi chưa nhập API Key)
      var actions = [];
      var reply = "";

      if (pLower.includes("cuộn xuống") || pLower.includes("scroll down")) {
        actions.push({ type: "scroll", direction: "down" });
        reply = "Em đã cuộn trang '" + title + "' xuống dưới để anh xem tiếp.";
      } else if (pLower.includes("cuộn lên") || pLower.includes("scroll up")) {
        actions.push({ type: "scroll", direction: "up" });
        reply = "Em đã cuộn trang '" + title + "' lên đầu trang.";
      } else if (pLower.startsWith("mở trang ") || pLower.startsWith("vào trang ") || pLower.startsWith("open ")) {
        var targetUrl = prompt.replace(/^(mở trang|vào trang|open)\s+/i, "").trim();
        actions.push({ type: "navigate", url: targetUrl });
        reply = "Em đã chuyển trang hiện tại tới: " + targetUrl;
      } else if (pLower.includes("điền ") || pLower.includes("gõ ") || pLower.includes("tìm kiếm ") || pLower.includes("tìm ")) {
        // Tìm ô input đầu tiên trên trang
        var firstInput = elements.find(function (el) {
          return el.tag === "input" || el.tag === "textarea";
        });
        var fillVal = prompt
          .replace(/^(điền|gõ|tìm kiếm|tìm)\s+(từ khóa\s+)?/i, "")
          .replace(/\s+vào ô.*$/i, "")
          .replace(/^["']|["']$/g, "")
          .trim();
        if (firstInput && fillVal) {
          actions.push({ type: "fill", target_id: firstInput.id, value: fillVal, submit: true });
          reply = "Đã tự động điền '" + fillVal + "' vào ô nhập liệu [" + (firstInput.label || firstInput.tag) + "] trên trang.";
        } else if (fillVal) {
          actions.push({ type: "navigate", url: "https://www.google.com/search?q=" + encodeURIComponent(fillVal) });
          reply = "Trang hiện tại không có ô tìm kiếm trống, em đã mở tìm kiếm Google cho: '" + fillVal + "'.";
        }
      } else if (pLower.includes("bấm ") || pLower.includes("click ")) {
        var kw = prompt.replace(/^(bấm|click)\s+(vào\s+)?(nút\s+|mục\s+)?/i, "").trim().toLowerCase();
        var matchBtn = elements.find(function (el) {
          return (el.label || "").toLowerCase().includes(kw);
        });
        if (matchBtn) {
          actions.push({ type: "click", target_id: matchBtn.id });
          reply = "Đã bấm vào mục '" + matchBtn.label + "' (ID #" + matchBtn.id + ") trên trang.";
        } else {
          reply = "Em đã quét " + elements.length + " nút/ô trên trang nhưng chưa thấy nút khớp với '" + kw + "'.";
        }
      } else if (pLower.includes("tổng hợp mọi tab") || pLower.includes("tất cả các tab")) {
        var lines = allTabs.map(function (t, idx) {
          return (idx + 1) + ". [" + (t.profile || "Chính") + "] " + (t.title || t.url) + " (" + t.url + ")";
        });
        reply = "Hiện đang mở " + allTabs.length + " Tab:\n" + lines.join("\n") +
          "\n\nNội dung chính Tab đang chọn (" + title + "):\n" + (visibleText ? visibleText.slice(0, 380) + "..." : "(Trang khởi đầu)");
      } else if (pLower.includes("quét nút") || pLower.includes("ô nhập")) {
        var sample = elements.slice(0, 10).map(function (e) {
          return "• [#" + e.id + " " + e.tag.toUpperCase() + "] " + (e.label || "(không nhãn)");
        });
        reply = "Đã phát hiện " + elements.length + " phần tử tương tác trên trang '" + title + "':\n" +
          (sample.length ? sample.join("\n") : "Không có ô nhập/nút nào.") +
          "\n(Anh có thể nhắn: 'Điền ... vào ô tìm kiếm' hoặc 'Bấm vào ...' để AI thao tác hộ)";
      } else {
        var snippet = (visibleText || "").replace(/\s+/g, " ").trim().slice(0, 460);
        reply = "📄 Tóm tắt trang đang mở [" + (title || url) + "]:\n" +
          (snippet ? snippet + "..." : "Trang bắt đầu TPbrowser (sẵn sàng mở web hoặc thực thi lệnh Cowork).") +
          "\n• Số phần tử tương tác (nút/ô nhập) AI đọc được: " + elements.length + " mục." +
          (!aiConfig.api_key ? "\n💡 Mẹo: Anh có thể bấm '⚙ API Key' để thêm Gemini/OpenAI Key cho các phân tích chuyên sâu." : "");
      }

      return { reply: reply, actions: actions };
    }

    async function callConfiguredLlm(prompt, url, title, visibleText, elements, allTabs) {
      var domainSkills = getRelevantSkillsForUrl(url);
      var sysPrompt =
        "Bạn là trợ lý AI Cowork tích hợp trong trình duyệt Rust TPbrowser của anh Phú. " +
        "Bạn có toàn quyền đọc nội dung trang đang mở và trả về các hành động thao tác DOM hộ người dùng.\n" +
        "1. Mảng \"actions\" hỗ trợ: fill, click, scroll, navigate, new_tab, split_view (mỗi action có thể kèm target_id, label, selector, value).\n" +
        "2. TỰ HỌC SKILL: Nếu anh Phú hướng dẫn cách làm, dặn quy tắc, hoặc bảo 'lưu thành skill', hãy trả về trường \"save_skill\": {\"name\": \"Tên ngắn gọn\", \"domain\": \"" +
        extractDomain(url) +
        "\", \"notes\": \"Quy tắc/hướng dẫn chi tiết\", \"steps\": [các bước actions chuẩn]}.\n" +
        "3. Trả về ĐÚNG định dạng JSON: {\"reply\": \"Câu trả lời tiếng Việt ngắn gọn, rõ ràng\", \"actions\": [...], \"save_skill\": null}.";

      var contextPayload =
        "YÊU CẦU CỦA ANH PHÚ: " + prompt + "\n\n" +
        "CÁC SKILL ĐÃ HỌC CHO TRANG NÀY (" + extractDomain(url) + "): " + JSON.stringify(domainSkills) + "\n" +
        "TAB ĐANG MỞ: " + title + " (" + url + ")\n" +
        "DANH SÁCH TẤT CẢ CÁC TAB: " + JSON.stringify(allTabs) + "\n" +
        "CÁC NÚT & Ô NHẬP LIỆU TRÊN TRANG (target_id, label, selector): " + JSON.stringify(elements.slice(0, 35)) + "\n" +
        "NỘI DUNG VĂN BẢN TRÊN TRANG:\n" + (visibleText || "").slice(0, 8000);

      if (aiConfig.provider === "gemini") {
        if (!aiConfig.api_key) throw new Error("Chưa nhập Gemini API Key");
        var endpoint =
          "https://generativelanguage.googleapis.com/v1beta/models/" +
          encodeURIComponent(aiConfig.model || "gemini-2.5-flash") +
          ":generateContent?key=" +
          encodeURIComponent(aiConfig.api_key);
        var resp = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: sysPrompt }] },
            contents: [{ role: "user", parts: [{ text: contextPayload }] }],
            generationConfig: { responseMimeType: "application/json", temperature: 0.2 }
          })
        });
        if (!resp.ok) throw new Error("Gemini HTTP " + resp.status);
        var data = await resp.json();
        var rawText =
          data &&
          data.candidates &&
          data.candidates[0] &&
          data.candidates[0].content &&
          data.candidates[0].content.parts &&
          data.candidates[0].content.parts[0] &&
          data.candidates[0].content.parts[0].text;
        return parseLlmJsonOrText(rawText);
      } else {
        var base = normalizeOpenAiBase(aiConfig.base_url);
        var headers = { "Content-Type": "application/json" };
        if (aiConfig.api_key) headers["Authorization"] = "Bearer " + aiConfig.api_key;
        var resp2 = await fetch(base + "/chat/completions", {
          method: "POST",
          headers: headers,
          body: JSON.stringify({
            model: aiConfig.model || "gemini-2.5-flash",
            messages: [
              { role: "system", content: sysPrompt },
              { role: "user", content: contextPayload }
            ],
            temperature: 0.2
          })
        });
        if (!resp2.ok) throw new Error("Endpoint HTTP " + resp2.status);
        var data2 = await resp2.json();
        var content =
          data2 &&
          data2.choices &&
          data2.choices[0] &&
          data2.choices[0].message &&
          data2.choices[0].message.content;
        return parseLlmJsonOrText(content);
      }
    }

    window.__tpLoadAiConfigFromRust = function (cfg) {
      if (!cfg) return;
      if (cfg.ui_theme) document.documentElement.setAttribute('data-theme', cfg.ui_theme);
      aiConfig.provider = cfg.provider || "gemini";
      aiConfig.api_key = cfg.api_key || "";
      aiConfig.model = cfg.model || "gemini-2.5-flash";
      aiConfig.base_url = normalizeOpenAiBase(cfg.base_url || "http://127.0.0.1:20128/v1");
      aiConfig.auto_minimize_on_task = cfg.auto_minimize_on_task !== false;

      if (Array.isArray(cfg.skills)) {
        learnedSkills = cfg.skills;
        renderSkillsList();
      }

      document.getElementById("cfg_provider").value = aiConfig.provider;
      document.getElementById("cfg_api_key").value = aiConfig.api_key;
      document.getElementById("cfg_model").value = aiConfig.model;
      document.getElementById("cfg_base_url").value = aiConfig.base_url;
      document.getElementById("cfg_auto_min").checked = aiConfig.auto_minimize_on_task;
      document.getElementById("quick_auto_min").checked = aiConfig.auto_minimize_on_task;
      onProviderChange();

      var masked = aiConfig.api_key
        ? "Đã lưu Key (" + aiConfig.api_key.slice(0, 4) + "..." + aiConfig.api_key.slice(-3) + ")"
        : "Chưa nhập API Key (Đang dùng Cowork nội bộ)";
      document.getElementById("cfg_status_lbl").textContent = masked;

      if (cfg.open_drawer) {
        toggleSettingsDrawer(true);
      }
      if (aiConfig.api_key && !window.__tpTestedOnce) {
        window.__tpTestedOnce = true;
        setTimeout(testAiKeyNow, 300);
      }
    };

    window.addEventListener("tp_config_changed", function (ev) {
      if (!ev || !ev.detail) return;
      var d = ev.detail;
      if (d.ui_theme) document.documentElement.setAttribute("data-theme", d.ui_theme);
      if (d.ai_provider) aiConfig.provider = d.ai_provider;
      if (d.ai_api_key !== undefined) aiConfig.api_key = d.ai_api_key;
      if (d.ai_model) aiConfig.model = d.ai_model;
      if (d.ai_base_url) aiConfig.base_url = normalizeOpenAiBase(d.ai_base_url);
      if (typeof d.auto_minimize_on_task === "boolean") {
        aiConfig.auto_minimize_on_task = d.auto_minimize_on_task;
        document.getElementById("cfg_auto_min").checked = d.auto_minimize_on_task;
        document.getElementById("quick_auto_min").checked = d.auto_minimize_on_task;
      }
    });

    window.addEventListener("DOMContentLoaded", function () {
      sendRust({ cmd: "ai_panel_ready" });
    });
    setTimeout(function () {
      sendRust({ cmd: "ai_panel_ready" });
    }, 150);
  </script>
