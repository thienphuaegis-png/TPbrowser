<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>TPbrowser Tab Shell</title>
<style>
/*__TP_FONT_FACE__*/

  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --font-heading: "Cormorant Garamond Gnosis", "Cormorant Garamond", Georgia, serif;
    --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-main: #0B0C0E;
    --bg-side: #111318;
    --bg-card: #181B22;
    --bg-subtle: #222630;
    --text-primary: #F5F2EB;
    --text-secondary: #C8C0B0;
    --text-muted: #8E8779;
    --accent: #C99B3B;
    --accent-grad: linear-gradient(135deg, #E2BE68 0%, #B5872E 100%);
    --accent-fg: #140F05;
    --accent-soft: rgba(212, 175, 55, 0.16);
    --accent-text: #E2BE68;
    --border-col: rgba(212, 175, 55, 0.28);
    --shadow-card: 0 12px 36px rgba(0, 0, 0, 0.45);
    --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.3);
  }
  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --bg-main: #F6F2EA;
    --bg-side: #EFE9DC;
    --bg-card: #FFFFFF;
    --bg-subtle: #E5DCC9;
    --text-primary: #18130C;
    --text-secondary: #18130C;
    --text-muted: #524433;
    --accent: #7A510B;
    --accent-grad: linear-gradient(135deg, #A8741A 0%, #7A510B 100%);
    --accent-fg: #FFFFFF;
    --accent-soft: rgba(24, 19, 12, 0.10);
    --accent-text: #18130C;
    --border-col: rgba(24, 19, 12, 0.22);
    --shadow-card: 0 10px 28px rgba(92, 61, 8, 0.08);
    --shadow-soft: 0 2px 8px rgba(92, 61, 8, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-side);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 12px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* ================= VERTICAL LEFT MODE ================= */
  body.mode-vertical #horizontal_root { display: none !important; }
  body.mode-vertical #vertical_root {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    border-right: 1px solid var(--border-col);
    background: var(--bg-side);
    padding: 12px 10px;
    gap: 8px;
  }

  body.mode-vertical.collapsed .hide-when-collapsed { display: none !important; }
  body.mode-vertical.collapsed .v-header { justify-content: center; padding: 4px 0; }
  body.mode-vertical.collapsed .v-tab-item { justify-content: center; padding: 8px 4px; }

  .v-header {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 2px 4px 4px;
  }
  .v-divider {
    height: 1px;
    background: var(--border-col);
    margin: 4px 2px;
    flex-shrink: 0;
  }
  .v-newtab-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px dashed var(--border-col);
    background: transparent;
    color: var(--text-secondary);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui);
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .v-newtab-btn:hover {
    background: var(--bg-card);
    border-style: solid;
    border-color: var(--accent);
    color: var(--text-primary);
    box-shadow: var(--shadow-soft);
  }
  body.mode-vertical.collapsed .v-newtab-btn {
    justify-content: center;
    padding: 8px 4px;
    border-radius: 8px;
  }
  body.mode-vertical.collapsed .v-newtab-btn span {
    display: none;
  }
  .v-window-row { display: flex; align-items: center; min-height: 28px; gap: 3px; }
  .v-window-controls { display: flex; align-items: center; gap: 2px; }
  .v-window-btn { width: 26px; height: 26px; justify-content: center; padding: 0; border-radius: 7px; }
  .v-window-btn.close:hover { color: #fff; background: #c42b1c; border-color: #c42b1c; }
  .v-drag-region { flex: 1; min-width: 8px; height: 26px; }
  .vertical-brand { width: 26px; height: 26px; padding: 0; border-radius: 7px; overflow: hidden; justify-content: center; }
  .vertical-brand-img { display: none; width: 20px; height: 20px; object-fit: contain; }
  .vertical-brand-fallback { width: 20px; height: 20px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-grad); color: var(--accent-fg); font-family: var(--font-heading); font-weight: 700; font-size: 11px; }
  .v-header-actions { display: flex; justify-content: flex-end; gap: 3px; }
  .tab-section { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-shrink: 0; }
  .tab-section[hidden] { display: none; }
  .extension-tab-list { display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; }
  .pinned-tab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 4px; max-height: 120px; overflow-y: auto; }
  .pinned-tab-grid .v-tab-item { justify-content: center; padding: 7px; border-radius: 8px; }
  .pinned-tab-grid .tab-fav { width: 16px; height: 16px; }
  .space-section { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 8px 4px 2px; border-top: 1px solid var(--border-col); flex-shrink: 0; }
  .space-section-label, .tab-section-label { color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; }
  .space-switcher { position: relative; min-width: 0; }
  .space-toggle { width: 100%; max-width: none; justify-content: space-between; overflow: hidden; text-overflow: ellipsis; }
  .space-popover { display: none; position: absolute; bottom: calc(100% + 7px); left: 0; z-index: 20; width: min(250px, calc(100vw - 28px)); padding: 8px; border: 1px solid var(--border-col); border-radius: 12px; background: var(--bg-card); box-shadow: var(--shadow-card); }
  .vertical-context-menu { display: none; position: fixed; z-index: 60; width: 154px; padding: 4px; border: 1px solid var(--border-col); border-radius: 9px; background: var(--bg-card); box-shadow: var(--shadow-card); }
  .vertical-context-menu.open { display: flex; flex-direction: column; gap: 2px; }
  .vertical-context-menu button { border: 0; border-radius: 6px; background: transparent; color: var(--text-primary); padding: 7px 9px; text-align: left; font: inherit; cursor: pointer; }
  .vertical-context-menu button:hover { background: var(--bg-subtle); }
  .space-popover.open { display: block; }
  .space-picker-title { padding: 3px 5px 7px; color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; }
  .space-list { display: flex; flex-direction: column; gap: 3px; max-height: 230px; overflow-y: auto; }
  .space-item { display: flex; align-items: center; gap: 4px; border-radius: 8px; }
  .space-item.active { background: var(--accent-soft); }
  .space-select { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; border: 0; background: transparent; color: var(--text-primary); text-align: left; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 11.5px; }
  .space-select:hover { background: var(--bg-subtle); }
  .space-item.active .space-select { color: var(--accent-text); font-weight: 700; }
  .space-action { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; }
  .space-action:hover { background: var(--bg-subtle); color: var(--text-primary); }
  .space-action.delete:hover { color: #ef4444; }
  .space-create { display: flex; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-col); }
  .space-create input { flex: 1; min-width: 0; border: 1px solid var(--border-col); border-radius: 7px; background: var(--bg-main); color: var(--text-primary); padding: 6px 8px; outline: none; user-select: text; font-size: 11px; }
  .space-create input:focus { border-color: var(--accent); }
  .space-create button { border: 0; border-radius: 7px; background: var(--accent-grad); color: var(--accent-fg); padding: 0 9px; cursor: pointer; font-weight: 700; }
  .brand-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-logo {
    width: 26px;
    height: 26px;
    border-radius: 10px;
    background: var(--accent-grad, var(--accent));
    color: var(--accent-fg);
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-title {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 16.5px;
    color: var(--text-primary);
    letter-spacing: 0.4px;
  }
  .ui-ico {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .ghost-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
    white-space: nowrap;
  }
  .ghost-btn:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
    border-color: var(--border-col);
  }
  .ghost-btn:active {
    transform: scale(0.96);
  }

  /* Khối Thanh Địa Chỉ Chính + Khay Phụ Hover Reveal */
  .v-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .url-form {
    display: flex;
    align-items: center;
    border: 1px solid var(--border-col);
    background: var(--bg-card);
    border-radius: 999px;
    padding: 3px 4px 3px 12px;
    box-shadow: var(--shadow-soft);
    transition: border-color 0.15s var(--ease-ui);
  }
  .url-form:focus-within {
    border-color: var(--accent);
  }
  .url-form input {
    width: 100%;
    border: none;
    background: transparent;
    padding: 6px 2px;
    font-size: 11.5px;
    color: var(--text-primary);
    outline: none;
    user-select: text;
  }
  .url-form input::placeholder {
    color: var(--text-muted);
  }
  .ublock-mini-tag {
    font-size: 9.5px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent-text);
    padding: 2px 6px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* HOVER REVEAL: Các nút phụ (← → ↻ ⌂ ★ & Chia khung) mặc định ẩn gọn, chỉ hiện nhẹ khi rê chuột vào vùng điều khiển */
  .v-hover-drawer {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: max-height 0.2s ease, opacity 0.18s ease;
  }
  .v-controls:hover .v-hover-drawer,
  .v-controls:focus-within .v-hover-drawer {
    max-height: 74px;
    opacity: 1;
  }
  .nav-row {
    display: flex;
    gap: 4px;
  }
  .nav-row button {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 4px 0;
    font-size: 11px;
    cursor: pointer;
    transition: color 0.14s var(--ease-ui), border-color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .nav-row button:hover {
    color: var(--text-primary);
    border-color: var(--accent);
  }
  .nav-row button:active {
    transform: scale(0.96);
  }
  .mode-switch-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }
  .small-pill-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    color: var(--text-secondary);
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    transition: color 0.14s var(--ease-ui), border-color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .small-pill-btn:hover {
    color: var(--text-primary);
    border-color: var(--accent);
  }
  .small-pill-btn:active {
    transform: scale(0.96);
  }
  .small-pill-btn.on {
    background: var(--accent-soft);
    border-color: var(--border-col);
    color: var(--accent-text);
  }

  /* Danh sách Tab Dọc tinh tế */
  .v-tab-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 2px;
  }
  .v-tab-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui);
  }
  .v-tab-item:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .v-tab-item.active {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border-col);
    box-shadow: var(--shadow-soft);
  }
  .v-tab-item.selected { border-color: var(--accent); background: var(--accent-soft); }
  .v-tab-item.grouped::before { content: ""; width: 3px; align-self: stretch; border-radius: 999px; background: var(--accent); }
  .tab-selection-actions { display: none; gap: 4px; padding: 5px 8px; }
  .tab-selection-actions.visible { display: flex; }
  .tab-selection-actions button { flex: 1; font-size: 10px; }
  .worker-section { flex-shrink: 0; border-top: 1px solid var(--border-col); margin-top: 6px; padding-top: 5px; }
  .worker-section-label { display: block; padding: 0 10px 4px; font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  .tab-fav {
    width: 15px;
    height: 15px;
    border-radius: 3px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .tab-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .v-tab-item.active .tab-dot {
    background: var(--accent);
  }
  .tab-meta {
    flex: 1;
    min-width: 0;
  }
  .tab-worker-badge {
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 999px;
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }
  .tab-worker-badge.bot {
    background: rgba(245, 158, 11, 0.18);
    color: #D97706;
    border: 1px solid rgba(245, 158, 11, 0.45);
  }
  .tab-worker-badge.ai {
    background: rgba(16, 185, 129, 0.16);
    color: #059669;
    border: 1px solid rgba(16, 185, 129, 0.45);
  }
  .tab-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .v-tab-item.active .tab-title {
    font-weight: 600;
  }
  .tab-sub {
    font-size: 10px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* HOVER REVEAL: Nút đóng Tab × chỉ hiện nhẹ khi rê chuột vào dòng Tab */
  .tab-close {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    padding: 0 3px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .v-tab-item.active .tab-close,
  .h-tab-item.active .tab-close {
    opacity: 0.65;
  }
  .v-tab-item:hover .tab-close,
  .h-tab-item:hover .tab-close {
    opacity: 1;
  }
  .tab-close:hover {
    color: #ef4444;
  }
  .tab-pin {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--accent-text);
    cursor: pointer;
    opacity: 0.78;
  }
  .tab-pin:hover { background: var(--accent-soft); opacity: 1; }

  .v-newtab-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 2px;
  }
  .quiet-add-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 11.5px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.14s var(--ease-ui), color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .quiet-add-btn:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .quiet-add-btn:active {
    transform: scale(0.96);
  }


  .ai-toggle-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    color: var(--text-primary);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .ai-toggle-btn:hover {
    border-color: var(--accent);
  }
  .ai-toggle-btn:active {
    transform: scale(0.96);
  }
  .ai-toggle-btn.bubble-mode {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  /* ================= HORIZONTAL TOP MODE ================= */
  body.mode-horizontal #vertical_root { display: none !important; }
  body.mode-horizontal #horizontal_root {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    border-bottom: 1px solid var(--border-col);
    background: var(--bg-side);
  }
  .h-row-tabs {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    gap: 6px;
  }
  .h-tabs-scroll {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    height: 100%;
  }
  .h-tab-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    max-width: 210px;
    min-width: 110px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .h-tab-item:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .h-tab-item.active {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border-col);
    box-shadow: var(--shadow-soft);
  }
  .h-tab-title {
    flex: 1;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .h-right-tools {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .h-row-nav {
    height: 41px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
    background: var(--bg-main);
  }
  .h-nav-btns {
    display: flex;
    gap: 3px;
    opacity: 0.45;
    transition: opacity 0.15s ease;
  }
  .h-row-nav:hover .h-nav-btns {
    opacity: 1;
  }
  .h-url-form {
    flex: 1;
    display: flex;
    align-items: center;
    border: 1px solid var(--border-col);
    background: var(--bg-card);
    border-radius: 999px;
    padding: 3px 4px 3px 14px;
  }
  .h-url-form input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 5px 4px;
    font-size: 12px;
    color: var(--text-primary);
    outline: none;
    user-select: text;
  }
  .h-url-form button {
    background: var(--accent-grad, var(--accent));
    color: var(--accent-fg);
    border: none;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body class="mode-vertical">
  <!-- GIAO DIỆN TAB DỌC BÊN TAY TRÁI -->
  <div id="vertical_root">
    <div class="v-header">
      <div class="v-window-row">
        <button class="ghost-btn vertical-brand" id="vertical_brand" type="button" onclick="sendRust({cmd:'open_settings_modal', section:'look_feel'})" title="Menu & Cài đặt (Alt+,)" aria-label="Menu & Cài đặt">
          <span class="vertical-brand-fallback" id="vertical_brand_fallback">TP</span>
          <img class="vertical-brand-img" id="vertical_brand_img" alt="" />
        </button>
        <div class="v-drag-region" onmousedown="if(event.button===0)sendRust({cmd:'drag_window'})" title="Kéo để di chuyển cửa sổ"></div>
        <div class="v-window-controls">
          <button class="ghost-btn v-window-btn" type="button" onclick="sendRust({cmd:'win_minimize'})" title="Thu nhỏ" aria-label="Thu nhỏ"><svg class="ui-ico" viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
          <button class="ghost-btn v-window-btn" type="button" onclick="sendRust({cmd:'win_toggle_maximize'})" title="Phóng to / Khôi phục" aria-label="Phóng to / Khôi phục"><svg class="ui-ico" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/></svg></button>
          <button class="ghost-btn v-window-btn close" type="button" onclick="sendRust({cmd:'win_close'})" title="Đóng TPbrowser" aria-label="Đóng TPbrowser"><svg class="ui-ico" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
        </div>
      </div>
    </div>

    <form class="v-controls hide-when-collapsed" onsubmit="submitUrlVertical(event)">
      <div class="url-form">
        <input id="v_url_input" autocomplete="off" spellcheck="false" placeholder="Tìm kiếm hoặc nhập địa chỉ" aria-label="Địa chỉ trang" />
        <button type="submit" title="Mở địa chỉ">→</button>
      </div>
    </form>
    <section class="tab-section hide-when-collapsed" id="v_pinned_section" hidden>
      <div id="v_pinned_grid" class="pinned-tab-grid"></div>
    </section>
    <div class="v-divider hide-when-collapsed"></div>
    <button class="v-newtab-btn" type="button" onclick="sendRust({cmd:'new_tab', url:'tp://newtab', isolated:false})" title="Tab mới (Ctrl+T)">
      <svg class="ui-ico" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      <span>Tab mới</span>
    </button>
    <div id="v_selection_actions" class="tab-selection-actions hide-when-collapsed" aria-label="Thao tác tab đã chọn">
      <button type="button" class="small-pill-btn" onclick="sendRust({ cmd: 'group_selected_tabs' })">Nhóm</button>
      <button id="v_split_drop_target" type="button" class="small-pill-btn" onclick="sendRust({ cmd: 'split_selected_tabs' })" ondragover="event.preventDefault()" ondrop="var id=Number(event.dataTransfer.getData('text/tp-tab-id'));if(id)sendRust({ cmd: 'split_tab_group', tab_ids: [id] })">Tách</button>
      <button type="button" class="small-pill-btn" onclick="sendRust({ cmd: 'scan_selected_tabs' })">Quét</button>
    </div>
    <div id="v_tab_list" class="v-tab-list"></div>

    <div class="space-section hide-when-collapsed">
      <span class="space-section-label">Spaces</span>
      <div class="space-switcher">
        <button class="ghost-btn space-toggle" id="space_toggle" type="button" aria-haspopup="true" aria-expanded="false" title="Chọn Space">Default ▾</button>
        <div class="space-popover" id="space_popover" role="dialog" aria-label="Spaces">
          <div class="space-picker-title">Spaces</div>
          <div class="space-list" id="space_list"></div>
          <form class="space-create" id="space_create_form">
            <input id="space_create_name" maxlength="64" autocomplete="off" placeholder="Tên Space mới" aria-label="Tên Space mới" />
            <button type="submit" title="Tạo Space">+</button>
          </form>
        </div>
      </div>
    </div>
    <section class="tab-section worker-section hide-when-collapsed" id="v_worker_section" hidden>
      <span class="worker-section-label">Worker</span>
      <div id="v_worker_list" class="extension-tab-list"></div>
    </section>
    <div id="vertical_context_menu" class="vertical-context-menu" role="menu" aria-label="Điều hướng trang">
      <button type="button" role="menuitem" onclick='sendRust({ cmd: "nav_back" }); closeVerticalContextMenu();'>Quay lại</button>
      <button type="button" role="menuitem" onclick='sendRust({ cmd: "nav_forward" }); closeVerticalContextMenu();'>Đi tới</button>
      <button type="button" role="menuitem" onclick='sendRust({ cmd: "reload" }); closeVerticalContextMenu();'>Tải lại</button>
    </div>
  </div>

  <script>/*__TP_MOTION_JS__*/</script>
  <script>/*__TP_BRAND_ASSETS_JS__*/</script>

  <script>
    var currentTheme = document.documentElement.getAttribute("data-theme") || "obsidian-gold";
    var currentLogoStyle = "ribbon";

    function resolveTabFavicon(t) {
      if (!t) return "";
      if (t.url === "tp://newtab" || t.url === "tp://history" || t.url === "tp://workspace") {
        return window.__tpResolveBrandAsset ? window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme) : "";
      }
      if (t.favicon) return t.favicon;
      try {
        if (t.url && (t.url.startsWith("http://") || t.url.startsWith("https://"))) {
          var host = new URL(t.url).hostname;
          if (host) return "https://www.google.com/s2/favicons?sz=32&domain=" + encodeURIComponent(host);
        }
      } catch (_) {}
      return "";
    }

    function fallbackWebFavicon() {
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='#151922' stroke='#D4AF37' stroke-width='2'/><path d='M3 16h26M16 2c4 4 6 8.7 6 14s-2 10-6 14c-4-4-6-8.7-6-14S12 6 16 2Z' fill='none' stroke='#E2BE68' stroke-width='1.6'/></svg>"
      );
    }

    function renderVerticalBrand() {
      var image = document.getElementById("vertical_brand_img");
      var fallback = document.getElementById("vertical_brand_fallback");
      var asset = window.__tpResolveBrandAsset ? window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme) : "";
      image.style.display = "none";
      fallback.style.display = "inline-flex";
      if (!asset) return;
      image.onload = function() {
        image.style.display = "block";
        fallback.style.display = "none";
      };
      image.onerror = function() {
        image.style.display = "none";
        fallback.style.display = "inline-flex";
      };
      image.src = asset;
    }

    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    var verticalRoot = document.getElementById("vertical_root");
    var verticalContextMenu = document.getElementById("vertical_context_menu");
    function closeVerticalContextMenu() {
      verticalContextMenu.classList.remove("open");
    }
    verticalRoot.addEventListener("contextmenu", function(event) {
      event.preventDefault();
      verticalContextMenu.style.left = Math.min(event.clientX, window.innerWidth - 162) + "px";
      verticalContextMenu.style.top = Math.min(event.clientY, window.innerHeight - 110) + "px";
      verticalContextMenu.classList.add("open");
    });
    document.addEventListener("mousedown", function(event) {
      if (!verticalContextMenu.contains(event.target)) closeVerticalContextMenu();
    });
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closeVerticalContextMenu();
    });

    function cycleThemeQuick() {
      var next = (currentTheme === "obsidian-gold") ? "carrara-light" : "obsidian-gold";
      currentTheme = next;
      document.documentElement.setAttribute("data-theme", next);
      sendRust({ cmd: "set_ui_theme", theme: next });
    }

    function submitUrlVertical(e) {
      e.preventDefault();
      var val = document.getElementById("v_url_input").value.trim();
      if (!val) return;
      if (val.toLowerCase().startsWith("@ai ")) {
        sendRust({ cmd: "run_ai_prompt", prompt: val.slice(4).trim() });
      } else {
        sendRust({ cmd: "navigate_active", url: val });
      }
    }

    function submitUrlHorizontal(e) {
      e.preventDefault();
      var val = document.getElementById("h_url_input").value.trim();
      if (!val) return;
      if (val.toLowerCase().startsWith("@ai ")) {
        sendRust({ cmd: "run_ai_prompt", prompt: val.slice(4).trim() });
      } else {
        sendRust({ cmd: "navigate_active", url: val });
      }
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function closeSpacePicker() {
      var popover = document.getElementById("space_popover");
      var toggle = document.getElementById("space_toggle");
      popover.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
    }

    function renderSpaces(state) {
      var spaces = Array.isArray(state.workspaces) ? state.workspaces : [];
      var activeId = String(state.active_workspace_id || "");
      var list = document.getElementById("space_list");
      var label = document.getElementById("space_toggle");
      list.textContent = "";
      var activeName = "Default";
      for (var i = 0; i < spaces.length; i++) {
        (function(space) {
          if (!space || typeof space.id !== "string" || typeof space.name !== "string") return;
          if (space.id === activeId) activeName = space.name;
          var row = document.createElement("div");
          row.className = "space-item" + (space.id === activeId ? " active" : "");
          var select = document.createElement("button");
          select.type = "button";
          select.className = "space-select";
          select.textContent = space.name;
          select.title = space.name;
          select.onclick = function() {
            closeSpacePicker();
            sendRust({ cmd: "set_active_workspace", workspace_id: space.id });
          };
          row.appendChild(select);
          var rename = document.createElement("button");
          rename.type = "button";
          rename.className = "space-action";
          rename.textContent = "✎";
          rename.title = "Đổi tên Space";
          rename.setAttribute("aria-label", rename.title);
          rename.onclick = function() {
            var next = window.prompt("Tên Space", space.name);
            if (next !== null && next.trim()) sendRust({ cmd: "rename_workspace", workspace_id: space.id, name: next.trim() });
          };
          row.appendChild(rename);
          if (space.id !== "default") {
            var remove = document.createElement("button");
            remove.type = "button";
            remove.className = "space-action delete";
            remove.textContent = "×";
            remove.title = "Xóa Space; tab sẽ chuyển về Default";
            remove.setAttribute("aria-label", remove.title);
            remove.onclick = function() {
              if (window.confirm("Xóa Space '" + space.name + "'? Tab của Space này sẽ chuyển về Default.")) {
                closeSpacePicker();
                sendRust({ cmd: "delete_workspace", workspace_id: space.id });
              }
            };
            row.appendChild(remove);
          }
          list.appendChild(row);
        })(spaces[i]);
      }
      label.textContent = activeName + " ▾";
      label.title = "Chọn Space: " + activeName;
    }

    document.getElementById("space_toggle").onclick = function() {
      var popover = document.getElementById("space_popover");
      var open = !popover.classList.contains("open");
      popover.classList.toggle("open", open);
      this.setAttribute("aria-expanded", String(open));
      if (open) document.getElementById("space_create_name").focus();
    };
    document.getElementById("space_create_form").onsubmit = function(event) {
      event.preventDefault();
      var input = document.getElementById("space_create_name");
      var name = input.value.trim();
      if (!name) return;
      input.value = "";
      closeSpacePicker();
      sendRust({ cmd: "create_workspace", name: name });
    };
    document.addEventListener("pointerdown", function(event) {
      var picker = document.querySelector(".space-switcher");
      if (picker && !picker.contains(event.target)) closeSpacePicker();
    });

    window.__tpSyncShellState = function (state) {
      if (!state) return;
      if (state.ui_theme) {
        currentTheme = state.ui_theme;
        document.documentElement.setAttribute("data-theme", state.ui_theme);
      }
      if (state.logo_style) {
        currentLogoStyle = state.logo_style;
      }
      var body = document.body;
      if (state.orientation === "horizontal") {
        body.classList.remove("mode-vertical");
        body.classList.add("mode-horizontal");
      } else {
        body.classList.remove("mode-horizontal");
        body.classList.add("mode-vertical");
      }

      body.classList.toggle("collapsed", !!state.sidebar_collapsed);
      renderVerticalBrand();

      var tabs = state.tabs || [];
      var activeIdx = state.active_idx || 0;
      renderSpaces(state);



      function isWorkerTab(t) {
        return !!t.worker_kind;
      }

      function renderVerticalTab(t, isAct, iconOnly) {
          var title = t.title || (t.url === "tp://newtab" ? "Không gian bắt đầu" : t.url);
          if (title === "Trang Bắt Đầu Trắng") title = "Không gian bắt đầu";
          var favUrl = resolveTabFavicon(t);

          var row = document.createElement("div");
          row.className = "v-tab-item " + (isAct ? "active " : "") + (t.selected ? "selected " : "") + (t.group_id ? "grouped" : "");
          row.title = title;
          if (!t.worker_kind) {
            row.draggable = true;
            row.addEventListener("dragstart", function(event) {
              event.dataTransfer.setData("text/tp-tab-id", String(t.id));
              event.dataTransfer.effectAllowed = "move";
            });
            row.addEventListener("dragover", function(event) {
              var sourceId = event.dataTransfer.getData("text/tp-tab-id");
              if (sourceId && Number(sourceId) !== t.id) { event.preventDefault(); event.dataTransfer.dropEffect = "move"; }
            });
            row.addEventListener("drop", function(event) {
              var sourceId = Number(event.dataTransfer.getData("text/tp-tab-id"));
              if (sourceId && sourceId !== t.id) { event.preventDefault(); sendRust({ cmd: "group_tabs", source_id: sourceId, target_id: t.id }); }
            });
          }
          row.onclick = function(event) {
            if (t.worker_kind) { sendRust({ cmd: "focus_tab_by_id", tab_id: t.id }); return; }
            var mode = event.ctrlKey || event.metaKey ? "toggle" : (event.shiftKey ? "range" : "replace");
            sendRust({ cmd: "set_tab_selection", tab_id: t.id, mode: mode });
            if (mode === "replace") sendRust({ cmd: "focus_tab_by_id", tab_id: t.id });
          };

          if (favUrl) {
            var img = document.createElement("img");
            img.className = "tab-fav";
            img.src = favUrl;
            img.alt = "";
            img.onerror = function() {
              img.onerror = null;
              img.src = fallbackWebFavicon();
            };
            row.appendChild(img);
          } else {
            var img = document.createElement("img");
            img.className = "tab-fav";
            img.src = fallbackWebFavicon();
            img.alt = "";
            row.appendChild(img);
          }

          var meta = document.createElement("div");
          meta.className = "tab-meta hide-when-collapsed";
          var tDiv = document.createElement("div");
          tDiv.className = "tab-title";
          tDiv.textContent = title;
          meta.appendChild(tDiv);
          if (!iconOnly) row.appendChild(meta);

          if (isAct && !iconOnly && !t.worker_kind) {
            var pin = document.createElement("button");
            pin.className = "tab-pin hide-when-collapsed";
            pin.title = t.pinned ? "Bỏ ghim tab hiện tại" : "Ghim tab hiện tại";
            pin.setAttribute("aria-label", pin.title);
            var pinSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            pinSvg.setAttribute("class", "ui-ico");
            pinSvg.setAttribute("viewBox", "0 0 16 16");
            var pinPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pinPath.setAttribute("d", "M5 2.5h6l-.8 3 2 2v1H8.8v4l-.8 1-1-1v-4H3.8v-1l2-2z");
            if (t.pinned) pinPath.setAttribute("fill", "currentColor");
            pinSvg.appendChild(pinPath);
            pin.appendChild(pinSvg);
            if (t.pinned) pin.style.color = "var(--accent)";
            pin.onclick = function(ev) {
              ev.stopPropagation();
              sendRust({ cmd: "toggle_tab_pinned" });
            };
            row.appendChild(pin);
          }

          if (!iconOnly && (t.worker_kind === "bot" || t.worker_kind === "ai")) {
            var wb = document.createElement("span");
            wb.className = "tab-worker-badge hide-when-collapsed " + t.worker_kind;
            wb.textContent = t.worker_kind === "ai" ? "AI" : "BOT";
            row.appendChild(wb);
          }

          if (!iconOnly) {
            var cls = document.createElement("button");
            cls.className = "tab-close hide-when-collapsed";
            cls.textContent = "×";
            cls.title = "Đóng tab";
            cls.onclick = function(ev) {
              ev.stopPropagation();
              sendRust({ cmd: "close_tab_by_id", tab_id: t.id });
            };
            row.appendChild(cls);
          }
          return row;
      }

      var workerTabs = tabs.filter(isWorkerTab);
      var pinnedTabs = tabs.filter(function(t) { return !isWorkerTab(t) && !!t.pinned; });
      var normalTabs = tabs.filter(function(t) { return !isWorkerTab(t) && !t.pinned; });
      var pinnedSection = document.getElementById("v_pinned_section");
      var pinnedGrid = document.getElementById("v_pinned_grid");
      var vListEl = document.getElementById("v_tab_list");
      var workerSection = document.getElementById("v_worker_section");
      var workerList = document.getElementById("v_worker_list");
      var selectionActions = document.getElementById("v_selection_actions");
      pinnedGrid.innerHTML = "";
      vListEl.innerHTML = "";
      workerList.innerHTML = "";
      pinnedSection.hidden = pinnedTabs.length === 0;
      workerSection.hidden = workerTabs.length === 0;
      selectionActions.classList.toggle("visible", normalTabs.some(function(t) { return !!t.selected; }));
      pinnedTabs.forEach(function(t) {
        pinnedGrid.appendChild(renderVerticalTab(t, tabs.indexOf(t) === activeIdx, true));
      });
      normalTabs.forEach(function(t) {
        vListEl.appendChild(renderVerticalTab(t, tabs.indexOf(t) === activeIdx, false));
      });
      workerTabs.forEach(function(t) {
        workerList.appendChild(renderVerticalTab(t, tabs.indexOf(t) === activeIdx, false));
      });
    };

    /*__TP_BOOTSTRAP_JS__*/
    if (window.__TP_BOOTSTRAP__ && window.__tpSyncShellState) {
      window.__tpSyncShellState(window.__TP_BOOTSTRAP__);
    }
    sendRust({ cmd: "ui_shell_ready", shell: "tab_shell" });
  </script>
</body>
</html>
