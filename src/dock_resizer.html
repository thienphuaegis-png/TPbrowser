<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>Dock Resizer</title>
<style>
  :root, html[data-theme="obsidian-gold"] {
    --bar-bg: #111318;
    --line-idle: rgba(212, 175, 55, 0.16);
    --line-hot: #E2BE68;
  }
  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    --bar-bg: #EFE9DC;
    --line-idle: rgba(24, 19, 12, 0.14);
    --line-hot: #7A510B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bar-bg);
    cursor: ew-resize;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .seam {
    width: 1px;
    height: 100%;
    background: var(--line-idle);
    transition: background-color 0.16s ease, width 0.16s ease;
    position: relative;
  }
  body:hover .seam, body.dragging .seam {
    width: 2.5px;
    background: var(--line-hot);
  }
  .grip {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scaleY(0.7);
    width: 3.5px;
    height: 40px;
    border-radius: 999px;
    background: var(--line-hot);
    opacity: 0;
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  body:hover .grip, body.dragging .grip {
    opacity: 0.95;
    transform: translate(-50%, -50%) scaleY(1);
  }
</style>
</head>
<body title="Kéo trái / phải để chỉnh độ rộng thanh bên phải (Nhấp đúp để đặt lại)">
  <div class="seam"><div class="grip"></div></div>
  <script>
    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    document.body.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      if (e.detail >= 2) {
        sendRust({ cmd: "reset_dock_width" });
      } else {
        document.body.classList.add("dragging");
        sendRust({ cmd: "start_dock_resize" });
      }
    });

    window.addEventListener("mouseup", function () {
      document.body.classList.remove("dragging");
    });

    window.__tpSyncDockResizer = function (st) {
      if (!st) return;
      if (st.ui_theme) document.documentElement.setAttribute("data-theme", st.ui_theme);
      if (st.dragging === false) document.body.classList.remove("dragging");
    };

    window.addEventListener("tp_config_changed", function (ev) {
      if (ev && ev.detail) window.__tpSyncDockResizer(ev.detail);
    });
    sendRust({ cmd: "ui_shell_ready", shell: "dock_resizer" });
  </script>
</body>
</html>
