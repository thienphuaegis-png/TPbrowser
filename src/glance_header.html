<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>TPbrowser Glance Header</title>
<style>
/*__TP_FONT_FACE__*/
  :root, html[data-theme="obsidian-gold"] {
    --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-bar: #14171E;
    --bg-pill-hover: #232733;
    --gold-bright: #E2BE68;
    --text-primary: #F5F2EB;
    --text-secondary: #C8C0B0;
    --border-col: rgba(212, 175, 55, 0.34);
  }

  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    --bg-bar: #FAF6EE;
    --bg-pill-hover: #F0E9D8;
    --gold-bright: #18130C;
    --text-primary: #18130C;
    --text-secondary: #4A3E2D;
    --border-col: rgba(24, 19, 12, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-bar);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    border-top: 1px solid var(--border-col);
    border-left: 1px solid var(--border-col);
    border-right: 1px solid var(--border-col);
    border-radius: 12px 12px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    cursor: default;
  }

  .gl-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--gold-bright);
    min-width: 0;
    flex: 1;
  }
  .gl-eye { flex-shrink: 0; font-size: 12px; }
  .gl-lbl {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .gl-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .gl-ico-btn {
    width: 24px;
    height: 24px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.14s var(--ease-ui), color 0.14s var(--ease-ui), transform 0.12s var(--ease-ui);
  }
  .gl-ico-btn:hover {
    background: var(--bg-pill-hover);
    color: var(--gold-bright);
  }
  .gl-ico-btn:active { transform: scale(0.92); }
  .gl-ico-btn svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .gl-esc-hint {
    font-size: 10px;
    color: var(--text-secondary);
    opacity: 0.7;
    white-space: nowrap;
    margin-right: 2px;
  }
</style>
</head>
<body onmousedown="event.stopPropagation();">
  <div class="gl-title">
    <span class="gl-eye">👁️</span>
    <span class="gl-lbl" id="gl_title_lbl">Xem Nhanh</span>
  </div>

  <div class="gl-actions">
    <span class="gl-esc-hint">ESC để đóng</span>
    <button type="button" class="gl-ico-btn" onclick="sendRust({cmd:'glance_open_in_tab'})" title="Mở ra Tab lớn">
      <svg viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5L7.5 8.5"/><path d="M12.5 9.5v3a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3"/></svg>
    </button>
    <button type="button" class="gl-ico-btn" onclick="sendRust({cmd:'close_glance'})" title="Đóng (ESC)">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>

  <script>
    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    window.__tpSyncGlanceHeader = function (st) {
      if (!st) return;
      if (st.ui_theme) {
        document.documentElement.setAttribute("data-theme", st.ui_theme);
      }
      var lbl = document.getElementById("gl_title_lbl");
      if (lbl && typeof st.title === "string") {
        lbl.textContent = st.title || "Xem Nhanh";
      }
    };

    window.addEventListener("tp_config_changed", function (ev) {
      if (ev && ev.detail) {
        window.__tpSyncGlanceHeader(ev.detail);
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        sendRust({ cmd: "close_glance" });
      }
    });

    sendRust({ cmd: "ui_shell_ready", shell: "glance_header" });
  </script>
</body>
</html>
