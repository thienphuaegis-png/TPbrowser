[package]
name = "TPbrowser"
version = "0.1.0"
edition = "2021"
description = "TPbrowser — Trình duyệt cá nhân Rust (Tab Ngang/Dọc, Trang Trắng Decor, Quản lý Google Account & AI Cowork Bong Bóng Tự Thu Gọn)"

[dependencies]
tao = "0.37.2"
wry = { version = "0.57.1", features = ["devtools"] }
webview2-com = "=0.39.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
