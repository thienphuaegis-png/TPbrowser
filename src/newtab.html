<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>TPbrowser — Không Gian Bắt Đầu</title>
<link id="tp_favicon" rel="icon" type="image/png" href="" />
<style>
/*__TP_FONT_FACE__*/
  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --font-heading: "Cormorant Garamond Gnosis", "Cormorant Garamond", Georgia, serif;
    --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-base: #131313;
    --bg-glass: rgba(20, 23, 30, 0.72);
    --bg-glass-hover: rgba(30, 34, 44, 0.92);
    --bg-input: rgba(15, 17, 23, 0.88);
    --bg-tile: rgba(22, 25, 33, 0.78);
    --bg-tile-hover: rgba(32, 37, 48, 0.96);
    --bg-modal: #151821;
    --gold-bright: #E2BE68;
    --gold-main: #C99B3B;
    --gold-soft: rgba(212, 175, 55, 0.14);
    --gold-line: rgba(255, 255, 255, 0.12);
    --gold-line-strong: rgba(226, 190, 104, 0.68);
    --text-main: #F5F2EB;
    --text-sub: #C8C0B0;
    --text-muted: #8E8779;
    --cta-bg: linear-gradient(135deg, #E2BE68 0%, #B5872E 100%);
    --cta-fg: #FFFFFF;
    --cta-shine: inset 0 1px 0 rgba(255, 255, 255, 0.36), 0 4px 14px rgba(181, 135, 46, 0.28);
    --ambient-glow: radial-gradient(circle, rgba(212, 175, 55, 0.13) 0%, rgba(212, 175, 55, 0.03) 42%, transparent 72%);
    --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.38);
    --shadow-hover: 0 14px 34px rgba(0, 0, 0, 0.52);
  }

  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --bg-base: #FAFAFA;
    --bg-glass: rgba(255, 255, 255, 0.78);
    --bg-glass-hover: rgba(255, 255, 255, 0.98);
    --bg-input: rgba(255, 255, 255, 0.94);
    --bg-tile: rgba(255, 255, 255, 0.86);
    --bg-tile-hover: #FFFFFF;
    --bg-modal: #FFFFFF;
    --gold-bright: #18130C;
    --gold-main: #7A510B;
    --gold-soft: rgba(122, 81, 11, 0.12);
    --gold-line: rgba(24, 24, 27, 0.14);
    --gold-line-strong: rgba(122, 81, 11, 0.46);
    --text-main: #18130C;
    --text-sub: #3A2F20;
    --text-muted: #665744;
    --cta-bg: linear-gradient(135deg, #A8741A 0%, #7A510B 100%);
    --cta-fg: #FFFFFF;
    --cta-shine: inset 0 1px 0 rgba(255, 255, 255, 0.30), 0 4px 12px rgba(122, 81, 11, 0.22);
    --ambient-glow: radial-gradient(circle, rgba(181, 135, 46, 0.16) 0%, rgba(181, 135, 46, 0.04) 45%, transparent 72%);
    --shadow-soft: 0 8px 24px rgba(48, 34, 12, 0.08);
    --shadow-hover: 0 12px 28px rgba(48, 34, 12, 0.13);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-base);
    color: var(--text-main);
    font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.26s ease, color 0.26s ease;
  }

  /* Nền đá cẩm thạch & dải lụa vàng AURELIA + ambient glow kiểu Zen */
  .art-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .art-bg svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .ambient-orb {
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: min(860px, 95vw);
    height: 520px;
    background: var(--ambient-glow);
    pointer-events: none;
  }
  html[data-theme="obsidian-gold"] .svg-light { display: none; }
  html[data-theme="carrara-light"] .svg-dark,
  html[data-theme="warm-paper"] .svg-dark,
  html[data-theme="light"] .svg-dark { display: none; }

  .workspace-shell {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header nổi siêu tối giản chuẩn Zen */
  .top-bar {
    height: 64px;
    padding: 14px 28px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .brand-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    opacity: 0.92;
  }
  .tp-monogram {
    height: 32px;
    min-width: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .tp-monogram img {
    height: 32px;
    width: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.22));
  }
  .brand-title {
    font-family: var(--font-heading);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1.8px;
    color: var(--gold-bright);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .ui-ico {
    width: 13.5px;
    height: 13.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .zen-pill-btn {
    height: 32px;
    background: var(--bg-glass);
    border: 1px solid var(--gold-line);
    color: var(--text-sub);
    padding: 0 12px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    backdrop-filter: none;
    white-space: nowrap;
    transition: background-color 0.14s var(--ease-ui), border-color 0.14s var(--ease-ui), color 0.14s var(--ease-ui), transform 0.12s var(--ease-ui);
  }
  .zen-pill-btn.icon-only {
    width: 32px;
    padding: 0;
  }
  .zen-pill-btn:hover {
    background: var(--bg-glass-hover);
    border-color: var(--gold-line-strong);
    color: var(--gold-bright);
  }
  .zen-pill-btn:active { transform: scale(0.96); }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
  }

  /* Trục trung tâm rộng thoáng kiểu Zen */
  .center-stage-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 88px 34px 36px;
    overflow-y: auto;
  }
  .center-stage {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .clock-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 24px;
  }
  .clock-time {
    font-family: var(--font-heading);
    font-size: clamp(54px, 7.5vw, 76px);
    font-weight: 600;
    letter-spacing: 5px;
    font-variant-numeric: lining-nums tabular-nums;
    color: var(--gold-bright);
    line-height: 1;
    margin-bottom: 8px;
  }
  .clock-date {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.6px;
    color: var(--text-sub);
    text-transform: capitalize;
  }
  .diamond-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 190px;
    margin: 14px auto 0;
  }
  .diamond-divider .line {
    flex: 1;
    height: 1px;
    background: var(--gold-line-strong);
    opacity: 0.7;
  }
  .diamond-divider .diamond {
    width: 7px;
    height: 7px;
    background: var(--gold-bright);
    transform: rotate(45deg);
  }

  /* Zen Floating Omnibox */
  .omnibox-block {
    margin-bottom: 30px;
  }
  .omnibox-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 6px 5px 16px;
    border: 1.5px solid var(--gold-line);
    background: var(--bg-input);
    border-radius: 999px;
    box-shadow: var(--shadow-soft);
    transition: border-color 0.16s var(--ease-ui), box-shadow 0.16s var(--ease-ui);
  }
  .omnibox-wrap:focus-within {
    border-color: var(--gold-line-strong);
    box-shadow: 0 0 0 3px var(--gold-soft), var(--shadow-hover);
  }
  .omni-lead {
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    transition: color 0.16s ease;
  }
  .omnibox-wrap.is-ai .omni-lead {
    color: var(--gold-bright);
  }
  .omni-ai-pill {
    display: none;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--gold-soft);
    border: 1px solid var(--gold-line-strong);
    color: var(--gold-bright);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    flex-shrink: 0;
  }
  .omnibox-wrap.is-ai .omni-ai-pill {
    display: inline-flex;
  }
  .omnibox-wrap input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 10px 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-main);
    outline: none;
    user-select: text;
  }
  .omnibox-wrap input::placeholder {
    color: var(--text-muted);
  }
  .omnibox-wrap .btn-open {
    background: var(--cta-bg);
    color: var(--cta-fg);
    box-shadow: var(--cta-shine);
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .omnibox-wrap .btn-open:hover { opacity: 0.93; }
  .omnibox-wrap .btn-open:active { transform: scale(0.96); }

  .omni-hints {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .omni-hints kbd {
    font-family: Consolas, "SFMono-Regular", monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 5px;
    border: 1px solid var(--gold-line);
    background: var(--bg-glass);
    color: var(--text-sub);
  }

  /* Lưới Trang Ghim Speed Dial */
  .bm-section {
    background: var(--bg-glass);
    border: 1px solid var(--gold-line);
    border-radius: 18px;
    padding: 16px 18px 18px;
    box-shadow: var(--shadow-soft);
  }
  .sec-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .sec-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-heading);
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 1.4px;
    color: var(--gold-bright);
    text-transform: uppercase;
  }
  .sec-title .mini-diamond {
    width: 6px;
    height: 6px;
    background: var(--gold-bright);
    transform: rotate(45deg);
  }
  .add-bm-link {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-sub);
    cursor: pointer;
    padding: 5px 12px;
    border: 1px solid var(--gold-line);
    border-radius: 999px;
    background: var(--bg-tile);
    transition: border-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), background-color 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .add-bm-link:hover {
    border-color: var(--gold-line-strong);
    color: var(--gold-bright);
    background: var(--bg-tile-hover);
  }
  .add-bm-link:active { transform: scale(0.96); }

  .bm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    min-width: 0;
  }
  .bm-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-tile);
    border: 1px solid var(--gold-line);
    border-radius: 13px;
    padding: 10px 12px;
    cursor: pointer;
    position: relative;
    min-width: 0;
    transition: background-color 0.16s var(--ease-ui), border-color 0.16s var(--ease-ui), transform 0.16s var(--ease-ui), box-shadow 0.16s var(--ease-ui);
  }
  .bm-item:hover {
    background: var(--bg-tile-hover);
    border-color: var(--gold-line-strong);
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
  }
  .bm-item:active { transform: translateY(0) scale(0.98); }

  .bm-icon-box {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--gold-soft);
    border: 1px solid var(--gold-line);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .bm-icon-box img {
    width: 18px;
    height: 18px;
    object-fit: contain;
    display: block;
  }
  .bm-icon-fallback {
    font-family: var(--font-heading);
    font-size: 14px;
    font-weight: 700;
    color: var(--gold-bright);
    text-transform: uppercase;
  }
  .bm-info {
    flex: 1;
    min-width: 0;
  }
  .bm-item .bm-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bm-item .bm-url {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bm-del {
    position: absolute;
    top: 4px;
    right: 6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.14s ease, color 0.14s ease, background-color 0.14s ease;
  }
  .bm-item:hover .bm-del { opacity: 1; }
  .bm-del:hover {
    color: #EF4444;
    background: rgba(239, 68, 68, 0.12);
  }
  .bm-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 20px 12px;
    border: 1px dashed var(--gold-line);
    border-radius: 12px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .bm-folders {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .bm-folder-pill {
    border: 1px solid var(--gold-line);
    background: var(--bg-card);
    color: var(--text-sub);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .bm-folder-pill.active {
    border-color: var(--gold-bright);
    color: var(--gold-bright);
    background: rgba(212, 175, 55, 0.14);
  }
  .bm-meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }
  .bm-meta-chip {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid var(--gold-line);
    color: var(--gold-bright);
    background: rgba(212, 175, 55, 0.10);
  }
  .bm-edit {
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 4px;
    border-radius: 6px;
  }
  .bm-edit:hover { color: var(--gold-bright); }

  /* Modal thêm Bookmark */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(8, 10, 14, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: var(--bg-modal);
    border: 1.5px solid var(--gold-line-strong);
    border-radius: 16px;
    box-shadow: var(--shadow-hover);
    width: min(430px, 92vw);
    padding: 22px 24px;
    color: var(--text-main);
  }
  .modal-card h3 {
    font-family: var(--font-heading);
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 14px;
    color: var(--gold-bright);
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--text-sub);
  }
  .field input {
    width: 100%;
    border: 1px solid var(--gold-line-strong);
    background: var(--bg-input);
    color: var(--text-main);
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 500;
    outline: none;
    user-select: text;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }
  .cta-modal-btn {
    background: var(--cta-bg);
    color: var(--cta-fg);
    box-shadow: var(--cta-shine);
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .cta-modal-btn:active { transform: scale(0.96); }

  @media (max-width: 720px) {
    .top-bar { padding: 10px 14px 4px; }
    .center-stage-wrap { padding: 8px 14px 24px; }
    .zen-pill-btn span { display: none; }
    .omni-hints { display: none; }
  }
</style>
</head>
<body>
  <div class="art-bg">
    <div class="ambient-orb"></div>
    <svg class="svg-dark" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="dk_bg" cx="38%" cy="34%" r="76%">
          <stop offset="0%" stop-color="#151820" />
          <stop offset="56%" stop-color="#0C0E12" />
          <stop offset="100%" stop-color="#07080B" />
        </radialGradient>
        <linearGradient id="dk_gold_rib1" x1="100%" y1="0%" x2="20%" y2="100%">
          <stop offset="0%" stop-color="#4A3514" stop-opacity="0.42" />
          <stop offset="38%" stop-color="#D4AF5A" stop-opacity="0.30" />
          <stop offset="60%" stop-color="#F3DCA2" stop-opacity="0.34" />
          <stop offset="85%" stop-color="#8B6523" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#0B0C0E" stop-opacity="0.06" />
        </linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#dk_bg)" />
      <g stroke="rgba(255,255,255,0.03)" stroke-width="1.2" fill="none">
        <path d="M 80,0 C 190,180 140,340 290,510 C 380,620 260,780 340,900" />
        <path d="M 0,220 C 160,260 270,190 430,310 C 550,400 490,620 640,760" />
      </g>
      <path d="M 1600,-40 C 1340,80 1280,360 1040,560 C 830,730 620,790 430,900 L 860,900 C 1060,770 1240,580 1430,340 C 1510,220 1560,90 1600,-40 Z" fill="url(#dk_gold_rib1)" />
    </svg>

    <svg class="svg-light" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="lt_bg" cx="38%" cy="34%" r="76%">
          <stop offset="0%" stop-color="#FDFBF7" />
          <stop offset="60%" stop-color="#F5EFE4" />
          <stop offset="100%" stop-color="#EAE1D0" />
        </radialGradient>
        <linearGradient id="lt_gold_rib1" x1="100%" y1="0%" x2="20%" y2="100%">
          <stop offset="0%" stop-color="#D4B575" stop-opacity="0.34" />
          <stop offset="45%" stop-color="#EFE0BE" stop-opacity="0.44" />
          <stop offset="80%" stop-color="#C59F52" stop-opacity="0.26" />
          <stop offset="100%" stop-color="#EAE1D0" stop-opacity="0.14" />
        </linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#lt_bg)" />
      <g stroke="rgba(122,82,16,0.065)" stroke-width="1.2" fill="none">
        <path d="M 80,0 C 190,180 140,340 290,510 C 380,620 260,780 340,900" />
        <path d="M 0,220 C 160,260 270,190 430,310 C 550,400 490,620 640,760" />
      </g>
      <path d="M 1600,-40 C 1340,80 1280,360 1040,560 C 830,730 620,790 430,900 L 860,900 C 1060,770 1240,580 1430,340 C 1510,220 1560,90 1600,-40 Z" fill="url(#lt_gold_rib1)" />
    </svg>
  </div>

  <div class="workspace-shell">
    <header class="top-bar">
      <div class="brand-badge">
        <div class="tp-monogram"><img id="nt_brand_logo" alt="TPbrowser" /></div>
        <span class="brand-title">TPBROWSER</span>
      </div>

      <div class="top-actions">
        <button type="button" class="zen-pill-btn" onclick="sendCmd({cmd:'open_history'})" title="Lịch sử duyệt web (Ctrl+H)">
          <svg class="ui-ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 4.8v3.5l2.3 1.4"/></svg>
          <span>Lịch sử</span>
        </button>
        <button type="button" class="zen-pill-btn icon-only" id="btn_toggle_theme" onclick="toggleThemeQuick()" title="Đổi giao diện Sáng / Tối" aria-label="Đổi giao diện Sáng / Tối">
          <svg class="ui-ico" id="ico_theme" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1"/></svg>
        </button>
        <button type="button" class="zen-pill-btn" onclick="sendCmd({cmd:'open_settings_modal', section:'look_feel'})" title="Mở Cài Đặt (Alt+,)">
          <svg class="ui-ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.8v1.5M8 12.7v1.5M1.8 8h1.5M12.7 8h1.5M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg>
          <span>Cài Đặt</span>
        </button>
      </div>
    </header>

    <div class="center-stage-wrap">
      <main class="center-stage">
        <div class="clock-hero">
          <div class="clock-time" id="nt_clock">00:00</div>
          <div class="clock-date" id="nt_date"></div>
          <div class="diamond-divider">
            <span class="line"></span>
            <span class="diamond"></span>
            <span class="line"></span>
          </div>
        </div>

        <div class="omnibox-block">
          <form class="omnibox-wrap" id="nt_omnibox_form" onsubmit="handleOmnibox(event)">
            <span class="omni-lead" aria-hidden="true">
              <svg class="ui-ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L13.8 13.8"/></svg>
            </span>
            <span class="omni-ai-pill">AI Cowork</span>
            <input id="nt_input" type="text" placeholder="Nhập địa chỉ web, từ khóa tìm kiếm, hoặc gõ @ai ..." autocomplete="off" autofocus oninput="onOmniboxInput(this.value)" />
            <button type="submit" class="btn-open" id="nt_submit_btn">MỞ TRANG</button>
          </form>
          <div class="omni-hints">
            <span><kbd>Ctrl</kbd>+<kbd>K</kbd> Command Bar</span>
            <span><kbd>Alt</kbd>+Click xem nhanh Glance</span>
            <span><kbd>Alt</kbd>+<kbd>Shift</kbd>+Click chia đôi</span>
            <span><kbd>Alt</kbd>+<kbd>,</kbd> Cài đặt</span>
          </div>
        </div>

        <section class="bm-section">
          <div class="sec-bar">
            <div class="sec-title">
              <span class="mini-diamond"></span>
              <span>Trang Ghim Nhanh</span>
            </div>
            <button type="button" class="add-bm-link" onclick="openAddBookmarkModal()">+ Thêm trang</button>
          </div>

          <div id="nt_bm_folders" class="bm-folders"></div>
          <div id="nt_bm_grid" class="bm-grid"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Modal thêm trang ghim -->
  <div id="bm_modal" class="modal-backdrop" onclick="if(event.target===this) closeAddBookmarkModal()">
    <form class="modal-card" onsubmit="event.preventDefault(); saveNewBookmark();">
      <h3 id="bm_modal_title">+ Thêm Trang Ghim Nhanh</h3>
      <div class="field">
        <label for="bm_title_inp">Tên hiển thị</label>
        <input id="bm_title_inp" type="text" placeholder="Ví dụ: Shopee Seller Center" autocomplete="off" />
      </div>
      <div class="field">
        <label for="bm_url_inp">Địa chỉ URL</label>
        <input id="bm_url_inp" type="text" placeholder="https://example.com" autocomplete="off" />
      </div>
      <div class="field">
        <label for="bm_folder_inp">Thư mục (tùy chọn)</label>
        <input id="bm_folder_inp" type="text" placeholder="Ví dụ: Công việc, Giải trí" autocomplete="off" />
      </div>
      <div class="field">
        <label for="bm_tags_inp">Tags (phân cách dấu phẩy)</label>
        <input id="bm_tags_inp" type="text" placeholder="Ví dụ: sheet, báo cáo" autocomplete="off" />
      </div>
      <div class="field">
        <label for="bm_keyword_inp">Keyword (gõ nhanh trên URL bar)</label>
        <input id="bm_keyword_inp" type="text" placeholder="Ví dụ: gs, yt" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button type="button" class="zen-pill-btn" onclick="closeAddBookmarkModal()">Hủy</button>
        <button type="submit" class="cta-modal-btn">Lưu Trang</button>
      </div>
    </form>
  </div>

  <script>/*__TP_MOTION_JS__*/</script>
  <script>/*__TP_BRAND_ASSETS_JS__*/</script>
  <script>
    var currentLogoStyle = "ribbon";
    var currentTheme = document.documentElement.getAttribute("data-theme") || "obsidian-gold";
    var currentBookmarks = [];
    var activeBookmarkFolder = "__all__";
    var editingBookmarkIndex = -1;

    function sendCmd(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    function syncNewTabBrand() {
      var logoEl = document.getElementById("nt_brand_logo");
      if (logoEl && window.__tpResolveBrandAsset) {
        var lSrc = window.__tpResolveBrandAsset("logo", currentLogoStyle, currentTheme);
        if (lSrc && logoEl.getAttribute("src") !== lSrc) logoEl.src = lSrc;
      }
      if (window.__tpSetFavicon && window.__tpResolveBrandAsset) {
        window.__tpSetFavicon(window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme));
      }
    }

    function updateClock() {
      var now = new Date();
      var hh = String(now.getHours()).padStart(2, "0");
      var mm = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("nt_clock").textContent = hh + ":" + mm;
      try {
        var dateEl = document.getElementById("nt_date");
        if (dateEl) {
          dateEl.textContent = now.toLocaleDateString("vi-VN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          });
        }
      } catch (_) {}
    }
    updateClock();
    setInterval(updateClock, 10000);

    function setThemeMode(theme, fromRust) {
      var isLight = (theme === "carrara-light" || theme === "warm-paper" || theme === "light");
      var normalized = isLight ? "carrara-light" : "obsidian-gold";
      currentTheme = normalized;
      document.documentElement.setAttribute("data-theme", normalized);
      var ico = document.getElementById("ico_theme");
      if (ico) {
        ico.innerHTML = isLight
          ? '<path d="M13.5 9.8A5.5 5.5 0 0 1 6.2 2.5a5.5 5.5 0 1 0 7.3 7.3Z"/>'
          : '<circle cx="8" cy="8" r="3.2"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1"/>';
      }
      syncNewTabBrand();
      if (!fromRust) {
        sendCmd({ cmd: "set_ui_theme", theme: normalized });
      }
    }

    function toggleThemeQuick() {
      var next = currentTheme === "carrara-light" ? "obsidian-gold" : "carrara-light";
      setThemeMode(next, false);
    }

    if (window.location.search.indexOf("theme=light") !== -1) {
      setThemeMode("carrara-light", true);
    }

    function onOmniboxInput(val) {
      var isAi = String(val || "").trim().toLowerCase().indexOf("@ai ") === 0;
      var form = document.getElementById("nt_omnibox_form");
      var btn = document.getElementById("nt_submit_btn");
      if (form) form.classList.toggle("is-ai", isAi);
      if (btn) btn.textContent = isAi ? "GIAO AI" : "MỞ TRANG";
    }

    function hostOf(url) {
      try {
        return new URL(url).hostname.replace(/^www\./i, "");
      } catch (_) {
        return String(url || "").replace(/^https?:\/\//i, "").split("/")[0];
      }
    }

    function faviconUrlFor(url) {
      var host = hostOf(url);
      if (!host) return "";
      return "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(host);
    }

    function openBookmark(url, title, ev) {
      if (ev && ev.altKey && !ev.ctrlKey && !ev.metaKey) {
        sendCmd({ cmd: "open_glance", url: url, title: title || url });
        return;
      }
      if (ev && (ev.ctrlKey || ev.metaKey || ev.button === 1)) {
        sendCmd({ cmd: "new_tab", url: url, isolated: false });
        return;
      }
      sendCmd({ cmd: "navigate_active", url: url });
    }

    function renderBookmarkFolders() {
      var bar = document.getElementById("nt_bm_folders");
      if (!bar) return;
      bar.textContent = "";
      var folders = [];
      var seen = Object.create(null);
      for (var i = 0; i < currentBookmarks.length; i++) {
        var f = String((currentBookmarks[i] && currentBookmarks[i].folder) || "").trim();
        if (f && !seen[f]) {
          seen[f] = true;
          folders.push(f);
        }
      }
      if (!folders.length) {
        activeBookmarkFolder = "__all__";
        bar.style.display = "none";
        return;
      }
      bar.style.display = "flex";
      var defs = [{ id: "__all__", label: "Tất cả" }].concat(folders.map(function (f) { return { id: f, label: "📁 " + f }; }));
      for (var d = 0; d < defs.length; d++) {
        (function (def) {
          var pill = document.createElement("button");
          pill.type = "button";
          pill.className = "bm-folder-pill" + (activeBookmarkFolder === def.id ? " active" : "");
          pill.textContent = def.label;
          pill.onclick = function () {
            activeBookmarkFolder = def.id;
            renderBookmarks();
          };
          bar.appendChild(pill);
        })(defs[d]);
      }
    }

    function renderBookmarks() {
      renderBookmarkFolders();
      var grid = document.getElementById("nt_bm_grid");
      if (!grid) return;
      grid.textContent = "";
      if (!currentBookmarks.length) {
        var empty = document.createElement("div");
        empty.className = "bm-empty";
        empty.textContent = "Chưa có trang ghim nào. Bấm “+ Thêm trang” ở góc phải để lưu nhanh.";
        grid.appendChild(empty);
        return;
      }
      for (var i = 0; i < currentBookmarks.length; i++) {
        (function (idx, b) {
          if (!b || !b.url) return;
          var folder = String(b.folder || "").trim();
          if (activeBookmarkFolder !== "__all__" && folder !== activeBookmarkFolder) return;
          var host = hostOf(b.url);
          var title = b.title || host || b.url;
          var item = document.createElement("div");
          item.className = "bm-item";
          item.title = title + "\n" + b.url;
          item.onclick = function (ev) { openBookmark(b.url, title, ev); };
          item.onauxclick = function (ev) {
            if (ev.button === 1) {
              ev.preventDefault();
              openBookmark(b.url, title, ev);
            }
          };

          var iconBox = document.createElement("div");
          iconBox.className = "bm-icon-box";
          var fallback = document.createElement("span");
          fallback.className = "bm-icon-fallback";
          fallback.textContent = (title.trim().charAt(0) || "•").toUpperCase();
          var favSrc = faviconUrlFor(b.url);
          if (favSrc) {
            var img = document.createElement("img");
            img.src = favSrc;
            img.alt = "";
            img.onerror = function () {
              if (img.parentNode) img.parentNode.replaceChild(fallback, img);
            };
            iconBox.appendChild(img);
          } else {
            iconBox.appendChild(fallback);
          }

          var info = document.createElement("div");
          info.className = "bm-info";
          var tEl = document.createElement("div");
          tEl.className = "bm-title";
          tEl.textContent = title;
          var uEl = document.createElement("div");
          uEl.className = "bm-url";
          uEl.textContent = host || b.url;
          info.appendChild(tEl);
          info.appendChild(uEl);
          if (folder || b.keyword || (Array.isArray(b.tags) && b.tags.length)) {
            var metaRow = document.createElement("div");
            metaRow.className = "bm-meta-row";
            if (folder) {
              var fChip = document.createElement("span");
              fChip.className = "bm-meta-chip";
              fChip.textContent = "📁 " + folder;
              metaRow.appendChild(fChip);
            }
            if (b.keyword) {
              var kChip = document.createElement("span");
              kChip.className = "bm-meta-chip";
              kChip.textContent = "@" + b.keyword;
              metaRow.appendChild(kChip);
            }
            if (Array.isArray(b.tags)) {
              for (var ti = 0; ti < b.tags.length; ti++) {
                if (!b.tags[ti]) continue;
                var tgChip = document.createElement("span");
                tgChip.className = "bm-meta-chip";
                tgChip.textContent = "#" + b.tags[ti];
                metaRow.appendChild(tgChip);
              }
            }
            info.appendChild(metaRow);
          }

          var editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "bm-edit";
          editBtn.textContent = "✎";
          editBtn.title = "Sửa thư mục, tags, keyword";
          editBtn.onclick = function (ev) {
            ev.stopPropagation();
            openEditBookmarkModal(idx);
          };

          var del = document.createElement("button");
          del.type = "button";
          del.className = "bm-del";
          del.textContent = "×";
          del.title = "Xóa trang ghim";
          del.onclick = function (ev) {
            ev.stopPropagation();
            removeBookmark(idx);
          };

          item.appendChild(iconBox);
          item.appendChild(info);
          item.appendChild(editBtn);
          item.appendChild(del);
          grid.appendChild(item);
        })(i, currentBookmarks[i]);
      }
    }
    renderBookmarks();

    function handleOmnibox(e) {
      e.preventDefault();
      var v = document.getElementById("nt_input").value.trim();
      if (!v) return;
      if (v.toLowerCase().startsWith("@ai ")) {
        sendCmd({ cmd: "open_chat_channel", channel: "ai" });
        sendCmd({ cmd: "run_ai_prompt", prompt: v.slice(4).trim() });
      } else {
        sendCmd({ cmd: "navigate_active", url: v });
      }
    }

    function openAddBookmarkModal() {
      editingBookmarkIndex = -1;
      document.getElementById("bm_modal_title").textContent = "+ Thêm Trang Ghim Nhanh";
      document.getElementById("bm_title_inp").value = "";
      document.getElementById("bm_url_inp").value = "";
      document.getElementById("bm_folder_inp").value = activeBookmarkFolder !== "__all__" ? activeBookmarkFolder : "";
      document.getElementById("bm_tags_inp").value = "";
      document.getElementById("bm_keyword_inp").value = "";
      document.getElementById("bm_modal").classList.add("open");
      setTimeout(function () { document.getElementById("bm_title_inp").focus(); }, 20);
    }
    function openEditBookmarkModal(idx) {
      var bm = currentBookmarks[idx];
      if (!bm) return;
      editingBookmarkIndex = idx;
      document.getElementById("bm_modal_title").textContent = "✎ Sửa Bookmark";
      document.getElementById("bm_title_inp").value = bm.title || "";
      document.getElementById("bm_url_inp").value = bm.url || "";
      document.getElementById("bm_folder_inp").value = bm.folder || "";
      document.getElementById("bm_tags_inp").value = Array.isArray(bm.tags) ? bm.tags.join(", ") : "";
      document.getElementById("bm_keyword_inp").value = bm.keyword || "";
      document.getElementById("bm_modal").classList.add("open");
      setTimeout(function () { document.getElementById("bm_title_inp").focus(); }, 20);
    }
    function closeAddBookmarkModal() {
      editingBookmarkIndex = -1;
      document.getElementById("bm_modal").classList.remove("open");
    }

    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") {
        var modal = document.getElementById("bm_modal");
        if (modal && modal.classList.contains("open")) {
          ev.preventDefault();
          closeAddBookmarkModal();
        }
      }
    });

    function saveNewBookmark() {
      var t = document.getElementById("bm_title_inp").value.trim();
      var u = document.getElementById("bm_url_inp").value.trim();
      var f = document.getElementById("bm_folder_inp").value.trim();
      var rawTags = document.getElementById("bm_tags_inp").value.trim();
      var kw = document.getElementById("bm_keyword_inp").value.trim().replace(/\s+/g, "").toLowerCase();
      var tags = rawTags ? rawTags.split(",").map(function (s) { return s.trim().replace(/^#+/, ""); }).filter(Boolean) : [];
      if (!t || !u) return;
      if (!u.startsWith("http://") && !u.startsWith("https://")) u = "https://" + u;
      var entry = { title: t, url: u, folder: f, tags: tags, keyword: kw };
      if (editingBookmarkIndex >= 0 && currentBookmarks[editingBookmarkIndex]) {
        currentBookmarks[editingBookmarkIndex] = entry;
      } else {
        currentBookmarks.push(entry);
      }
      renderBookmarks();
      sendCmd({ cmd: "save_bookmarks", bookmarks_json: JSON.stringify(currentBookmarks) });
      closeAddBookmarkModal();
    }
    function removeBookmark(idx) {
      currentBookmarks.splice(idx, 1);
      renderBookmarks();
      sendCmd({ cmd: "save_bookmarks", bookmarks_json: JSON.stringify(currentBookmarks) });
    }

    window.__tpSyncNewTab = function (cfg) {
      if (!cfg) return;
      if (typeof updateClock === "function") updateClock();
      if (cfg.logo_style) {
        currentLogoStyle = cfg.logo_style === "arrow" ? "arrow" : "ribbon";
      }
      if (cfg.ui_theme) {
        setThemeMode(cfg.ui_theme, true);
      } else {
        syncNewTabBrand();
      }
      if (typeof cfg.floating_omnibox === "boolean") {
        var block = document.querySelector(".omnibox-block");
        if (block) block.style.display = cfg.floating_omnibox ? "block" : "none";
      }
      if (Array.isArray(cfg.bookmarks)) {
        currentBookmarks = cfg.bookmarks;
        renderBookmarks();
      }
    };

    window.addEventListener("tp_config_changed", function (ev) {
      if (ev && ev.detail) {
        window.__tpSyncNewTab(ev.detail);
      }
    });

    if (typeof updateClock === "function") updateClock();
    syncNewTabBrand();
    sendCmd({ cmd: "ui_shell_ready", shell: "newtab" });
  </script>
</body>
</html>
