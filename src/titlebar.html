<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>TPbrowser Unified Top Bar</title>
<style>
/*__TP_FONT_FACE__*/
  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --font-heading: "Cormorant Garamond Gnosis", "Cormorant Garamond", Georgia, serif;
    --tb-bg: linear-gradient(180deg, #16181F 0%, #101217 100%);
    --tb-border: rgba(212, 175, 55, 0.30);
    --tb-text: #E2BE68;
    --tb-sub: #B6AC9A;
    --tb-btn-bg: rgba(255, 255, 255, 0.045);
    --tb-btn-hover: rgba(212, 175, 55, 0.16);
    --tb-btn-fg: #F5F2EB;
    --tb-omni-bg: #0A0B0E;
    --tb-omni-border: rgba(212, 175, 55, 0.36);
    --tb-accent-grad: linear-gradient(135deg, #E2BE68 0%, #B5872E 100%);
    --tb-accent-fg: #140F05;
  }

  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --tb-bg: linear-gradient(180deg, #FBF8F2 0%, #F2ECE0 100%);
    --tb-border: rgba(154, 107, 22, 0.32);
    --tb-text: #8A5E10;
    --tb-sub: #61533E;
    --tb-btn-bg: rgba(154, 107, 22, 0.08);
    --tb-btn-hover: rgba(154, 107, 22, 0.16);
    --tb-btn-fg: #18130C;
    --tb-omni-bg: #FFFFFF;
    --tb-omni-border: rgba(154, 107, 22, 0.38);
    --tb-accent-grad: linear-gradient(135deg, #C79535 0%, #9A6B16 100%);
    --tb-accent-fg: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 40px;
    overflow: hidden;
    background: var(--tb-bg);
    color: var(--tb-btn-fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    border-bottom: 1px solid var(--tb-border);
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 10px;
  }

  .tb-brand {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }
  .tb-monogram {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .tb-monogram img {
    width: 24px;
    height: 24px;
    display: block;
    object-fit: contain;
    border-radius: 50%;
  }

  .tb-nav-group {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .tb-ico-btn {
    height: 28px;
    min-width: 28px;
    padding: 0 7px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--tb-btn-fg);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    white-space: nowrap;
  }
  .tb-ico-btn:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-text);
    border-color: var(--tb-border);
  }
  .tb-ico-btn.pill {
    background: var(--tb-btn-bg);
    border-color: var(--tb-border);
    padding: 0 10px;
  }
  .tb-ico-btn.settings-btn {
    background: var(--tb-btn-bg);
    border-color: var(--tb-border);
    color: var(--tb-text);
    padding: 0 10px;
  }
  .tb-ico-btn svg {
    width: 13.5px;
    height: 13.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .tb-drag-spacer {
    flex: 1;
    min-width: 8px;
    height: 100%;
    cursor: default;
  }
  body.mode-horizontal .tb-drag-spacer {
    flex: 0 0 4px;
    min-width: 4px;
  }

  .tb-omni-form {
    flex: 0 1 285px;
    width: clamp(190px, 23vw, 285px);
    min-width: 145px;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--tb-omni-bg);
    border: 1px solid var(--tb-omni-border);
    border-radius: 999px;
    padding: 0 5px 0 9px;
    transition: border-color 0.16s ease, box-shadow 0.16s ease, width 0.16s ease;
  }
  body.mode-horizontal .tb-omni-form {
    flex: 0 1 230px;
    width: clamp(150px, 19vw, 230px);
  }
  .tb-horiz-tabs {
    display: none;
    flex: 1;
    min-width: 0;
    height: 100%;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tb-horiz-tabs::-webkit-scrollbar { display: none; }
  body.mode-horizontal .tb-horiz-tabs {
    display: flex;
  }
  .tb-tab-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 27px;
    padding: 0 8px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--tb-sub);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    min-width: 80px;
    max-width: 165px;
    flex-shrink: 0;
    transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
  }
  .tb-tab-item:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-btn-fg);
  }
  .tb-tab-item.active {
    background: var(--tb-omni-bg);
    color: var(--tb-btn-fg);
    border-color: var(--tb-border);
    font-weight: 600;
  }
  .tb-tab-fav {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .tb-tab-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--tb-text);
    flex-shrink: 0;
  }
  .tb-tab-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tb-worker-badge {
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
  .tb-worker-badge.bot {
    background: rgba(245, 158, 11, 0.2);
    color: #F59E0B;
    border: 1px solid rgba(245, 158, 11, 0.45);
  }
  .tb-worker-badge.ai {
    background: rgba(16, 185, 129, 0.18);
    color: #10B981;
    border: 1px solid rgba(16, 185, 129, 0.45);
  }
  .tb-tab-close {
    border: none;
    background: transparent;
    color: var(--tb-sub);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .tb-tab-item.active .tb-tab-close,
  .tb-tab-item:hover .tb-tab-close {
    opacity: 0.75;
  }
  .tb-tab-close:hover {
    opacity: 1 !important;
    color: #ef4444;
  }
  .tb-omni-form:focus-within {
    border-color: var(--tb-text);
    box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.22);
  }
  .omni-sec {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--tb-text);
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }
  .omni-sec svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
  }
  #tb_url_input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--tb-btn-fg);
    font-size: 12px;
    outline: none;
    user-select: text;
  }
  #tb_url_input::placeholder {
    color: var(--tb-sub);
  }
  .omni-mini-btn {
    height: 21px;
    padding: 0 7px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--tb-sub);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .omni-mini-btn:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-text);
  }
  .omni-mini-btn.bookmarked {
    color: #F59E0B;
  }
  .omni-mini-btn svg {
    width: 12.5px;
    height: 12.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
  }

  .tb-right-tools {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
    height: 100%;
    flex-shrink: 0;
  }

  .zoom-pill {
    display: inline-flex;
    align-items: center;
    height: 26px;
    border-radius: 999px;
    border: 1px solid var(--tb-border);
    background: var(--tb-btn-bg);
    overflow: hidden;
  }
  .zoom-pill button {
    border: none;
    background: transparent;
    color: var(--tb-btn-fg);
    height: 100%;
    padding: 0 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .zoom-pill button:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-text);
  }

  .tb-win-controls {
    display: flex;
    align-items: center;
    height: 100%;
    margin-left: 4px;
    border-left: 1px solid var(--tb-border);
    flex-shrink: 0;
  }
  .tb-win-btn {
    height: 100%;
    min-width: 38px;
    border: none;
    background: transparent;
    color: var(--tb-btn-fg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .tb-win-btn svg {
    width: 11.5px;
    height: 11.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
  }
  .tb-win-btn:hover {
    background: var(--tb-btn-hover);
    color: var(--tb-text);
  }
  .tb-win-btn.close-btn:hover {
    background: #dc2626;
    color: #ffffff;
  }
  @media (max-width: 1040px) {
    .hide-compact { display: none; }
  }
</style>
</head>
<body>
  <div class="tb-brand">
    <div class="tb-monogram tb-no-drag" onclick="sendRust({cmd:'open_settings_modal', section:'look_feel'})" title="TPbrowser — Cài Đặt (Alt+,)">
      <img id="tb_brand_icon" alt="TPbrowser" />
    </div>
  </div>

  <div class="tb-nav-group tb-no-drag">
    <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'nav_back'})" title="Quay lại (Alt+←)">
      <svg viewBox="0 0 16 16"><path d="M10 3.5L5.5 8 10 12.5"/></svg>
    </button>
    <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'nav_forward'})" title="Đi tới (Alt+→)">
      <svg viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
    </button>
    <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'reload'})" title="Tải lại trang (Ctrl+R / F5)">
      <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.3-3.3M13 2.8v2.5h-2.5"/></svg>
    </button>
    <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'go_home'})" title="Trang chủ (Alt+Home)">
      <svg viewBox="0 0 16 16"><path d="M2.5 7.5L8 2.8l5.5 4.7v5.7H9.8V9.6H6.2v3.6H2.5z"/></svg>
    </button>
  </div>

  <form class="tb-omni-form tb-no-drag" onsubmit="submitUrl(event)">
    <span class="omni-sec" id="tb_sec_ico" title="Trạng thái kết nối">
      <svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
    </span>
    <input id="tb_url_input" type="text" placeholder="Tìm hoặc nhập URL..." autocomplete="off" spellcheck="false" title="Địa chỉ web hoặc gõ @ai giao việc (Ctrl+L / Alt+D)" />
    <button type="button" class="omni-mini-btn" id="btn_copy_url" onclick="copyCurrentUrl()" title="Sao chép đường dẫn URL hiện tại">
      <svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="7.5" height="8" rx="1.3"/><path d="M10.5 5.5V3.8a1.3 1.3 0 0 0-1.3-1.3H3.8a1.3 1.3 0 0 0-1.3 1.3v6.4a1.3 1.3 0 0 0 1.3 1.3h1.7"/></svg>
    </button>
    <button type="button" class="omni-mini-btn" id="btn_bookmark" onclick="sendRust({cmd:'bookmark_active'})" title="Ghim trang này (Ctrl+D)">
      <svg viewBox="0 0 16 16"><path d="M8 2.2l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z"/></svg>
    </button>
  </form>

  <div id="tb_horiz_tabs" class="tb-horiz-tabs"></div>

  <div class="tb-drag-spacer" title="Kéo để di chuyển cửa sổ"></div>

  <div class="tb-right-tools tb-no-drag">
    <button type="button" class="tb-ico-btn pill" id="btn_workspace" onclick="sendRust({cmd:'open_workspace'})" title="Không gian làm việc Shopee &amp; TikTok (Alt+W)">
      <svg viewBox="0 0 16 16"><rect x="2.2" y="2.5" width="5" height="5" rx="1"/><rect x="8.8" y="2.5" width="5" height="5" rx="1"/><rect x="2.2" y="8.5" width="5" height="5" rx="1"/><path d="M9.2 13V9.5M11.3 13V8.8M13.4 13v-2.4"/></svg>
    </button>
    <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'new_tab', url:'tp://newtab', isolated:false})" title="Mở Tab mới (Ctrl+T)">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'reopen_closed_tab'})" title="Mở lại Tab vừa đóng (Ctrl+Shift+T)">
      <svg viewBox="0 0 16 16"><path d="M3.5 6.5H7V3M3.7 6.5A5 5 0 1 1 4.2 11.5"/></svg>
    </button>
    <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'toggle_tab_orientation'})" title="Đổi Tab Dọc / Tab Ngang (Alt+T)">
      <svg viewBox="0 0 16 16"><rect x="2.2" y="2.5" width="11.6" height="11" rx="1.6"/><path d="M6.2 2.5v11"/></svg>
    </button>
    <div style="position:relative;">
      <button type="button" class="tb-ico-btn" id="btn_split_mode" onclick="toggleSplitPopover(event)" title="Chia khung Zen Browser (Alt+M)">
        <svg viewBox="0 0 16 16"><rect x="2.2" y="2.5" width="5" height="11" rx="1"/><rect x="8.8" y="2.5" width="5" height="5" rx="1"/><rect x="8.8" y="8.5" width="5" height="5" rx="1"/></svg>
      </button>

      <!-- MENU ZEN SPLIT POPOVER -->
      <div id="zen_split_popover" class="tb-no-drag" style="display:none; position:absolute; top:38px; right:0; width:280px; background:var(--tb-bg); border:1.5px solid var(--tb-gold-line); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.6); padding:12px; z-index:9999; text-align:left; font-size:12px; color:var(--tb-text);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:11px; font-weight:700; color:var(--tb-gold); text-transform:uppercase; letter-spacing:0.5px;">Bố Cục Chia Khung</span>
          <button type="button" onclick="closeSplitPopover()" style="background:none; border:none; color:var(--tb-text-sub); cursor:pointer; font-size:13px; font-weight:700;">&times;</button>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:10px;">
          <button type="button" id="btn_mode_columns" onclick="selectSplitMode('columns')" style="background:var(--tb-bg-hover); border:1px solid var(--tb-gold-line); color:var(--tb-text); border-radius:6px; padding:6px 2px; font-size:11px; font-weight:600; cursor:pointer;">◫ 2 Cột</button>
          <button type="button" id="btn_mode_rows" onclick="selectSplitMode('rows')" style="background:var(--tb-bg-hover); border:1px solid var(--tb-gold-line); color:var(--tb-text); border-radius:6px; padding:6px 2px; font-size:11px; font-weight:600; cursor:pointer;">⊟ 2 Hàng</button>
          <button type="button" id="btn_mode_spiral" onclick="selectSplitMode('spiral')" style="background:var(--tb-bg-hover); border:1px solid var(--tb-gold-line); color:var(--tb-text); border-radius:6px; padding:6px 2px; font-size:11px; font-weight:600; cursor:pointer;">🌀 Xoắn Ốc</button>
        </div>
        <button type="button" id="btn_unsplit" onclick="sendRust({cmd:'unsplit'}); closeSplitPopover();" style="display:none; width:100%; background:rgba(239, 68, 68, 0.12); border:1px solid rgba(239, 68, 68, 0.35); color:#f87171; border-radius:6px; padding:5px 0; font-size:11px; font-weight:700; cursor:pointer; margin-bottom:10px;">◻ Hủy Chia (Về 1 Tab Toàn Màn Hình)</button>

        <div style="font-size:11px; font-weight:700; color:var(--tb-gold); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Chọn Tab Ghép Đôi Cùng Tab Này</div>
        <div id="split_tab_picker_list" style="display:flex; flex-direction:column; gap:4px; max-height:130px; overflow-y:auto; padding-right:2px;"></div>
      </div>
    </div>
    <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'toggle_find_bar'})" title="Tìm chữ trong trang (Ctrl+F / F3)">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L13.5 13.5"/></svg>
    </button>
    <button type="button" class="tb-ico-btn" onclick="sendRust({cmd:'open_history'})" title="Lịch sử duyệt web (Ctrl+H)">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 4.8v3.5l2.3 1.4"/></svg>
    </button>
    <div class="zoom-pill hide-compact" title="Thu phóng trang (Ctrl+ / Ctrl- / Ctrl+0)">
      <button type="button" onclick="sendRust({cmd:'zoom_step', delta:-10})" title="Thu nhỏ (Ctrl+-)">-</button>
      <button type="button" id="lbl_zoom_pct" onclick="sendRust({cmd:'zoom_reset'})" title="Đặt lại 100% (Ctrl+0)">100%</button>
      <button type="button" onclick="sendRust({cmd:'zoom_step', delta:10})" title="Phóng to (Ctrl++)">+</button>
    </div>
  </div>

  <div class="tb-win-controls tb-no-drag">
    <button type="button" class="tb-win-btn" onclick="sendRust({cmd:'win_minimize'})" title="Thu nhỏ">
      <svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6"/></svg>
    </button>
    <button type="button" class="tb-win-btn" id="btn_max" onclick="sendRust({cmd:'win_toggle_maximize'})" title="Phóng to / Khôi phục">
      <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>
    </button>
    <button type="button" class="tb-win-btn close-btn" onclick="sendRust({cmd:'win_close'})" title="Đóng TPbrowser">
      <svg viewBox="0 0 12 12"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg>
    </button>
  </div>

  <script>/*__TP_MOTION_JS__*/</script>
  <script>/*__TP_BRAND_ASSETS_JS__*/</script>
  <script>
    var currentUrl = "";
    var currentTheme = document.documentElement.getAttribute("data-theme") || "obsidian-gold";
    var currentLogoStyle = "ribbon";

    function syncTitlebarBrand() {
      var img = document.getElementById("tb_brand_icon");
      if (img && window.__tpResolveBrandAsset) {
        var src = window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme);
        if (src && img.getAttribute("src") !== src) img.src = src;
      }
    }

    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    function submitUrl(e) {
      e.preventDefault();
      var inp = document.getElementById("tb_url_input");
      var val = (inp.value || "").trim();
      if (!val) return;
      if (val.toLowerCase().startsWith("@ai ")) {
        sendRust({ cmd: "run_ai_prompt", prompt: val.slice(4).trim() });
      } else {
        sendRust({ cmd: "navigate_active", url: val });
      }
      inp.blur();
    }

    function copyCurrentUrl() {
      var val = currentUrl || document.getElementById("tb_url_input").value || "tp://newtab";
      sendRust({ cmd: "copy_to_clipboard", text: val });
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).catch(function(){});
      }
      var btn = document.getElementById("btn_copy_url");
      if (btn) {
        var prev = btn.innerHTML;
        btn.textContent = "✓";
        btn.style.color = "#10B981";
        setTimeout(function(){
          btn.innerHTML = prev;
          btn.style.color = "";
        }, 1100);
      }
    }

    var lastSyncState = null;

    function toggleSplitPopover(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      var pop = document.getElementById("zen_split_popover");
      if (!pop) return;
      var isHidden = pop.style.display === "none" || !pop.style.display;
      if (isHidden) {
        renderSplitPopoverContent();
        pop.style.display = "block";
      } else {
        pop.style.display = "none";
      }
    }

    function closeSplitPopover() {
      var pop = document.getElementById("zen_split_popover");
      if (pop) pop.style.display = "none";
    }

    document.addEventListener("click", function (e) {
      var pop = document.getElementById("zen_split_popover");
      var btn = document.getElementById("btn_split_mode");
      if (!pop || pop.style.display === "none") return;
      if (e.target && (pop.contains(e.target) || (btn && btn.contains(e.target)))) return;
      pop.style.display = "none";
    });

    function selectSplitMode(mode, pairId) {
      sendRust({
        cmd: "set_split_mode",
        mode: mode,
        pair_tab_id: typeof pairId === "number" ? pairId : (lastSyncState ? lastSyncState.paired_tab_id : null)
      });
      closeSplitPopover();
    }

    function pairWithTab(targetTabId) {
      var currentMode = (lastSyncState && lastSyncState.view_mode !== "single") ? lastSyncState.view_mode : "columns";
      sendRust({
        cmd: "set_split_mode",
        mode: currentMode,
        pair_tab_id: targetTabId
      });
      closeSplitPopover();
    }

    function renderSplitPopoverContent() {
      if (!lastSyncState) return;
      var st = lastSyncState;
      var curMode = st.view_mode || "single";
      var btnCol = document.getElementById("btn_mode_columns");
      var btnRow = document.getElementById("btn_mode_rows");
      var btnSpi = document.getElementById("btn_mode_spiral");
      var btnUnsplit = document.getElementById("btn_unsplit");

      var activeBtnBorder = "1.5px solid var(--tb-gold)";
      var activeBtnBg = "rgba(212, 175, 55, 0.18)";
      var defaultBtnBorder = "1px solid var(--tb-gold-line)";
      var defaultBtnBg = "var(--tb-bg-hover)";

      if (btnCol) {
        btnCol.style.border = curMode === "columns" ? activeBtnBorder : defaultBtnBorder;
        btnCol.style.background = curMode === "columns" ? activeBtnBg : defaultBtnBg;
      }
      if (btnRow) {
        btnRow.style.border = curMode === "rows" ? activeBtnBorder : defaultBtnBorder;
        btnRow.style.background = curMode === "rows" ? activeBtnBg : defaultBtnBg;
      }
      if (btnSpi) {
        btnSpi.style.border = curMode === "spiral" ? activeBtnBorder : defaultBtnBorder;
        btnSpi.style.background = curMode === "spiral" ? activeBtnBg : defaultBtnBg;
      }
      if (btnUnsplit) {
        btnUnsplit.style.display = curMode !== "single" ? "block" : "none";
      }

      var list = document.getElementById("split_tab_picker_list");
      if (!list) return;
      list.innerHTML = "";

      var tabs = Array.isArray(st.tabs) ? st.tabs : [];
      var activeTab = tabs[st.active_idx];
      var pairedId = st.paired_tab_id || 0;

      if (tabs.length <= 1) {
        list.innerHTML = '<div style="font-size:11px; color:var(--tb-text-sub); padding:6px 0; text-align:center;">Mở thêm Tab mới (Ctrl+T) để ghép đôi chia khung tự do.</div>';
        return;
      }

      for (var i = 0; i < tabs.length; i++) {
        var t = tabs[i];
        var isThisActive = i === st.active_idx;
        var isPaired = t.id === pairedId && curMode !== "single";

        var item = document.createElement("div");
        item.style.display = "flex";
        item.style.alignItems = "center";
        item.style.justifyContent = "space-between";
        item.style.gap = "6px";
        item.style.padding = "5px 8px";
        item.style.borderRadius = "6px";
        item.style.background = isThisActive ? "rgba(212,175,55,0.12)" : (isPaired ? "rgba(16,185,129,0.12)" : "var(--tb-bg-hover)");
        item.style.border = isThisActive ? "1px solid var(--tb-gold)" : (isPaired ? "1px solid #10b981" : "1px solid transparent");
        item.style.cursor = isThisActive ? "default" : "pointer";

        var left = document.createElement("div");
        left.style.display = "flex";
        left.style.alignItems = "center";
        left.style.gap = "6px";
        left.style.overflow = "hidden";
        left.style.whiteSpace = "nowrap";
        left.style.textOverflow = "ellipsis";

        var fav = document.createElement("img");
        fav.style.width = "13px";
        fav.style.height = "13px";
        fav.style.borderRadius = "3px";
        fav.src = resolveTabFavicon(t);
        fav.onerror = function () { this.style.display = "none"; };
        left.appendChild(fav);

        var titleSpan = document.createElement("span");
        titleSpan.textContent = t.title || "Tab " + (i + 1);
        titleSpan.style.fontSize = "11.5px";
        titleSpan.style.color = isThisActive ? "var(--tb-gold)" : (isPaired ? "#34d399" : "var(--tb-text)");
        titleSpan.style.overflow = "hidden";
        titleSpan.style.textOverflow = "ellipsis";
        left.appendChild(titleSpan);

        item.appendChild(left);

        var right = document.createElement("span");
        right.style.fontSize = "10px";
        right.style.fontWeight = "700";
        if (isThisActive) {
          right.textContent = "Hiện tại";
          right.style.color = "var(--tb-gold)";
        } else if (isPaired) {
          right.textContent = "✓ Ghép đôi";
          right.style.color = "#34d399";
        } else {
          right.textContent = "+ Ghép";
          right.style.color = "var(--tb-text-sub)";
        }
        item.appendChild(right);

        if (!isThisActive) {
          (function (targetId) {
            item.onclick = function () {
              pairWithTab(targetId);
            };
          })(t.id);
        }

        list.appendChild(item);
      }
    }

    document.body.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest(".tb-no-drag, input, button, form")) return;
      if (e.detail >= 2) {
        sendRust({ cmd: "win_toggle_maximize" });
      } else {
        sendRust({ cmd: "drag_window" });
      }
    });

    if (window.Motion && typeof window.Motion.press === "function") {
      document.querySelectorAll(".tb-ico-btn, .omni-mini-btn, .tb-monogram").forEach(function (el) {
        window.Motion.press(el, function () {
          window.Motion.animate(el, { scale: 0.94 }, { type: "spring", duration: 0.14, bounce: 0 });
          return function () {
            window.Motion.animate(el, { scale: 1 }, { type: "spring", duration: 0.24, bounce: 0.18 });
          };
        });
      });
    }

    window.__tpFocusTitlebarUrl = function () {
      var inp = document.getElementById("tb_url_input");
      if (inp) {
        inp.focus();
        inp.select();
      }
    };

    function resolveTabFavicon(t) {
      if (!t) return "";
      if (t.url === "tp://newtab" || t.url === "tp://history") {
        return window.__tpResolveBrandAsset ? window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme) : "";
      }
      if (t.favicon) return t.favicon;
      try {
        if (t.url && (t.url.startsWith("http://") || t.url.startsWith("https://"))) {
          var host = new URL(t.url).hostname;
          if (host) return "https://www.google.com/s2/favicons?sz=32&domain=" + encodeURIComponent(host);
        }
      } catch (_) {}
      return "";
    }

    function escapeAttr(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function renderHorizontalTopTabs(tabs, activeIdx) {
      var box = document.getElementById("tb_horiz_tabs");
      if (!box) return;
      box.innerHTML = "";
      if (!Array.isArray(tabs)) return;
      for (var i = 0; i < tabs.length; i++) {
        (function(idx, t) {
          var item = document.createElement("div");
          item.className = "tb-tab-item tb-no-drag" + (idx === activeIdx ? " active" : "");
          item.title = t.title || t.url || "";
          item.onclick = function() { sendRust({ cmd: "focus_index", index: idx }); };

          var favUrl = resolveTabFavicon(t);
          if (favUrl) {
            var img = document.createElement("img");
            img.className = "tb-tab-fav";
            img.src = favUrl;
            img.alt = "";
            img.onerror = function() {
              var dot = document.createElement("span");
              dot.className = "tb-tab-dot";
              if (img.parentNode) img.parentNode.replaceChild(dot, img);
            };
            item.appendChild(img);
          } else {
            var dot = document.createElement("span");
            dot.className = "tb-tab-dot";
            item.appendChild(dot);
          }

          if (t.worker_kind === "bot" || t.worker_kind === "ai") {
            var wb = document.createElement("span");
            wb.className = "tb-worker-badge " + t.worker_kind;
            wb.textContent = t.worker_kind === "ai" ? "AI" : "BOT";
            item.appendChild(wb);
          }

          var span = document.createElement("span");
          span.className = "tb-tab-title";
          span.textContent = t.title || (t.url === "tp://newtab" ? "Trang Bắt Đầu" : (t.url === "tp://workspace" ? "Sàn TMĐT" : t.url));
          item.appendChild(span);

          if (tabs.length > 1) {
            var cls = document.createElement("button");
            cls.type = "button";
            cls.className = "tb-tab-close tb-no-drag";
            cls.textContent = "×";
            cls.title = "Đóng tab (Ctrl+W)";
            cls.onclick = function(ev) {
              ev.stopPropagation();
              sendRust({ cmd: "close_index", index: idx });
            };
            item.appendChild(cls);
          }
          box.appendChild(item);
        })(i, tabs[i]);
      }
    }

    window.__tpSyncTitlebar = function (st) {
      if (!st) return;
      lastSyncState = st;
      if (document.getElementById("zen_split_popover") && document.getElementById("zen_split_popover").style.display === "block") {
        renderSplitPopoverContent();
      }
      if (st.ui_theme) {
        currentTheme = st.ui_theme;
        document.documentElement.setAttribute("data-theme", st.ui_theme);
      }
      if (st.logo_style) {
        currentLogoStyle = st.logo_style;
      }
      syncTitlebarBrand();
      if (st.orientation) {
        document.body.classList.toggle("mode-horizontal", st.orientation === "horizontal");
        document.body.classList.toggle("mode-vertical", st.orientation !== "horizontal");
      }
      if (Array.isArray(st.tabs)) {
        renderHorizontalTopTabs(st.tabs, typeof st.active_idx === "number" ? st.active_idx : 0);
      }
      if (typeof st.active_url === "string") {
        currentUrl = st.active_url;
        var inp = document.getElementById("tb_url_input");
        if (inp && document.activeElement !== inp) {
          inp.value = (st.active_url === "tp://newtab" || st.active_url === "tp://history") ? "" : st.active_url;
        }
        var sec = document.getElementById("tb_sec_ico");
        if (sec) {
          sec.style.color = st.active_url.startsWith("https://") ? "#10B981" : "var(--tb-text)";
        }
      }
      if (typeof st.is_bookmarked === "boolean") {
        var bm = document.getElementById("btn_bookmark");
        if (bm) bm.classList.toggle("bookmarked", st.is_bookmarked);
      }
      if (st.view_mode) {
        var splitBtn = document.getElementById("btn_split_mode");
        if (splitBtn) {
          var modeTxt = st.view_mode === "spiral" ? "Xoắn ốc" : (st.view_mode === "columns" ? "Cột" : "1 Tab");
          splitBtn.title = "Chia khung BSP: " + modeTxt + " (Alt+M)";
        }
      }
      if (typeof st.zoom_pct === "number") {
        var zLbl = document.getElementById("lbl_zoom_pct");
        if (zLbl) zLbl.textContent = st.zoom_pct + "%";
      }
      var maxBtn = document.getElementById("btn_max");
      if (maxBtn) {
        maxBtn.innerHTML = st.maximized
          ? '<svg viewBox="0 0 12 12"><rect x="2" y="3.5" width="6.5" height="6.5" rx="1"/><path d="M4 3.5V2.5C4 2.2 4.2 2 4.5 2H9.5C9.8 2 10 2.2 10 2.5V7.5C10 7.8 9.8 8 9.5 8H8.5"/></svg>'
          : '<svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>';
      }
    };

    window.addEventListener("tp_config_changed", function (ev) {
      if (ev && ev.detail) {
        if (ev.detail.ui_theme) {
          currentTheme = ev.detail.ui_theme;
          document.documentElement.setAttribute("data-theme", currentTheme);
        }
        if (ev.detail.logo_style) {
          currentLogoStyle = ev.detail.logo_style;
        }
        syncTitlebarBrand();
      }
    });

    /*__TP_BOOTSTRAP_JS__*/
    if (window.__TP_BOOTSTRAP__ && window.__tpSyncTitlebar) {
      window.__tpSyncTitlebar(window.__TP_BOOTSTRAP__);
    } else {
      syncTitlebarBrand();
    }
    sendRust({ cmd: "ui_shell_ready", shell: "titlebar" });
  </script>
</body>
</html>
