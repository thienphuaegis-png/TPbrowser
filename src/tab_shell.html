<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>TPbrowser Tab Shell</title>
<style>
/*__TP_FONT_FACE__*/

  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --font-heading: "Cormorant Garamond Gnosis", "Cormorant Garamond", Georgia, serif;
    --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-main: #0B0C0E;
    --bg-side: #111318;
    --bg-card: #181B22;
    --bg-subtle: #222630;
    --text-primary: #F5F2EB;
    --text-secondary: #C8C0B0;
    --text-muted: #8E8779;
    --accent: #C99B3B;
    --accent-grad: linear-gradient(135deg, #E2BE68 0%, #B5872E 100%);
    --accent-fg: #140F05;
    --accent-soft: rgba(212, 175, 55, 0.16);
    --accent-text: #E2BE68;
    --border-col: rgba(212, 175, 55, 0.28);
    --shadow-card: 0 12px 36px rgba(0, 0, 0, 0.45);
    --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.3);
  }
  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --bg-main: #F6F2EA;
    --bg-side: #EFE9DC;
    --bg-card: #FFFFFF;
    --bg-subtle: #E5DCC9;
    --text-primary: #18130C;
    --text-secondary: #3D3222;
    --text-muted: #61533E;
    --accent: #9A6B16;
    --accent-grad: linear-gradient(135deg, #C79535 0%, #9A6B16 100%);
    --accent-fg: #FFFFFF;
    --accent-soft: rgba(154, 107, 22, 0.14);
    --accent-text: #8A5E10;
    --border-col: rgba(154, 107, 22, 0.32);
    --shadow-card: 0 10px 28px rgba(92, 61, 8, 0.08);
    --shadow-soft: 0 2px 8px rgba(92, 61, 8, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-side);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 12px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* ================= VERTICAL LEFT MODE ================= */
  body.mode-vertical #horizontal_root { display: none !important; }
  body.mode-vertical #vertical_root {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    border-right: 1px solid var(--border-col);
    background: var(--bg-side);
    padding: 12px 10px;
    gap: 8px;
  }

  body.mode-vertical.collapsed .hide-when-collapsed { display: none !important; }
  body.mode-vertical.collapsed .v-header { justify-content: center; padding: 4px 0; }
  body.mode-vertical.collapsed .v-tab-item { justify-content: center; padding: 8px 4px; }
  body.mode-vertical.collapsed .v-footer { align-items: center; }

  .v-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 4px 6px 4px;
  }
  .brand-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-logo {
    width: 26px;
    height: 26px;
    border-radius: 10px;
    background: var(--accent-grad, var(--accent));
    color: var(--accent-fg);
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-title {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 16.5px;
    color: var(--text-primary);
    letter-spacing: 0.4px;
  }
  .ui-ico {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .ghost-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
    white-space: nowrap;
  }
  .ghost-btn:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
    border-color: var(--border-col);
  }
  .ghost-btn:active {
    transform: scale(0.96);
  }

  /* Khối Thanh Địa Chỉ Chính + Khay Phụ Hover Reveal */
  .v-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .url-form {
    display: flex;
    align-items: center;
    border: 1px solid var(--border-col);
    background: var(--bg-card);
    border-radius: 999px;
    padding: 3px 4px 3px 12px;
    box-shadow: var(--shadow-soft);
    transition: border-color 0.15s var(--ease-ui);
  }
  .url-form:focus-within {
    border-color: var(--accent);
  }
  .url-form input {
    width: 100%;
    border: none;
    background: transparent;
    padding: 6px 2px;
    font-size: 11.5px;
    color: var(--text-primary);
    outline: none;
    user-select: text;
  }
  .url-form input::placeholder {
    color: var(--text-muted);
  }
  .ublock-mini-tag {
    font-size: 9.5px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent-text);
    padding: 2px 6px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* HOVER REVEAL: Các nút phụ (← → ↻ ⌂ ★ & Chia khung) mặc định ẩn gọn, chỉ hiện nhẹ khi rê chuột vào vùng điều khiển */
  .v-hover-drawer {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: max-height 0.2s ease, opacity 0.18s ease;
  }
  .v-controls:hover .v-hover-drawer,
  .v-controls:focus-within .v-hover-drawer {
    max-height: 74px;
    opacity: 1;
  }
  .nav-row {
    display: flex;
    gap: 4px;
  }
  .nav-row button {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 4px 0;
    font-size: 11px;
    cursor: pointer;
    transition: color 0.14s var(--ease-ui), border-color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .nav-row button:hover {
    color: var(--text-primary);
    border-color: var(--accent);
  }
  .nav-row button:active {
    transform: scale(0.96);
  }
  .mode-switch-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }
  .small-pill-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    color: var(--text-secondary);
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    transition: color 0.14s var(--ease-ui), border-color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .small-pill-btn:hover {
    color: var(--text-primary);
    border-color: var(--accent);
  }
  .small-pill-btn:active {
    transform: scale(0.96);
  }
  .small-pill-btn.on {
    background: var(--accent-soft);
    border-color: var(--border-col);
    color: var(--accent-text);
  }

  /* Danh sách Tab Dọc tinh tế */
  .v-tab-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 2px;
  }
  .v-tab-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui);
  }
  .v-tab-item:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .v-tab-item.active {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border-col);
    box-shadow: var(--shadow-soft);
  }
  .tab-fav {
    width: 15px;
    height: 15px;
    border-radius: 3px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .tab-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .v-tab-item.active .tab-dot {
    background: var(--accent);
  }
  .tab-meta {
    flex: 1;
    min-width: 0;
  }
  .tab-worker-badge {
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 999px;
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }
  .tab-worker-badge.bot {
    background: rgba(245, 158, 11, 0.18);
    color: #D97706;
    border: 1px solid rgba(245, 158, 11, 0.45);
  }
  .tab-worker-badge.ai {
    background: rgba(16, 185, 129, 0.16);
    color: #059669;
    border: 1px solid rgba(16, 185, 129, 0.45);
  }
  .tab-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .v-tab-item.active .tab-title {
    font-weight: 600;
  }
  .tab-sub {
    font-size: 10px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* HOVER REVEAL: Nút đóng Tab × chỉ hiện nhẹ khi rê chuột vào dòng Tab */
  .tab-close {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    padding: 0 3px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .v-tab-item.active .tab-close,
  .h-tab-item.active .tab-close {
    opacity: 0.65;
  }
  .v-tab-item:hover .tab-close,
  .h-tab-item:hover .tab-close {
    opacity: 1;
  }
  .tab-close:hover {
    color: #ef4444;
  }

  .v-newtab-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 2px;
  }
  .quiet-add-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 11.5px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.14s var(--ease-ui), color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .quiet-add-btn:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .quiet-add-btn:active {
    transform: scale(0.96);
  }

  .v-footer {
    padding-top: 8px;
    border-top: 1px solid var(--border-col);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .google-card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px 5px 6px;
    border-radius: 999px;
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    cursor: pointer;
    transition: border-color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .google-card:hover {
    border-color: var(--accent);
  }
  .google-card:active {
    transform: scale(0.98);
  }
  .g-Badge {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-text);
    font-weight: 700;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .g-info { flex: 1; min-width: 0; }
  .g-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .g-status {
    font-size: 9.5px;
    color: var(--text-muted);
  }
  .ai-toggle-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    color: var(--text-primary);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .ai-toggle-btn:hover {
    border-color: var(--accent);
  }
  .ai-toggle-btn:active {
    transform: scale(0.96);
  }
  .ai-toggle-btn.bubble-mode {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  /* ================= HORIZONTAL TOP MODE ================= */
  body.mode-horizontal #vertical_root { display: none !important; }
  body.mode-horizontal #horizontal_root {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    border-bottom: 1px solid var(--border-col);
    background: var(--bg-side);
  }
  .h-row-tabs {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    gap: 6px;
  }
  .h-tabs-scroll {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    height: 100%;
  }
  .h-tab-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    max-width: 210px;
    min-width: 110px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .h-tab-item:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .h-tab-item.active {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border-col);
    box-shadow: var(--shadow-soft);
  }
  .h-tab-title {
    flex: 1;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .h-right-tools {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .h-row-nav {
    height: 41px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
    background: var(--bg-main);
  }
  .h-nav-btns {
    display: flex;
    gap: 3px;
    opacity: 0.45;
    transition: opacity 0.15s ease;
  }
  .h-row-nav:hover .h-nav-btns {
    opacity: 1;
  }
  .h-url-form {
    flex: 1;
    display: flex;
    align-items: center;
    border: 1px solid var(--border-col);
    background: var(--bg-card);
    border-radius: 999px;
    padding: 3px 4px 3px 14px;
  }
  .h-url-form input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 5px 4px;
    font-size: 12px;
    color: var(--text-primary);
    outline: none;
    user-select: text;
  }
  .h-url-form button {
    background: var(--accent-grad, var(--accent));
    color: var(--accent-fg);
    border: none;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body class="mode-vertical">
  <!-- GIAO DIỆN TAB DỌC BÊN TAY TRÁI -->
  <div id="vertical_root">
    <div class="v-header">
      <div class="brand-box">
        <span class="brand-title hide-when-collapsed" style="font-size:12px; letter-spacing:0.8px; color:var(--accent-text);">TABS</span>
      </div>
      <div style="display:flex; gap:3px;">
        <button class="ghost-btn hide-when-collapsed" onclick="sendRust({cmd:'new_tab', url:'tp://newtab', isolated:false})" title="Tab mới (Ctrl+T)">
          <svg class="ui-ico" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
        </button>
        <button class="ghost-btn hide-when-collapsed" onclick="sendRust({cmd:'toggle_tab_orientation'})" title="Chuyển sang Tab Ngang (Alt+T)">
          <svg class="ui-ico" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.6"/><path d="M2 6h12"/></svg>
        </button>
        <button class="ghost-btn" id="btn_collapse_side" onclick="sendRust({cmd:'toggle_sidebar_collapse'})" title="Thu gọn / Mở rộng thanh Tab (Alt+S)">«</button>
      </div>
    </div>

    <div id="v_tab_list" class="v-tab-list"></div>

    <div class="v-footer">
      <div class="google-card" onclick="sendRust({cmd:'open_google_login'})" title="Tài khoản Google">
        <div class="g-Badge" id="v_g_avatar">G</div>
        <div class="g-info hide-when-collapsed">
          <div class="g-name" id="v_g_name">Đăng nhập Google</div>
          <div class="g-status" id="v_g_status">Bấm để kết nối</div>
        </div>
      </div>
    </div>
  </div>

  <script>/*__TP_MOTION_JS__*/</script>
  <script>/*__TP_BRAND_ASSETS_JS__*/</script>

  <script>
    var currentTheme = document.documentElement.getAttribute("data-theme") || "obsidian-gold";
    var currentLogoStyle = "ribbon";

    function resolveTabFavicon(t) {
      if (!t) return "";
      if (t.url === "tp://newtab" || t.url === "tp://history" || t.url === "tp://workspace") {
        return window.__tpResolveBrandAsset ? window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme) : "";
      }
      if (t.favicon) return t.favicon;
      try {
        if (t.url && (t.url.startsWith("http://") || t.url.startsWith("https://"))) {
          var host = new URL(t.url).hostname;
          if (host) return "https://www.google.com/s2/favicons?sz=32&domain=" + encodeURIComponent(host);
        }
      } catch (_) {}
      return "";
    }

    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    function cycleThemeQuick() {
      var next = (currentTheme === "obsidian-gold") ? "carrara-light" : "obsidian-gold";
      currentTheme = next;
      document.documentElement.setAttribute("data-theme", next);
      sendRust({ cmd: "set_ui_theme", theme: next });
    }

    function submitUrlVertical(e) {
      e.preventDefault();
      var val = document.getElementById("v_url_input").value.trim();
      if (!val) return;
      if (val.toLowerCase().startsWith("@ai ")) {
        sendRust({ cmd: "run_ai_prompt", prompt: val.slice(4).trim() });
      } else {
        sendRust({ cmd: "navigate_active", url: val });
      }
    }

    function submitUrlHorizontal(e) {
      e.preventDefault();
      var val = document.getElementById("h_url_input").value.trim();
      if (!val) return;
      if (val.toLowerCase().startsWith("@ai ")) {
        sendRust({ cmd: "run_ai_prompt", prompt: val.slice(4).trim() });
      } else {
        sendRust({ cmd: "navigate_active", url: val });
      }
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    window.__tpSyncShellState = function (state) {
      if (!state) return;
      if (state.ui_theme) {
        currentTheme = state.ui_theme;
        document.documentElement.setAttribute("data-theme", state.ui_theme);
      }
      if (state.logo_style) {
        currentLogoStyle = state.logo_style;
      }
      var body = document.body;
      if (state.orientation === "horizontal") {
        body.classList.remove("mode-vertical");
        body.classList.add("mode-horizontal");
      } else {
        body.classList.remove("mode-horizontal");
        body.classList.add("mode-vertical");
      }

      if (state.sidebar_collapsed) {
        body.classList.add("collapsed");
        document.getElementById("btn_collapse_side").textContent = "»";
      } else {
        body.classList.remove("collapsed");
        document.getElementById("btn_collapse_side").textContent = "«";
      }

      var tabs = state.tabs || [];
      var activeIdx = state.active_idx || 0;

      var gUser = state.google_user || "";
      if (gUser) {
        document.getElementById("v_g_avatar").textContent = gUser.charAt(0).toUpperCase();
        document.getElementById("v_g_name").textContent = gUser;
        document.getElementById("v_g_status").textContent = "Đã đồng bộ Google";
      } else {
        document.getElementById("v_g_avatar").textContent = "G";
        document.getElementById("v_g_name").textContent = "Đăng nhập Google";
        document.getElementById("v_g_status").textContent = "Bấm để kết nối";
      }

      var vListEl = document.getElementById("v_tab_list");
      vListEl.innerHTML = "";
      for (var i = 0; i < tabs.length; i++) {
        (function(idx, t) {
          var isAct = idx === activeIdx;
          var title = t.title || (t.url === "tp://newtab" ? "Không gian bắt đầu" : t.url);
          if (title === "Trang Bắt Đầu Trắng") title = "Không gian bắt đầu";
          var favUrl = resolveTabFavicon(t);

          var row = document.createElement("div");
          row.className = "v-tab-item " + (isAct ? "active" : "");
          row.title = title;
          row.onclick = function() { sendRust({ cmd: "focus_index", index: idx }); };

          if (favUrl) {
            var img = document.createElement("img");
            img.className = "tab-fav";
            img.src = favUrl;
            img.alt = "";
            img.onerror = function() {
              var dot = document.createElement("span");
              dot.className = "tab-dot";
              if (img.parentNode) img.parentNode.replaceChild(dot, img);
            };
            row.appendChild(img);
          } else {
            var dot = document.createElement("span");
            dot.className = "tab-dot";
            row.appendChild(dot);
          }

          var meta = document.createElement("div");
          meta.className = "tab-meta hide-when-collapsed";
          var tDiv = document.createElement("div");
          tDiv.className = "tab-title";
          tDiv.textContent = title;
          meta.appendChild(tDiv);
          row.appendChild(meta);

          if (t.worker_kind === "bot" || t.worker_kind === "ai") {
            var wb = document.createElement("span");
            wb.className = "tab-worker-badge hide-when-collapsed " + t.worker_kind;
            wb.textContent = t.worker_kind === "ai" ? "AI" : "BOT";
            row.appendChild(wb);
          }

          if (tabs.length > 1) {
            var cls = document.createElement("button");
            cls.className = "tab-close hide-when-collapsed";
            cls.textContent = "×";
            cls.title = "Đóng tab";
            cls.onclick = function(ev) {
              ev.stopPropagation();
              sendRust({ cmd: "close_index", index: idx });
            };
            row.appendChild(cls);
          }
          vListEl.appendChild(row);
        })(i, tabs[i]);
      }
    };

    /*__TP_BOOTSTRAP_JS__*/
    if (window.__TP_BOOTSTRAP__ && window.__tpSyncShellState) {
      window.__tpSyncShellState(window.__TP_BOOTSTRAP__);
    }
    sendRust({ cmd: "ui_shell_ready", shell: "tab_shell" });
  </script>
</body>
</html>
