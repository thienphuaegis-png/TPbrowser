<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>TPbrowser Glance Header</title>
<style>
/*__TP_FONT_FACE__*/
  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-bar: #14171E;
    --bg-pill-hover: rgba(226, 190, 104, 0.16);
    --gold-bright: #E2BE68;
    --text-primary: #F5F2EB;
    --text-secondary: #C8C0B0;
    --border-col: rgba(212, 175, 55, 0.30);
    --ok-fg: #34D399;
  }

  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --bg-bar: #FAF6EE;
    --bg-pill-hover: rgba(122, 81, 11, 0.12);
    --gold-bright: #7A510B;
    --text-primary: #18130C;
    --text-secondary: #4A3E2D;
    --border-col: rgba(24, 19, 12, 0.20);
    --ok-fg: #047857;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-bar);
    color: var(--text-primary);
    font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
    border-top: 1px solid var(--border-col);
    border-left: 1px solid var(--border-col);
    border-right: 1px solid var(--border-col);
    border-bottom: 1px solid var(--border-col);
    border-radius: 12px 12px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    gap: 8px;
    cursor: default;
  }

  .gl-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--gold-bright);
    min-width: 0;
    flex: 1;
  }
  .gl-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold-bright);
    flex-shrink: 0;
  }
  .gl-lbl {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .gl-actions {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .gl-sep {
    width: 1px;
    height: 14px;
    background: var(--border-col);
    margin: 0 3px;
    flex-shrink: 0;
  }
  .gl-ico-btn {
    width: 24px;
    height: 24px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.14s var(--ease-ui), color 0.14s var(--ease-ui), border-color 0.14s var(--ease-ui), transform 0.12s var(--ease-ui);
  }
  .gl-ico-btn:hover {
    background: var(--bg-pill-hover);
    color: var(--gold-bright);
    border-color: var(--border-col);
  }
  .gl-ico-btn:active { transform: scale(0.92); }
  .gl-ico-btn.copied { color: var(--ok-fg); }
  .gl-ico-btn svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .gl-esc-hint {
    font-size: 10px;
    color: var(--text-secondary);
    opacity: 0.7;
    white-space: nowrap;
    margin-right: 4px;
  }
</style>
</head>
<body onmousedown="event.stopPropagation();">
  <div class="gl-title">
    <span class="gl-dot"></span>
    <span class="gl-lbl" id="gl_title_lbl">Xem Nhanh</span>
  </div>

  <div class="gl-actions">
    <span class="gl-esc-hint">ESC để đóng</span>
    <button type="button" class="gl-ico-btn" onclick="sendRust({cmd:'glance_nav_back'})" title="Quay lại">
      <svg viewBox="0 0 16 16"><path d="M10 3.5L5.5 8 10 12.5"/></svg>
    </button>
    <button type="button" class="gl-ico-btn" onclick="sendRust({cmd:'glance_nav_forward'})" title="Tiến tới">
      <svg viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
    </button>
    <button type="button" class="gl-ico-btn" onclick="sendRust({cmd:'glance_reload'})" title="Tải lại trang">
      <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.3-3.3M13 2.8v2.5h-2.5"/></svg>
    </button>
    <span class="gl-sep"></span>
    <button type="button" class="gl-ico-btn" id="btn_gl_copy" onclick="copyGlanceUrl()" title="Sao chép URL">
      <svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="7.5" height="8" rx="1.3"/><path d="M10.5 5.5V3.8a1.3 1.3 0 0 0-1.3-1.3H3.8a1.3 1.3 0 0 0-1.3 1.3v6.4a1.3 1.3 0 0 0 1.3 1.3h1.7"/></svg>
    </button>
    <button type="button" class="gl-ico-btn" onclick="sendRust({cmd:'glance_open_in_split'})" title="Mở trong Split View">
      <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.6"/><path d="M8 2.5v11"/></svg>
    </button>
    <button type="button" class="gl-ico-btn" onclick="sendRust({cmd:'glance_open_in_tab'})" title="Mở ra Tab lớn">
      <svg viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5L7.5 8.5"/><path d="M12.5 9.5v3a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3"/></svg>
    </button>
    <button type="button" class="gl-ico-btn" onclick="sendRust({cmd:'close_glance'})" title="Đóng (ESC)">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>

  <script>
    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    function copyGlanceUrl() {
      sendRust({ cmd: "glance_copy_url" });
      var btn = document.getElementById("btn_gl_copy");
      if (!btn) return;
      btn.classList.add("copied");
      setTimeout(function () { btn.classList.remove("copied"); }, 1100);
    }

    window.__tpSyncGlanceHeader = function (st) {
      if (!st) return;
      if (st.ui_theme) {
        document.documentElement.setAttribute("data-theme", st.ui_theme);
      }
      var lbl = document.getElementById("gl_title_lbl");
      if (lbl && typeof st.title === "string") {
        lbl.textContent = st.title || "Xem Nhanh";
        lbl.title = st.url || st.title || "";
      }
    };

    window.addEventListener("tp_config_changed", function (ev) {
      if (ev && ev.detail) {
        window.__tpSyncGlanceHeader(ev.detail);
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        sendRust({ cmd: "close_glance" });
      }
    });

    sendRust({ cmd: "ui_shell_ready", shell: "glance_header" });
  </script>
</body>
</html>
