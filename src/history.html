<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>Lịch sử duyệt web — TPbrowser</title>
<link id="tp_favicon" rel="icon" type="image/png" href="" />
<style>
/*__TP_FONT_FACE__*/
  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --font-heading: "Cormorant Garamond Gnosis", "Cormorant Garamond", Georgia, serif;
    --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-main: #0A0B0E;
    --bg-glass: rgba(20, 23, 30, 0.80);
    --bg-card: rgba(22, 25, 33, 0.88);
    --bg-card-hover: rgba(32, 37, 48, 0.98);
    --bg-input: rgba(15, 17, 23, 0.92);
    --text-main: #F5F2EB;
    --text-sub: #C8C0B0;
    --text-muted: #8E8779;
    --gold: #E2BE68;
    --gold-soft: rgba(212, 175, 55, 0.14);
    --gold-line: rgba(212, 175, 55, 0.22);
    --gold-line-strong: rgba(226, 190, 104, 0.58);
    --cta-bg: linear-gradient(135deg, #E2BE68 0%, #B5872E 100%);
    --cta-fg: #140F05;
    --danger-bg: rgba(239, 68, 68, 0.16);
    --danger-fg: #FCA5A5;
    --danger-bd: rgba(239, 68, 68, 0.45);
    --shadow-soft: 0 10px 28px rgba(0, 0, 0, 0.36);
  }

  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --bg-main: #F6F2EA;
    --bg-glass: rgba(255, 255, 255, 0.82);
    --bg-card: rgba(255, 255, 255, 0.94);
    --bg-card-hover: #FFFFFF;
    --bg-input: #FFFFFF;
    --text-main: #18130C;
    --text-sub: #3A2F20;
    --text-muted: #665744;
    --gold: #7A510B;
    --gold-soft: rgba(122, 81, 11, 0.10);
    --gold-line: rgba(24, 19, 12, 0.14);
    --gold-line-strong: rgba(122, 81, 11, 0.46);
    --cta-bg: linear-gradient(135deg, #A8741A 0%, #7A510B 100%);
    --cta-fg: #FFFFFF;
    --danger-bg: #FEF2F2;
    --danger-fg: #B91C1C;
    --danger-bd: #FECACA;
    --shadow-soft: 0 8px 22px rgba(48, 34, 12, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: var(--bg-main);
    color: var(--text-main);
    font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 24px 96px;
    transition: background-color 0.22s ease, color 0.22s ease;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Header */
  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--gold-line);
  }
  .head-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .head-brand img {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .head h1 {
    font-family: var(--font-heading);
    font-size: 30px;
    line-height: 1.1;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.3px;
  }
  .head p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .ui-ico {
    width: 13.5px;
    height: 13.5px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .btn {
    height: 34px;
    border: 1px solid var(--gold-line);
    background: var(--bg-card);
    color: var(--text-main);
    border-radius: 999px;
    padding: 0 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s var(--ease-ui), background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .btn:hover { border-color: var(--gold-line-strong); color: var(--gold); }
  .btn:active { transform: scale(0.96); }
  .btn.primary {
    background: var(--cta-bg);
    color: var(--cta-fg);
    border-color: transparent;
    font-weight: 700;
  }
  .btn.primary:hover { color: var(--cta-fg); opacity: 0.93; }
  .btn.danger-confirm {
    background: var(--danger-bg);
    color: var(--danger-fg);
    border-color: var(--danger-bd);
  }

  /* Thanh tìm kiếm + Filter pills */
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-input);
    border: 1.5px solid var(--gold-line);
    border-radius: 999px;
    padding: 0 16px;
    height: 44px;
    box-shadow: var(--shadow-soft);
    transition: border-color 0.16s var(--ease-ui), box-shadow 0.16s var(--ease-ui);
  }
  .search-wrap:focus-within {
    border-color: var(--gold-line-strong);
    box-shadow: 0 0 0 3px var(--gold-soft), var(--shadow-soft);
  }
  .search-wrap .ui-ico { color: var(--text-muted); }
  .search-box {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text-main);
    font-size: 13.5px;
    outline: none;
    user-select: text;
  }
  .search-box::placeholder { color: var(--text-muted); }
  .search-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .filter-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .f-pill {
    border: 1px solid var(--gold-line);
    background: var(--bg-card);
    color: var(--text-sub);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s var(--ease-ui);
  }
  .f-pill:hover { border-color: var(--gold-line-strong); color: var(--gold); }
  .f-pill.active {
    background: var(--cta-bg);
    color: var(--cta-fg);
    border-color: transparent;
    font-weight: 700;
  }
  .hint-inline {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* Section & Group */
  .group-card {
    background: var(--bg-glass);
    border: 1px solid var(--gold-line);
    border-radius: 16px;
    padding: 14px 16px 16px;
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .group-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--gold-line);
  }
  .sec-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-heading);
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold);
  }
  .sec-title .mini-diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
  }
  .sec-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 11px;
    background: var(--bg-card);
    border: 1px solid transparent;
    border-radius: 11px;
    padding: 8px 11px;
    cursor: pointer;
    transition: border-color 0.14s var(--ease-ui), background-color 0.14s var(--ease-ui), transform 0.14s var(--ease-ui);
  }
  .row:hover {
    background: var(--bg-card-hover);
    border-color: var(--gold-line-strong);
    transform: translateX(2px);
  }

  .fav-box {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--gold-soft);
    border: 1px solid var(--gold-line);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .fav-box img {
    width: 16px;
    height: 16px;
    object-fit: contain;
    display: block;
  }
  .fav-fallback {
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
  }

  .row-main { min-width: 0; flex: 1; }
  .row-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-url {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .row-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .row-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.14s ease;
  }
  .row:hover .row-actions { opacity: 1; }
  .mini-act {
    width: 26px;
    height: 26px;
    border-radius: 999px;
    border: 1px solid var(--gold-line);
    background: var(--bg-input);
    color: var(--text-sub);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.14s ease, color 0.14s ease;
  }
  .mini-act:hover { border-color: var(--gold-line-strong); color: var(--gold); }

  .row-time {
    font-family: Consolas, "SFMono-Regular", monospace;
    font-size: 11px;
    color: var(--text-muted);
    min-width: 46px;
    text-align: right;
  }
  .empty {
    padding: 20px 14px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12.5px;
    border: 1px dashed var(--gold-line);
    border-radius: 11px;
  }

  @media (max-width: 640px) {
    body { padding: 16px 12px 64px; }
    .hint-inline { display: none; }
    .row-actions { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="head-brand">
        <img id="hist_brand_icon" alt="TPbrowser" />
        <div>
          <h1>Lịch Sử Duyệt Web</h1>
          <p>Quản lý trang đã truy cập &amp; tab vừa đóng trong TPbrowser</p>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" onclick="sendRust({cmd:'reopen_closed_tab'})" title="Khôi phục tab vừa đóng (Ctrl+Shift+T)">
          <svg class="ui-ico" viewBox="0 0 16 16"><path d="M3.5 6.5H7V3M3.7 6.5A5 5 0 1 1 4.2 11.5"/></svg>
          <span>Mở lại Tab vừa đóng</span>
        </button>
        <button type="button" class="btn" id="btn_clear_hist" onclick="handleClearHistory()">
          <svg class="ui-ico" viewBox="0 0 16 16"><path d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>
          <span id="lbl_clear_hist">Xóa lịch sử</span>
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="ui-ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L13.8 13.8"/></svg>
        <input id="q" class="search-box" type="text" placeholder="Tìm theo tên trang hoặc địa chỉ URL (nhấn / để focus)..." oninput="render()" />
        <span class="search-count" id="search_count">0 mục</span>
      </div>
      <div class="filter-bar">
        <div class="filter-pills">
          <button type="button" class="f-pill active" data-filter="all" onclick="setFilter('all', this)">Tất cả</button>
          <button type="button" class="f-pill" data-filter="today" onclick="setFilter('today', this)">Hôm nay</button>
          <button type="button" class="f-pill" data-filter="week" onclick="setFilter('week', this)">7 ngày qua</button>
          <button type="button" class="f-pill" data-filter="closed" onclick="setFilter('closed', this)">Tab vừa đóng</button>
        </div>
        <span class="hint-inline">Click: mở ngay • Ctrl+Click: Tab mới • Alt+Click: Glance</span>
      </div>
    </div>

    <section class="group-card" id="closed_section">
      <div class="group-head">
        <div class="sec-title"><span class="mini-diamond"></span><span>Tab vừa đóng gần đây</span></div>
        <span class="sec-count" id="closed_count">0 tab</span>
      </div>
      <div id="closed_list" class="list"></div>
    </section>

    <div id="hist_groups" style="display:flex; flex-direction:column; gap:14px;"></div>
  </div>

  <script>/*__TP_MOTION_JS__*/</script>
  <script>/*__TP_BRAND_ASSETS_JS__*/</script>
  <script>
    var historyItems = [];
    var closedItems = [];
    var activeFilter = "all";
    var currentLogoStyle = "ribbon";
    var currentTheme = document.documentElement.getAttribute("data-theme") || "obsidian-gold";
    var confirmClearTimer = null;
    var confirmingClear = false;

    if (window.location.search.indexOf("theme=light") !== -1) {
      currentTheme = "carrara-light";
      document.documentElement.setAttribute("data-theme", "carrara-light");
    }

    function syncHistoryBrand() {
      if (window.__tpResolveBrandAsset) {
        var src = window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme);
        if (window.__tpSetFavicon && src) window.__tpSetFavicon(src);
        var img = document.getElementById("hist_brand_icon");
        if (img && src && img.getAttribute("src") !== src) img.src = src;
      }
    }

    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    function hostOf(url) {
      try {
        return new URL(url).hostname.replace(/^www\./i, "");
      } catch (_) {
        return String(url || "").replace(/^https?:\/\//i, "").split("/")[0];
      }
    }

    function faviconUrlFor(url) {
      var host = hostOf(url);
      if (!host) return "";
      return "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(host);
    }

    function fmtClock(ts) {
      if (!ts) return "";
      try {
        var d = new Date(ts * 1000);
        return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
      } catch (_) { return ""; }
    }

    function fmtDateShort(ts) {
      if (!ts) return "";
      try {
        var d = new Date(ts * 1000);
        return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + " · " +
          d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" });
      } catch (_) { return ""; }
    }

    function dayBucket(ts) {
      if (!ts) return "older";
      var now = new Date();
      var startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;
      var startYesterday = startToday - 86400;
      var startWeek = startToday - 86400 * 6;
      if (ts >= startToday) return "today";
      if (ts >= startYesterday) return "yesterday";
      if (ts >= startWeek) return "week";
      return "older";
    }

    function setFilter(mode, btn) {
      activeFilter = mode;
      var pills = document.querySelectorAll(".f-pill");
      for (var i = 0; i < pills.length; i++) {
        pills[i].classList.toggle("active", pills[i] === btn);
      }
      render();
    }

    function handleClearHistory() {
      var btn = document.getElementById("btn_clear_hist");
      var lbl = document.getElementById("lbl_clear_hist");
      if (!confirmingClear) {
        confirmingClear = true;
        if (btn) btn.classList.add("danger-confirm");
        if (lbl) lbl.textContent = "Bấm lại để xác nhận xóa";
        clearTimeout(confirmClearTimer);
        confirmClearTimer = setTimeout(function () {
          confirmingClear = false;
          if (btn) btn.classList.remove("danger-confirm");
          if (lbl) lbl.textContent = "Xóa lịch sử";
        }, 3200);
        return;
      }
      confirmingClear = false;
      clearTimeout(confirmClearTimer);
      if (btn) btn.classList.remove("danger-confirm");
      if (lbl) lbl.textContent = "Xóa lịch sử";
      historyItems = [];
      render();
      sendRust({ cmd: "clear_history" });
    }

    function openEntry(url, title, openInNewTabDefault, ev) {
      if (ev && ev.altKey && !ev.ctrlKey && !ev.metaKey) {
        sendRust({ cmd: "open_glance", url: url, title: title || url });
        return;
      }
      if (openInNewTabDefault || (ev && (ev.ctrlKey || ev.metaKey || ev.button === 1))) {
        sendRust({ cmd: "new_tab", url: url, isolated: false });
        return;
      }
      sendRust({ cmd: "navigate_active", url: url });
    }

    function createRowEl(title, url, timeLabel, openNewDefault) {
      var row = document.createElement("div");
      row.className = "row";
      row.title = (title || url) + "\n" + url;
      row.onclick = function (ev) { openEntry(url, title, openNewDefault, ev); };
      row.onauxclick = function (ev) {
        if (ev.button === 1) {
          ev.preventDefault();
          openEntry(url, title, true, ev);
        }
      };

      var favBox = document.createElement("div");
      favBox.className = "fav-box";
      var fb = document.createElement("span");
      fb.className = "fav-fallback";
      fb.textContent = ((title || hostOf(url) || "•").trim().charAt(0) || "•").toUpperCase();
      var favSrc = faviconUrlFor(url);
      if (favSrc) {
        var img = document.createElement("img");
        img.src = favSrc;
        img.alt = "";
        img.onerror = function () {
          if (img.parentNode) img.parentNode.replaceChild(fb, img);
        };
        favBox.appendChild(img);
      } else {
        favBox.appendChild(fb);
      }

      var main = document.createElement("div");
      main.className = "row-main";
      var tEl = document.createElement("div");
      tEl.className = "row-title";
      tEl.textContent = title || hostOf(url) || url;
      var uEl = document.createElement("div");
      uEl.className = "row-url";
      uEl.textContent = url;
      main.appendChild(tEl);
      main.appendChild(uEl);

      var right = document.createElement("div");
      right.className = "row-right";

      var acts = document.createElement("div");
      acts.className = "row-actions";
      var splitBtn = document.createElement("button");
      splitBtn.type = "button";
      splitBtn.className = "mini-act";
      splitBtn.textContent = "◫";
      splitBtn.title = "Mở vào Split View";
      splitBtn.onclick = function (ev) {
        ev.stopPropagation();
        sendRust({ cmd: "open_in_split", url: url });
      };
      var tabBtn = document.createElement("button");
      tabBtn.type = "button";
      tabBtn.className = "mini-act";
      tabBtn.textContent = "+";
      tabBtn.title = "Mở trong Tab mới";
      tabBtn.onclick = function (ev) {
        ev.stopPropagation();
        sendRust({ cmd: "new_tab", url: url, isolated: false });
      };
      acts.appendChild(splitBtn);
      acts.appendChild(tabBtn);

      var timeEl = document.createElement("span");
      timeEl.className = "row-time";
      timeEl.textContent = timeLabel || "";

      right.appendChild(acts);
      right.appendChild(timeEl);

      row.appendChild(favBox);
      row.appendChild(main);
      row.appendChild(right);
      return row;
    }

    function render() {
      var kw = (document.getElementById("q").value || "").toLowerCase().trim();
      var closedSection = document.getElementById("closed_section");
      var closedList = document.getElementById("closed_list");
      var closedCount = document.getElementById("closed_count");
      var histGroups = document.getElementById("hist_groups");
      var searchCount = document.getElementById("search_count");

      var cFiltered = closedItems.filter(function (u) {
        return !kw || String(u).toLowerCase().indexOf(kw) !== -1;
      });
      var showClosed = activeFilter === "all" || activeFilter === "closed";
      closedSection.style.display = showClosed ? "flex" : "none";
      closedCount.textContent = cFiltered.length + " tab";
      closedList.textContent = "";
      if (!cFiltered.length) {
        var cEmpty = document.createElement("div");
        cEmpty.className = "empty";
        cEmpty.textContent = "Chưa có tab nào mới đóng trong phiên này.";
        closedList.appendChild(cEmpty);
      } else {
        cFiltered.slice().reverse().forEach(function (u) {
          closedList.appendChild(createRowEl(hostOf(u) || u, u, "↺ Mở lại", true));
        });
      }

      histGroups.textContent = "";
      if (activeFilter === "closed") {
        searchCount.textContent = cFiltered.length + " mục";
        return;
      }

      var hFiltered = historyItems.filter(function (it) {
        if (!it || !it.url) return false;
        var b = dayBucket(it.ts);
        if (activeFilter === "today" && b !== "today") return false;
        if (activeFilter === "week" && b === "older") return false;
        if (!kw) return true;
        return String(it.title || "").toLowerCase().indexOf(kw) !== -1 ||
          String(it.url || "").toLowerCase().indexOf(kw) !== -1;
      });

      searchCount.textContent = (hFiltered.length + (showClosed ? cFiltered.length : 0)) + " mục";

      if (!hFiltered.length) {
        var card = document.createElement("section");
        card.className = "group-card";
        var emp = document.createElement("div");
        emp.className = "empty";
        emp.textContent = kw ? "Không có mục lịch sử nào khớp từ khóa." : "Chưa có lịch sử duyệt web nào.";
        card.appendChild(emp);
        histGroups.appendChild(card);
        return;
      }

      var buckets = { today: [], yesterday: [], week: [], older: [] };
      var meta = [
        { key: "today", label: "Hôm nay", clockOnly: true },
        { key: "yesterday", label: "Hôm qua", clockOnly: true },
        { key: "week", label: "7 ngày qua", clockOnly: false },
        { key: "older", label: "Trước đó", clockOnly: false }
      ];

      hFiltered.slice().reverse().forEach(function (it) {
        buckets[dayBucket(it.ts)].push(it);
      });

      meta.forEach(function (g) {
        var arr = buckets[g.key];
        if (!arr.length) return;
        var card = document.createElement("section");
        card.className = "group-card";

        var head = document.createElement("div");
        head.className = "group-head";
        var titleWrap = document.createElement("div");
        titleWrap.className = "sec-title";
        var dm = document.createElement("span");
        dm.className = "mini-diamond";
        var lb = document.createElement("span");
        lb.textContent = g.label;
        titleWrap.appendChild(dm);
        titleWrap.appendChild(lb);

        var cnt = document.createElement("span");
        cnt.className = "sec-count";
        cnt.textContent = arr.length + " trang";
        head.appendChild(titleWrap);
        head.appendChild(cnt);

        var list = document.createElement("div");
        list.className = "list";
        arr.forEach(function (it) {
          var tLabel = g.clockOnly ? fmtClock(it.ts) : fmtDateShort(it.ts);
          list.appendChild(createRowEl(it.title || it.url, it.url, tLabel, false));
        });

        card.appendChild(head);
        card.appendChild(list);
        histGroups.appendChild(card);
      });

      if (window.Motion && typeof window.Motion.animate === "function") {
        try {
          var rows = document.querySelectorAll(".row");
          if (rows.length > 0 && rows.length <= 40) {
            window.Motion.animate(rows, { opacity: [0, 1], y: [6, 0] }, { duration: 0.2, delay: window.Motion.stagger(0.015) });
          }
        } catch (_) {}
      }
    }

    document.addEventListener("keydown", function (ev) {
      var q = document.getElementById("q");
      if (!q) return;
      if (ev.key === "/" && document.activeElement !== q) {
        ev.preventDefault();
        q.focus();
      } else if (ev.key === "Escape" && document.activeElement === q && q.value) {
        ev.preventDefault();
        q.value = "";
        render();
      }
    });

    window.__tpSyncHistory = function (data) {
      if (!data) return;
      if (data.ui_theme) {
        currentTheme = data.ui_theme;
        document.documentElement.setAttribute("data-theme", data.ui_theme);
      }
      if (data.logo_style) {
        currentLogoStyle = data.logo_style;
      }
      syncHistoryBrand();
      if (Array.isArray(data.history)) historyItems = data.history;
      if (Array.isArray(data.closed_tabs)) closedItems = data.closed_tabs;
      render();
    };

    window.addEventListener("tp_config_changed", function (ev) {
      if (ev && ev.detail) {
        if (ev.detail.ui_theme) {
          currentTheme = ev.detail.ui_theme;
          document.documentElement.setAttribute("data-theme", currentTheme);
        }
        if (ev.detail.logo_style) {
          currentLogoStyle = ev.detail.logo_style;
        }
        syncHistoryBrand();
      }
    });

    syncHistoryBrand();
    sendRust({ cmd: "get_history" });
    sendRust({ cmd: "ui_shell_ready", shell: "history" });
  </script>
</body>
</html>
