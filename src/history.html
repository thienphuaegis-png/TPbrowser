<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>Lịch sử duyệt web — TPbrowser</title>
<link id="tp_favicon" rel="icon" type="image/png" href="" />
<style>
/*__TP_FONT_FACE__*/
  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --font-heading: "Cormorant Garamond Gnosis", "Cormorant Garamond", Georgia, serif;
    --bg-main: #0B0C0E;
    --bg-card: #151820;
    --bg-subtle: #1F2430;
    --text-main: #F5F2EB;
    --text-sub: #B8AF9E;
    --gold: #E2BE68;
    --gold-line: rgba(212, 175, 55, 0.28);
    --btn-fg: #140F05;
  }
  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --bg-main: #F6F2EA;
    --bg-card: #FFFFFF;
    --bg-subtle: #EFE9DC;
    --text-main: #18130C;
    --text-sub: #5A4C38;
    --gold: #8A5E10;
    --gold-line: rgba(154, 107, 22, 0.30);
    --btn-fg: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100vh;
    background: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 28px 24px 96px 24px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  .head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--gold-line);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  .head h1 {
    font-family: var(--font-heading);
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
  }
  .head p { font-size: 12.5px; color: var(--text-sub); margin-top: 2px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--gold-line);
    background: var(--bg-card);
    color: var(--text-main);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.14s ease, border-color 0.14s ease;
  }
  .btn:hover { border-color: var(--gold); }
  .btn:active { transform: scale(0.96); }
  .btn.primary {
    background: linear-gradient(135deg, #E2BE68 0%, #B5872E 100%);
    color: #140F05;
    border-color: transparent;
  }
  .search-box {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--gold-line);
    color: var(--text-main);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 13px;
    outline: none;
    margin-bottom: 18px;
  }
  .search-box:focus { border-color: var(--gold); }
  .sec-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--gold);
    margin: 14px 0 8px 0;
  }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--gold-line);
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    transition: border-color 0.14s ease, transform 0.14s ease;
  }
  .row:hover { border-color: var(--gold); transform: translateX(2px); }
  .row-main { min-width: 0; flex: 1; }
  .row-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-url { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-time { font-size: 11px; color: var(--text-sub); flex-shrink: 0; }
  .empty { padding: 18px; text-align: center; color: var(--text-sub); font-size: 12.5px; border: 1px dashed var(--gold-line); border-radius: 10px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>Lịch Sử Duyệt Web &amp; Tab Vừa Đóng</h1>
        <p>Click vào một mục để mở lại ngay trong TPbrowser (Ctrl+H để mở trang này • Ctrl+Shift+T để mở lại tab vừa đóng)</p>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" onclick="sendRust({cmd:'reopen_closed_tab'})">↺ Mở lại Tab vừa đóng</button>
        <button type="button" class="btn" onclick="clearHist()">🗑 Xóa lịch sử</button>
      </div>
    </div>

    <input id="q" class="search-box" type="text" placeholder="Tìm theo tên trang hoặc đường dẫn URL..." oninput="render()" />

    <div class="sec-title">Tab vừa đóng gần đây</div>
    <div id="closed_list" class="list"></div>

    <div class="sec-title" style="margin-top:20px;">Lịch sử đã truy cập</div>
    <div id="hist_list" class="list"></div>
  </div>

  <script>/*__TP_MOTION_JS__*/</script>
  <script>/*__TP_BRAND_ASSETS_JS__*/</script>
  <script>
    var historyItems = [];
    var closedItems = [];
    var currentLogoStyle = "ribbon";
    var currentTheme = document.documentElement.getAttribute("data-theme") || "obsidian-gold";

    function syncHistoryBrand() {
      if (window.__tpSetFavicon && window.__tpResolveBrandAsset) {
        window.__tpSetFavicon(window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme));
      }
    }

    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function fmtTime(ts) {
      if (!ts) return "";
      try {
        var d = new Date(ts * 1000);
        return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + " " + d.toLocaleDateString("vi-VN");
      } catch (_) { return ""; }
    }

    function clearHist() {
      historyItems = [];
      render();
      sendRust({ cmd: "clear_history" });
    }

    function render() {
      var kw = (document.getElementById("q").value || "").toLowerCase().trim();
      var cEl = document.getElementById("closed_list");
      var hEl = document.getElementById("hist_list");

      var cFiltered = closedItems.filter(function(u){ return !kw || String(u).toLowerCase().indexOf(kw) !== -1; });
      if (!cFiltered.length) {
        cEl.innerHTML = '<div class="empty">Chưa có tab nào mới đóng trong phiên này.</div>';
      } else {
        cEl.innerHTML = cFiltered.slice().reverse().map(function(u){
          return '<div class="row" onclick="sendRust({cmd:\'new_tab\',url:\'' + escapeHtml(u).replace(/\'/g,"\\\\'") + '\',isolated:false})">' +
            '<div class="row-main"><div class="row-title">' + escapeHtml(u) + '</div><div class="row-url">Tab vừa đóng — bấm để mở lại</div></div>' +
            '<span class="row-time">↺ Mở lại</span></div>';
        }).join("");
      }

      var hFiltered = historyItems.filter(function(it){
        if (!kw) return true;
        return String(it.title || "").toLowerCase().indexOf(kw) !== -1 || String(it.url || "").toLowerCase().indexOf(kw) !== -1;
      });
      if (!hFiltered.length) {
        hEl.innerHTML = '<div class="empty">Chưa có lịch sử duyệt web phù hợp.</div>';
      } else {
        hEl.innerHTML = hFiltered.slice().reverse().map(function(it){
          return '<div class="row" onclick="sendRust({cmd:\'navigate_active\',url:\'' + escapeHtml(it.url).replace(/\'/g,"\\\\'") + '\'})">' +
            '<div class="row-main"><div class="row-title">' + escapeHtml(it.title || it.url) + '</div><div class="row-url">' + escapeHtml(it.url) + '</div></div>' +
            '<span class="row-time">' + escapeHtml(fmtTime(it.ts)) + '</span></div>';
        }).join("");
      }

      if (window.Motion && typeof window.Motion.animate === "function") {
        var rows = document.querySelectorAll(".row");
        if (rows.length > 0 && rows.length <= 40) {
          window.Motion.animate(rows, { opacity: [0, 1], y: [8, 0] }, { duration: 0.22, delay: window.Motion.stagger(0.02) });
        }
      }
    }

    window.__tpSyncHistory = function (data) {
      if (!data) return;
      if (data.ui_theme) {
        currentTheme = data.ui_theme;
        document.documentElement.setAttribute("data-theme", data.ui_theme);
      }
      if (data.logo_style) {
        currentLogoStyle = data.logo_style;
      }
      syncHistoryBrand();
      if (Array.isArray(data.history)) historyItems = data.history;
      if (Array.isArray(data.closed_tabs)) closedItems = data.closed_tabs;
      render();
    };

    window.addEventListener("tp_config_changed", function (ev) {
      if (ev && ev.detail) {
        if (ev.detail.ui_theme) {
          currentTheme = ev.detail.ui_theme;
          document.documentElement.setAttribute("data-theme", currentTheme);
        }
        if (ev.detail.logo_style) {
          currentLogoStyle = ev.detail.logo_style;
        }
        syncHistoryBrand();
      }
    });

    syncHistoryBrand();
    sendRust({ cmd: "get_history" });
    sendRust({ cmd: "ui_shell_ready", shell: "history" });
  </script>
</body>
</html>
