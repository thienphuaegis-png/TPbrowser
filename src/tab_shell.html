<!DOCTYPE html>
<html lang="vi" data-theme="obsidian-gold">
<head>
<meta charset="UTF-8" />
<title>TPbrowser Tab Shell</title>
<style>
/*__TP_FONT_FACE__*/

  :root, html[data-theme="obsidian-gold"] {
    color-scheme: dark;
    --font-heading: "Cormorant Garamond Gnosis", "Cormorant Garamond", Georgia, serif;
    --ease-ui: cubic-bezier(0.22, 1, 0.36, 1);
    --bg-main: #181818;
    --bg-side: #131313;
    --bg-card: #272727;
    --bg-subtle: rgba(255, 255, 255, 0.06);
    --bg-hover: rgba(255, 255, 255, 0.08);
    --text-primary: #F5F2EB;
    --text-main: #F5F2EB;
    --text-secondary: #C6BEB0;
    --text-muted: #847D71;
    --accent: #C99B3B;
    --accent-grad: linear-gradient(135deg, #E2BE68 0%, #B5872E 100%);
    --accent-fg: #FFFFFF;
    --accent-soft: rgba(212, 175, 55, 0.16);
    --accent-text: #E2BE68;
    --border-col: rgba(255, 255, 255, 0.12);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --danger: #EF5350;
    --danger-soft: rgba(239, 83, 80, 0.16);
    --shadow-card: 0 14px 36px rgba(0, 0, 0, 0.52);
    --shadow-soft: 0 2px 10px rgba(0, 0, 0, 0.32);
  }
  html[data-theme="carrara-light"], html[data-theme="warm-paper"], html[data-theme="light"] {
    color-scheme: light;
    --bg-main: #FFFFFF;
    --bg-side: #F4F4F5;
    --bg-card: #FFFFFF;
    --bg-subtle: rgba(24, 19, 12, 0.065);
    --bg-hover: rgba(24, 19, 12, 0.09);
    --text-primary: #18130C;
    --text-main: #18130C;
    --text-secondary: #3A3024;
    --text-muted: #6C5D49;
    --accent: #7A510B;
    --accent-grad: linear-gradient(135deg, #A8741A 0%, #7A510B 100%);
    --accent-fg: #FFFFFF;
    --accent-soft: rgba(138, 92, 15, 0.12);
    --accent-text: #18130C;
    --border-col: rgba(24, 19, 12, 0.16);
    --border-subtle: rgba(24, 19, 12, 0.09);
    --danger: #C9302C;
    --danger-soft: rgba(201, 48, 44, 0.12);
    --shadow-card: 0 12px 30px rgba(92, 61, 8, 0.12);
    --shadow-soft: 0 2px 8px rgba(92, 61, 8, 0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    color: var(--text-primary);
    font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 12px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* Thanh cuộn mảnh chuẩn Zen */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: transparent; border-radius: 99px; }
  *:hover::-webkit-scrollbar-thumb { background: var(--border-col); }

  /* ================= VERTICAL LEFT MODE ================= */
  body.mode-vertical #horizontal_root { display: none !important; }
  body.mode-horizontal #vertical_root { display: none !important; }

  body.mode-vertical #vertical_root {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    border-right: 1px solid var(--border-col);
    background: var(--bg-side);
    padding: 10px 9px 9px;
    gap: 7px;
  }

  body.overlay-fullscreen.mode-vertical #vertical_root {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: var(--sb-w, 228px);
    z-index: 10;
  }
  body.overlay-fullscreen.mode-vertical.collapsed #vertical_root {
    width: 54px;
  }
  body.overlay-fullscreen.mode-vertical.compact-mode #vertical_root {
    display: none !important;
  }

  body.mode-vertical.collapsed #vertical_root {
    padding: 10px 6px 9px;
  }
  body.mode-vertical.collapsed .hide-when-collapsed { display: none !important; }
  body.mode-vertical.collapsed .v-header { justify-content: center; padding: 2px 0; }
  body.mode-vertical.collapsed .v-window-controls,
  body.mode-vertical.collapsed .v-drag-region { display: none; }
  body.mode-vertical.collapsed .v-window-row { justify-content: center; }
  body.mode-vertical.collapsed .v-tab-item { justify-content: center; padding: 8px 4px; }
  body.mode-vertical.collapsed .v-tab-item.active::after { left: 1px; }

  /* Header & Window Controls */
  .v-header {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 4px;
    padding: 0 1px 2px;
    flex-shrink: 0;
  }
  .v-window-row {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 28px;
    gap: 4px;
  }
  .v-window-controls {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .v-window-btn {
    width: 26px;
    height: 26px;
    justify-content: center;
    padding: 0;
    border-radius: 7px;
    color: var(--text-muted);
  }
  .v-window-btn:hover {
    color: var(--text-primary);
    background: var(--bg-hover);
    border-color: transparent;
  }
  .v-window-btn.close:hover {
    color: #fff;
    background: #c42b1c;
    border-color: #c42b1c;
  }
  .v-drag-region {
    flex: 1;
    min-width: 8px;
    height: 26px;
    cursor: grab;
  }
  .v-drag-region:active { cursor: grabbing; }

  /* Vertical Zen chrome: only menu + native window controls stay visible. */
  .vertical-menu {
    width: 28px;
    height: 28px;
    padding: 0;
    justify-content: center;
    border-radius: 7px;
    flex-shrink: 0;
  }
  .vertical-menu .menu-glyph {
    width: 14px;
    height: 14px;
  }


  .ui-ico {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .ghost-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    padding: 5px 9px;
    border-radius: 9px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui), transform 0.14s var(--ease-ui);
    white-space: nowrap;
  }
  .ghost-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
    border-color: var(--border-subtle);
  }
  .ghost-btn:active { transform: scale(0.96); }

  /* Thanh Địa Chỉ Zen Pill */
  .v-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .url-form {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    border-radius: 10px;
    padding: 3px 4px 3px 10px;
    box-shadow: var(--shadow-soft);
    transition: border-color 0.16s var(--ease-ui), box-shadow 0.16s var(--ease-ui);
  }
  .url-form:hover {
    border-color: var(--border-col);
  }
  .url-form:focus-within {
    border-color: var(--space-accent, var(--accent));
    box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-soft);
  }
  .url-leading-ico {
    color: var(--text-muted);
    opacity: 0.78;
    width: 12px;
    height: 12px;
  }
  .url-form:focus-within .url-leading-ico {
    color: var(--accent-text);
    opacity: 1;
  }
  .url-form input {
    width: 100%;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 5px 0;
    font-size: 11.5px;
    color: var(--text-primary);
    outline: none;
    user-select: text;
  }
  .url-form input::placeholder { color: var(--text-muted); }
  .url-go-btn {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), transform 0.12s ease;
  }
  .url-form:focus-within .url-go-btn,
  .url-go-btn:hover {
    background: var(--accent-soft);
    color: var(--accent-text);
  }
  .url-go-btn:active { transform: scale(0.92); }
  /* Vertical URL dropdown overlays the tab rail; it never changes rail layout. */
  .v-url-wrap { position: relative; min-width: 0; }
  .v-url-dropdown {
    display: none;
    position: absolute;
    z-index: 80;
    top: calc(100% + 6px);
    right: 0;
    left: 0;
    max-height: min(360px, calc(100vh - 116px));
    overflow-y: auto;
    padding: 5px;
    border: 1px solid var(--border-col);
    border-radius: 10px;
    background: var(--bg-card);
    box-shadow: var(--shadow-card);
  }
  .v-url-dropdown.open { display: flex; flex-direction: column; gap: 2px; }
  .v-url-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    padding: 7px 8px;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-secondary);
  }
  .v-url-row:hover, .v-url-row.selected {
    border-color: var(--border-col);
    background: var(--accent-soft);
    color: var(--text-primary);
  }
  .v-url-ico { width: 16px; flex: 0 0 16px; text-align: center; }
  .v-url-main { flex: 1; min-width: 0; }
  .v-url-title, .v-url-subtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v-url-title { font-size: 11.5px; font-weight: 600; }
  .v-url-subtitle { margin-top: 1px; color: var(--text-muted); font-size: 10px; }
  .v-url-badge { flex-shrink: 0; border-radius: 99px; padding: 2px 5px; background: var(--bg-subtle); color: var(--text-muted); font-size: 9px; font-weight: 700; }
  .v-url-row.selected .v-url-badge { background: rgba(212, 175, 55, 0.16); color: var(--accent-text); }

  /* Essentials & Pinned Sections */
  .tab-section {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
    flex-shrink: 0;
  }
  .tab-section[hidden] { display: none; }

  .essentials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
    gap: 6px;
    padding-top: 1px;
  }
  .essentials-grid .v-tab-item {
    position: relative;
    justify-content: center;
    padding: 0;
    height: 40px;
    border-radius: 11px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-soft);
    transition: transform 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui), background-color 0.15s var(--ease-ui), box-shadow 0.15s var(--ease-ui);
  }
  .essentials-grid .v-tab-item:hover {
    transform: translateY(-1px);
    border-color: var(--border-col);
    background: var(--bg-card);
  }
  .essentials-grid .v-tab-item.active {
    border-color: var(--space-accent, var(--accent));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--space-accent, var(--accent)) 45%, transparent), var(--shadow-soft);
  }
  .essentials-grid .v-tab-item.active::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 3px;
    top: auto;
    transform: translateX(-50%);
    width: 14px;
    height: 2px;
    border-radius: 99px;
    background: var(--space-accent, var(--accent));
  }
  .essentials-grid .tab-fav { width: 18px; height: 18px; }

  .pinned-tab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
    gap: 4px;
    max-height: 112px;
    overflow-y: auto;
  }
  .pinned-tab-grid .v-tab-item {
    position: relative;
    justify-content: center;
    padding: 0;
    height: 33px;
    border-radius: 9px;
    background: var(--bg-subtle);
    border: 1px solid transparent;
  }
  .pinned-tab-grid .v-tab-item:hover {
    background: var(--bg-hover);
    border-color: var(--border-subtle);
  }
  .pinned-tab-grid .v-tab-item.active {
    background: var(--bg-card);
    border-color: var(--space-accent, var(--accent));
    box-shadow: var(--shadow-soft);
  }
  .pinned-tab-grid .v-tab-item.active::after { display: none; }
  .pinned-tab-grid .tab-fav { width: 16px; height: 16px; }

  /* Đường chia tinh tế & Nút Tab Mới */
  .v-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-col) 18%, var(--border-col) 82%, transparent);
    margin: 1px 2px;
    flex-shrink: 0;
  }
  .v-newtab-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui);
    flex-shrink: 0;
  }
  .v-newtab-btn:hover {
    background: var(--bg-card);
    border-color: var(--border-col);
    color: var(--text-primary);
    box-shadow: var(--shadow-soft);
  }
  .v-newtab-btn .v-newtab-kbd {
    margin-left: auto;
    font-size: 9.5px;
    color: var(--text-muted);
    background: var(--bg-subtle);
    padding: 1px 5px;
    border-radius: 5px;
    letter-spacing: 0.2px;
    opacity: 0.78;
  }
  body.mode-vertical.collapsed .v-newtab-btn {
    justify-content: center;
    padding: 8px 4px;
    border-radius: 9px;
  }
  body.mode-vertical.collapsed .v-newtab-btn span { display: none; }

  /* Danh sách Tab Dọc */
  .v-tab-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 1px 1px 4px;
  }
  .v-tab-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 33px;
    padding: 6px 8px 6px 10px;
    border-radius: 9px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background-color 0.15s var(--ease-ui), color 0.15s var(--ease-ui), border-color 0.15s var(--ease-ui), opacity 0.2s ease;
  }
  .v-tab-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .v-tab-item.active {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border-col);
    box-shadow: var(--shadow-soft);
  }
  .v-tab-item.active::after {
    content: "";
    position: absolute;
    left: 2px;
    top: 7px;
    bottom: 7px;
    width: 2.5px;
    border-radius: 99px;
    background: var(--space-accent, var(--accent));
  }
  .v-tab-item.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--text-primary);
  }
  .v-tab-item.grouped::before {
    content: "";
    width: 2.5px;
    align-self: stretch;
    border-radius: 99px;
    background: var(--accent);
    opacity: 0.7;
  }
  .v-tab-item.sleeping { opacity: 0.5; }
  .v-tab-item.sleeping:hover { opacity: 0.82; }
  .v-tab-item.sleeping .tab-fav { filter: grayscale(0.85); }
  .v-tab-item.sleeping .tab-title { font-style: italic; }

  .v-tab-item.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .v-tab-item.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .tab-drop-end {
    min-height: 24px;
    margin: 4px 0;
    border: 1px dashed var(--border-col);
    border-radius: 7px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    opacity: 0.72;
  }
  .tab-drop-end.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    opacity: 1;
  }

  .tab-fav {
    width: 15px;
    height: 15px;
    border-radius: 4px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .tab-meta {
    flex: 1;
    min-width: 0;
  }
  .tab-title {
    font-size: 12px;
    font-weight: 450;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .v-tab-item.active .tab-title { font-weight: 600; }

  .tab-sleep-dot {
    font-size: 9px;
    color: var(--text-muted);
    flex-shrink: 0;
    opacity: 0.85;
  }
  .tab-worker-badge {
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 999px;
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }
  .tab-worker-badge.bot {
    background: rgba(245, 158, 11, 0.16);
    color: #D97706;
    border: 1px solid rgba(245, 158, 11, 0.38);
  }
  .tab-worker-badge.ai {
    background: rgba(16, 185, 129, 0.14);
    color: #059669;
    border: 1px solid rgba(16, 185, 129, 0.38);
  }

  .tab-audio-btn,
  .tab-pin,
  .tab-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 21px;
    height: 21px;
    flex-shrink: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    transition: background-color 0.14s ease, color 0.14s ease, opacity 0.14s ease;
  }
  .tab-audio-btn {
    color: var(--accent-text);
    background: var(--accent-soft);
  }
  .tab-audio-btn.is-muted {
    color: var(--text-muted);
    background: var(--bg-subtle);
  }
  .tab-audio-btn:hover {
    background: var(--accent-soft);
    color: var(--text-primary);
  }
  .tab-pin {
    color: var(--accent-text);
    opacity: 0.72;
  }
  .tab-pin:hover {
    background: var(--accent-soft);
    opacity: 1;
  }
  .tab-close {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1;
    opacity: 0;
  }
  .v-tab-item.active .tab-close { opacity: 0.55; }
  .v-tab-item:hover .tab-close { opacity: 1; }
  .tab-close:hover {
    color: var(--danger);
    background: var(--danger-soft);
  }

  /* Tab Folders (Cây thư mục chuẩn Zen) */
  .v-folder-block {
    display: flex;
    flex-direction: column;
    margin: 2px 0;
  }
  .v-folder-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 9px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11.5px;
    font-weight: 600;
    transition: background-color 0.14s var(--ease-ui), color 0.14s var(--ease-ui);
  }
  .v-folder-header:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .v-folder-header.drop-target {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  .v-folder-caret {
    width: 10px;
    height: 10px;
    flex-shrink: 0;
    transition: transform 0.16s var(--ease-ui);
    transform: rotate(90deg);
  }
  .v-folder-header.collapsed .v-folder-caret {
    transform: rotate(0deg);
  }
  .v-folder-ico {
    width: 13px;
    height: 13px;
    color: var(--accent-text);
    flex-shrink: 0;
    opacity: 0.88;
  }
  .v-folder-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-primary);
    font-weight: 600;
  }
  .v-folder-count {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-subtle);
    padding: 1px 6px;
    border-radius: 99px;
  }
  .v-folder-btn {
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 6px;
    font-size: 11px;
    opacity: 0;
    transition: opacity 0.14s ease, background-color 0.14s ease, color 0.14s ease;
  }
  .v-folder-header:hover .v-folder-btn { opacity: 1; }
  .v-folder-btn:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  .v-folder-children {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 2px 0 3px 13px;
    padding-left: 8px;
    border-left: 1px solid var(--border-subtle);
  }
  .v-folder-children.collapsed { display: none; }

  /* Mini Media Player (#v_media_card) */
  .v-media-card {
    background:
      linear-gradient(155deg, var(--accent-soft) 0%, transparent 56%),
      var(--bg-card);
    border: 1px solid var(--border-col);
    border-radius: 12px;
    padding: 9px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    box-shadow: var(--shadow-soft);
  }
  .v-media-card[hidden] { display: none; }
  .v-downloads-card {
    background: var(--bg-card);
    border: 1px solid var(--border-col);
    border-radius: 12px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
    box-shadow: var(--shadow-soft);
  }
  .v-downloads-card[hidden] { display: none; }
  .v-downloads-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent-text);
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .v-download-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 124px;
    overflow-y: auto;
  }
  .v-download-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-subtle);
  }
  .v-download-meta { min-width: 0; flex: 1; }
  .v-download-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .v-download-status {
    font-size: 10px;
    color: var(--text-muted);
  }
  .v-download-btn {
    border: 1px solid var(--border-col);
    background: transparent;
    color: var(--text-sub);
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .v-download-btn:hover { color: var(--accent-text); border-color: var(--accent-text); }
  .v-media-info {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .v-media-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--accent-soft);
    border: 1px solid var(--border-col);
    color: var(--accent-text);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .v-media-eq {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }
  .v-media-eq i {
    display: block;
    width: 2px;
    height: 5px;
    border-radius: 99px;
    background: currentColor;
  }
  .v-media-card.playing .v-media-eq i:nth-child(1) { animation: tpEq 0.9s ease-in-out infinite; }
  .v-media-card.playing .v-media-eq i:nth-child(2) { animation: tpEq 0.72s ease-in-out 0.15s infinite; height: 10px; }
  .v-media-card.playing .v-media-eq i:nth-child(3) { animation: tpEq 0.84s ease-in-out 0.3s infinite; height: 7px; }
  @keyframes tpEq {
    0%, 100% { height: 4px; }
    50% { height: 12px; }
  }
  .v-media-text {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  .v-media-text:hover .v-media-title { color: var(--accent-text); }
  .v-media-title {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.14s ease;
  }
  .v-media-artist {
    font-size: 10px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .v-media-pip {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.14s ease, color 0.14s ease;
  }
  .v-media-pip:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .v-media-controls {
    display: grid;
    grid-template-columns: 1fr 1.35fr 1fr 1fr;
    gap: 5px;
  }
  .v-media-btn {
    height: 26px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-subtle);
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.14s ease, color 0.14s ease, background-color 0.14s ease, transform 0.12s ease;
  }
  .v-media-btn:hover {
    border-color: var(--border-col);
    color: var(--text-primary);
    background: var(--bg-hover);
  }
  .v-media-btn:active { transform: scale(0.95); }
  .v-media-btn.cta {
    background: var(--accent-grad);
    color: var(--accent-fg);
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
  }
  .v-media-btn.cta:hover {
    filter: brightness(1.06);
    color: var(--accent-fg);
  }

  /* Spaces Dock */
  .space-section {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    padding: 8px 2px 2px;
    border-top: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }
  .space-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .space-section-label, .tab-section-label {
    color: var(--text-muted);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    padding-left: 2px;
  }
  .space-switcher { position: relative; min-width: 0; flex: 1; }
  .space-toggle {
    width: 100%;
    max-width: none;
    justify-content: space-between;
    padding: 5px 9px;
    border-radius: 9px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    font-size: 11.5px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .space-toggle:hover {
    border-color: var(--space-accent, var(--accent));
    background: var(--bg-card);
  }
  .space-icon-strip {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    padding: 1px 1px 2px;
    scrollbar-width: none;
  }
  .space-icon-strip::-webkit-scrollbar { display: none; }
  .space-icon-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1.5px solid transparent;
    background: var(--bg-subtle);
    color: var(--text-primary);
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0.7;
    transition: opacity 0.14s ease, transform 0.14s var(--ease-ui), border-color 0.14s ease, background-color 0.14s ease;
  }
  .space-icon-btn:hover {
    opacity: 1;
    background: var(--bg-card);
    border-color: var(--border-col);
    transform: translateY(-1px);
  }
  .space-icon-btn.active {
    opacity: 1;
    background: var(--bg-card);
    border-color: var(--space-accent, var(--accent));
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--space-accent, var(--accent)) 22%, transparent);
  }

  .space-popover {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    z-index: 30;
    width: min(244px, calc(100vw - 18px));
    padding: 8px;
    border: 1px solid var(--border-col);
    border-radius: 12px;
    background: var(--bg-card);
    box-shadow: var(--shadow-card);
  }
  .space-popover.open { display: block; }
  .space-picker-title {
    padding: 2px 6px 7px;
    color: var(--text-muted);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.9px;
    text-transform: uppercase;
  }
  .space-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 220px;
    overflow-y: auto;
  }
  .space-item {
    display: flex;
    align-items: center;
    gap: 2px;
    border-radius: 8px;
    padding-right: 2px;
  }
  .space-item.active { background: var(--accent-soft); }
  .space-select {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 0;
    background: transparent;
    color: var(--text-primary);
    text-align: left;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 11.5px;
  }
  .space-select:hover { background: var(--bg-hover); }
  .space-item.active .space-select { color: var(--accent-text); font-weight: 700; }
  .space-select-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .space-container-pill {
    font-size: 9px;
    color: var(--text-muted);
    background: var(--bg-subtle);
    padding: 1px 5px;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .space-action {
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .space-action:hover { background: var(--bg-hover); color: var(--text-primary); }
  .space-action.delete:hover { color: var(--danger); background: var(--danger-soft); }

  .space-create {
    display: flex;
    gap: 5px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border-subtle);
  }
  .space-create input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border-col);
    border-radius: 8px;
    background: var(--bg-main);
    color: var(--text-primary);
    padding: 6px 8px;
    outline: none;
    user-select: text;
    font-size: 11px;
  }
  .space-create input:focus { border-color: var(--accent); }
  .space-create button {
    border: 0;
    border-radius: 8px;
    background: var(--accent-grad);
    color: var(--accent-fg);
    padding: 0 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
  }

  /* Inline Space Editor & Delete Confirm (thay window.prompt/confirm) */
  .space-popover[data-mode="edit"] .space-list,
  .space-popover[data-mode="edit"] .space-create,
  .space-popover[data-mode="edit"] .space-delete-confirm,
  .space-popover[data-mode="delete"] .space-list,
  .space-popover[data-mode="delete"] .space-create,
  .space-popover[data-mode="delete"] .space-editor {
    display: none;
  }
  .space-popover:not([data-mode="edit"]) .space-editor,
  .space-popover:not([data-mode="delete"]) .space-delete-confirm {
    display: none;
  }

  .space-editor {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .space-editor-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .space-editor-back {
    border: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 5px;
  }
  .space-editor-back:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .space-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .space-field-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .space-field input {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--border-col);
    border-radius: 7px;
    background: var(--bg-main);
    color: var(--text-primary);
    padding: 5px 7px;
    font: inherit;
    font-size: 11px;
    outline: none;
    user-select: text;
  }
  .space-field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .space-icon-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }
  .space-chip-opt {
    height: 26px;
    border-radius: 7px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-subtle);
    color: var(--text-primary);
    font-size: 12.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.12s ease, background-color 0.12s ease, transform 0.1s ease;
  }
  .space-chip-opt:hover {
    background: var(--bg-hover);
    border-color: var(--border-col);
  }
  .space-chip-opt.active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .space-color-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .space-swatch {
    width: 18px;
    height: 18px;
    border-radius: 99px;
    border: 1.5px solid var(--border-subtle);
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .space-swatch:hover { transform: scale(1.12); }
  .space-swatch.active {
    border-color: var(--text-primary);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .space-container-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .space-mini-chip {
    border: 1px solid var(--border-subtle);
    background: var(--bg-subtle);
    color: var(--text-secondary);
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 10px;
    cursor: pointer;
  }
  .space-mini-chip:hover,
  .space-mini-chip.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-text);
  }
  .space-editor-actions {
    display: flex;
    gap: 6px;
    padding-top: 4px;
  }
  .space-btn-sec,
  .space-btn-pri,
  .space-btn-danger {
    flex: 1;
    height: 27px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-subtle);
  }
  .space-btn-sec {
    background: var(--bg-subtle);
    color: var(--text-secondary);
  }
  .space-btn-sec:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .space-btn-pri {
    border-color: transparent;
    background: var(--accent-grad);
    color: var(--accent-fg);
    font-weight: 700;
  }
  .space-btn-danger {
    border-color: transparent;
    background: var(--danger);
    color: #fff;
    font-weight: 700;
  }
  .space-delete-confirm {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 2px 2px;
  }
  .space-delete-msg {
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--text-secondary);
  }
  .v-folder-rename-inp {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--accent);
    border-radius: 5px;
    background: var(--bg-main);
    color: var(--text-primary);
    padding: 1px 5px;
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    outline: none;
    user-select: text;
  }

  /* Worker Section */
  .worker-section {
    flex-shrink: 0;
    border-top: 1px solid var(--border-subtle);
    padding-top: 6px;
  }
  .worker-section-label {
    display: block;
    padding: 0 6px 4px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.9px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .extension-tab-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 150px;
    overflow-y: auto;
  }

  /* Context Menus */
  .vertical-context-menu {
    display: none;
    position: fixed;
    z-index: 60;
    min-width: 176px;
    max-width: min(244px, calc(100vw - 8px));
    max-height: calc(100vh - 16px);
    overflow-y: auto;
    padding: 6px;
    border: 1px solid rgba(226, 190, 104, 0.28);
    border-radius: 12px;
    background: var(--bg-card);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.56);
  }
  html[data-theme="carrara-light"] .vertical-context-menu {
    border-color: rgba(122, 81, 11, 0.26);
    box-shadow: 0 12px 30px rgba(48, 34, 12, 0.18);
  }
  .vertical-context-menu.compact {
    padding: 5px;
    gap: 1px;
  }
  .vertical-context-menu.open {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .vertical-context-menu button {
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-primary);
    padding: 7px 10px;
    text-align: left;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .vertical-context-menu button:hover {
    background: var(--bg-hover);
    color: var(--accent-text);
  }
  .vertical-context-menu button.danger:hover {
    background: var(--danger-soft);
    color: var(--danger);
  }
  .tab-context-sep {
    height: 1px;
    background: var(--border-subtle);
    margin: 3px 6px;
  }

  /* Command Bar Overlay (Chuẩn Zen + AURELIA) */
  #command_bar_overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(7, 8, 11, 0.44);
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: min(13vh, 108px) 20px 24px;
  }
  .cmd-card {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 600px;
    max-height: min(460px, calc(100vh - 140px));
    min-height: 0;
    border: 1px solid var(--border-col);
    border-radius: 14px;
    background: var(--bg-card);
    color: var(--text-primary);
    overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .cmd-input-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .cmd-input-wrap .ui-ico {
    width: 14px;
    height: 14px;
    color: var(--accent-text);
  }
  #command_bar_input {
    flex: 1;
    min-width: 0;
    padding: 12px 0;
    border: 0;
    outline: none;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 13px;
    user-select: text;
  }
  #command_bar_input::placeholder { color: var(--text-muted); }
  .cmd-esc-hint {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--bg-subtle);
    border: 1px solid var(--border-subtle);
    padding: 2px 6px;
    border-radius: 5px;
    letter-spacing: 0.4px;
  }
  #command_bar_results {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .cmd-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    border: 1px solid transparent;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .cmd-row:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }
  .cmd-row[aria-selected="true"] {
    background: var(--accent-soft);
    border-color: var(--border-col);
    color: var(--text-primary);
  }
  .cmd-row-label {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
  .cmd-row-badge {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-subtle);
    padding: 2px 7px;
    border-radius: 99px;
    flex-shrink: 0;
  }
  .cmd-row[aria-selected="true"] .cmd-row-badge {
    color: var(--accent-text);
    background: rgba(212, 175, 55, 0.16);
  }

  /* Ctrl+Tab MRU Switcher HUD (Chuẩn Zen + AURELIA) */
  #ctrl_tab_hud_overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: rgba(7, 8, 11, 0.46);
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .ctrl-tab-card {
    width: min(760px, 100%);
    max-height: min(480px, calc(100vh - 64px));
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border-col);
    border-radius: 16px;
    background: var(--bg-card);
    color: var(--text-primary);
    box-shadow: var(--shadow-card);
  }

  <script>
    var currentTheme = document.documentElement.getAttribute("data-theme") || "obsidian-gold";
    var currentLogoStyle = "ribbon";

    function createSvgIcon(paths, className) {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", className || "ui-ico");
      svg.setAttribute("viewBox", "0 0 16 16");
      svg.setAttribute("aria-hidden", "true");
      paths.forEach(function(spec) {
        var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", spec.d);
        if (spec.fill) p.setAttribute("fill", spec.fill);
        if (spec.stroke === "none") p.setAttribute("stroke", "none");
        svg.appendChild(p);
      });
      return svg;
    }

    function createAudioSvg(muted) {
      if (muted) {
        return createSvgIcon([
          { d: "M3 6.2h2.4L9 3.5v9l-3.6-2.7H3z" },
          { d: "M11.2 6.2l3 3.6M14.2 6.2l-3 3.6" }
        ]);
      }
      return createSvgIcon([
        { d: "M3 6.2h2.4L9 3.5v9l-3.6-2.7H3z" },
        { d: "M11.2 5.7a3.2 3.2 0 0 1 0 4.6" },
        { d: "M13 4.2a5.4 5.4 0 0 1 0 7.6" }
      ]);
    }

    function positionMenuSafe(menuEl, x, y) {
      menuEl.classList.add("open");
      var rect = menuEl.getBoundingClientRect();
      var pad = 6;
      var left = Math.max(pad, Math.min(x, window.innerWidth - rect.width - pad));
      var top = Math.max(pad, Math.min(y, window.innerHeight - rect.height - pad));
      menuEl.style.left = left + "px";
      menuEl.style.top = top + "px";
    }

    function resolveTabFavicon(t) {
      if (!t) return "";
      if (t.url === "tp://newtab" || t.url === "tp://history" || t.url === "tp://workspace") {
        return window.__tpResolveBrandAsset ? window.__tpResolveBrandAsset("app", currentLogoStyle, currentTheme) : "";
      }
      if (t.favicon) return t.favicon;
      try {
        if (t.url && (t.url.startsWith("http://") || t.url.startsWith("https://"))) {
          var host = new URL(t.url).hostname;
          if (host) return "https://www.google.com/s2/favicons?sz=32&domain=" + encodeURIComponent(host);
        }
      } catch (_) {}
      return "";
    }

    function fallbackWebFavicon() {
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='#151922' stroke='#D4AF37' stroke-width='2'/><path d='M3 16h26M16 2c4 4 6 8.7 6 14s-2 10-6 14c-4-4-6-8.7-6-14S12 6 16 2Z' fill='none' stroke='#E2BE68' stroke-width='1.6'/></svg>"
      );
    }


    function sendRust(payload) {
      try {
        if (window.ipc && typeof window.ipc.postMessage === "function") {
          window.ipc.postMessage(JSON.stringify(payload));
        }
      } catch (_) {}
    }

    var verticalRoot = document.getElementById("vertical_root");
    var verticalContextMenu = document.getElementById("vertical_context_menu");
    var lastShellState = null;
    var verticalDragTabId = null;
    var detachRequests = Object.create(null);

    function requestTabDetach(tabId, intent, event) {
      if (!tabId || detachRequests[tabId]) return;
      detachRequests[tabId] = true;
      showDetachHint("Đang tách tab sang cửa sổ mới…");
      sendRust({
        cmd: "detach_tab_to_new_window",
        tab_id: tabId,
        intent: intent,
        screen_x: event && Number.isFinite(event.screenX) ? Math.trunc(event.screenX) : null,
        screen_y: event && Number.isFinite(event.screenY) ? Math.trunc(event.screenY) : null
      });
      window.setTimeout(function() { delete detachRequests[tabId]; }, 3000);
    }

    function showDetachHint(text) {
      var prior = document.getElementById("tab_detach_hint");
      if (prior && prior.parentNode) prior.parentNode.removeChild(prior);
      var hint = document.createElement("div");
      hint.id = "tab_detach_hint";
      hint.textContent = text;
      hint.style.cssText = "position:fixed;left:12px;right:12px;bottom:58px;z-index:9999;padding:8px 10px;border:1px solid var(--accent);border-radius:8px;background:var(--panel,#171b22);color:var(--text,#f4efe5);font-size:11px;text-align:center;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.28);";
      document.body.appendChild(hint);
      window.setTimeout(function() { if (hint.parentNode) hint.parentNode.removeChild(hint); }, 1600);
    }

    function getZenContextPrefs() {
      var p = lastShellState && lastShellState.context_menu_prefs && typeof lastShellState.context_menu_prefs === "object"
        ? lastShellState.context_menu_prefs
        : {};
      return {
        hide_separators: p.hide_separators !== false,
        clean_copy_link: p.clean_copy_link !== false,
        hide_mute: !!p.hide_mute,
        hide_unload: !!p.hide_unload,
        hide_pin_essentials: !!p.hide_pin_essentials,
        hide_split: !!p.hide_split,
        hide_move_space: !!p.hide_move_space,
        hide_duplicate: !!p.hide_duplicate,
        hide_close_others: !!p.hide_close_others
      };
    }

    function cleanTrackingUrl(raw) {
      var str = String(raw || "").trim();
      if (!/^https?:\/\//i.test(str)) return str;
      try {
        var u = new URL(str);
        var strip = ["fbclid","gclid","dclid","msclkid","mc_cid","mc_eid","si","igsh","ref_src","_hsenc","_hsmi"];
        var toDel = [];
        u.searchParams.forEach(function(_, k) {
          var kl = k.toLowerCase();
          if (kl.indexOf("utm_") === 0 || strip.indexOf(kl) !== -1) toDel.push(k);
        });
        toDel.forEach(function(k) { u.searchParams.delete(k); });
        return u.toString();
      } catch (_) { return str; }
    }

    function closeVerticalContextMenu() {
      verticalContextMenu.classList.remove("open");
    }
    verticalRoot.addEventListener("contextmenu", function(event) {
      event.preventDefault();
      closeTabContextMenu();
      var prefs = getZenContextPrefs();
      verticalContextMenu.classList.toggle("compact", prefs.hide_separators);
      var seps = verticalContextMenu.querySelectorAll(".tab-context-sep");
      for (var i = 0; i < seps.length; i++) {
        seps[i].style.display = prefs.hide_separators ? "none" : "block";
      }
      positionMenuSafe(verticalContextMenu, event.clientX, event.clientY);
    });
    document.addEventListener("mousedown", function(event) {
      if (!verticalContextMenu.contains(event.target)) closeVerticalContextMenu();
    });
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closeVerticalContextMenu();
    });
    window.addEventListener("blur", function() {
      closeVerticalContextMenu();
      closeTabContextMenu();
    });

    function cycleThemeQuick() {
      var next = (currentTheme === "obsidian-gold") ? "carrara-light" : "obsidian-gold";
      currentTheme = next;
      document.documentElement.setAttribute("data-theme", next);
      sendRust({ cmd: "set_ui_theme", theme: next });
    }

    var verticalUrlDropdownItems = [];
    var verticalUrlDropdownSelected = -1;
    var verticalUrlDropdownTimer = null;

    function verticalUrlInputLooksLikeAddress(input) {
      var value = (input || "").trim();
      if (!value || /\s/.test(value)) return false;
      if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return true;
      var host = value.split(/[\/?#]/, 1)[0].toLowerCase();
      if (host === "localhost" || host.indexOf("localhost:") === 0) return true;
      var address = host.split(":", 1)[0];
      var ipv4 = address.split(".");
      if (ipv4.length === 4 && ipv4.every(function(part) { return /^(?:0|[1-9]\d{0,2})$/.test(part) && Number(part) <= 255; })) return true;
      return address.indexOf(".") > 0 && !address.startsWith(".") && !address.endsWith(".");
    }

    function verticalUrlSuggestionScore(query, title, url, recentRank) {
      var meta = arguments[4];
      if (!query) return recentRank || 0;
      var q = query.toLowerCase();
      var loweredTitle = (title || "").toLowerCase();
      var loweredUrl = (url || "").toLowerCase();
      var host = loweredUrl.replace(/^[a-z][a-z0-9+.-]*:\/\//, "").split(/[\/?#]/, 1)[0];
      var score = 0;
      if (host.indexOf(q) === 0) score += 140;
      if (loweredUrl.indexOf(q) === 0) score += 120;
      if (loweredTitle.indexOf(q) === 0) score += 100;
      if (loweredTitle.includes(q)) score += 60;
      if (loweredUrl.includes(q)) score += 40;
      if (meta) {
        var kw = String(meta.keyword || "").trim().toLowerCase();
        var folder = String(meta.folder || "").trim().toLowerCase();
        var tags = Array.isArray(meta.tags) ? meta.tags.map(function(t) { return String(t || "").toLowerCase(); }) : [];
        if (kw && (q === kw || q === "@" + kw)) score += 960;
        else if (kw && kw.indexOf(q) === 0) score += 180;
        if (folder && folder.includes(q)) score += 50;
        for (var ti = 0; ti < tags.length; ti++) {
          var tg = tags[ti];
          if (!tg) continue;
          if (q === tg || q === "#" + tg) score += 160;
          else if (tg.includes(q)) score += 55;
        }
      }
      return score + (recentRank || 0);
    }

    function renderVerticalUrlDropdown(query) {
      var box = document.getElementById("v_url_dropdown");
      if (!box) return;
      var raw = (query != null ? query : (document.getElementById("v_url_input").value || "")).trim();
      var q = raw.toLowerCase();
      var state = lastShellState || {};
      var items = [];
      var seenUrls = Object.create(null);
      function addSuggestion(item, recentRank, meta) {
        if (!item.url || seenUrls[item.url]) return;
        seenUrls[item.url] = true;
        item.score = verticalUrlSuggestionScore(q, item.title, item.url, recentRank, meta);
        items.push(item);
      }
      if (raw.startsWith("@ai ")) {
        var prompt = raw.slice(4).trim();
        items.push({ title: "Giao việc cho AI Cowork: " + prompt, subtitle: "Bấm Enter để gửi prompt vào kênh AI", badge: "AI Cowork", ico: "🤖", cmd: "run_ai_prompt", prompt: prompt, kind: "ai", score: 1000, categoryOrder: -2 });
      } else if (raw) {
        var isAddress = verticalUrlInputLooksLikeAddress(raw);
        items.push({ title: isAddress ? "Mở trực tiếp: " + raw : "Tìm kiếm trên Web: " + raw, subtitle: isAddress ? raw : "Dùng công cụ tìm kiếm đã chọn", badge: isAddress ? "URL" : "Tìm kiếm", ico: isAddress ? "🌐" : "🔍", cmd: "navigate_active", url: raw, kind: isAddress ? "url" : "search", score: 900, categoryOrder: -1 });
      }
      (state.tabs || []).forEach(function(tab, index) {
        if (tab.worker_kind) return;
        var title = tab.title || tab.url || "Tab";
        var url = tab.url || "";
        if (!q || verticalUrlSuggestionScore(q, title, url, 0) > 0) addSuggestion({ title: title, subtitle: url, badge: "Đang mở", ico: "▣", cmd: "focus_tab_by_id", tab_id: tab.id, url: url, kind: "tab", categoryOrder: 0 }, Math.max(0, 16 - index));
      });
      (state.bookmarks || []).forEach(function(bookmark, index) {
        var title = bookmark.title || bookmark.url || "Bookmark";
        var url = bookmark.url || "";
        var meta = { folder: bookmark.folder || "", tags: Array.isArray(bookmark.tags) ? bookmark.tags : [], keyword: bookmark.keyword || "" };
        if (!q || verticalUrlSuggestionScore(q, title, url, 0, meta) > 0) {
          var subParts = [];
          if (meta.folder) subParts.push("[" + meta.folder + "]");
          subParts.push(url);
          if (meta.keyword) subParts.push("@" + meta.keyword);
          if (meta.tags.length) subParts.push(meta.tags.map(function(t) { return "#" + t; }).join(" "));
          addSuggestion({ title: title, subtitle: subParts.join(" • "), badge: "Bookmark", ico: "⭐", cmd: "navigate_active", url: url, kind: "bookmark", categoryOrder: 1 }, Math.max(0, 8 - index), meta);
        }
      });
      (state.history || []).slice().reverse().forEach(function(history, index) {
        var title = history.title || history.url || "Lịch sử";
        var url = history.url || "";
        if (!q || verticalUrlSuggestionScore(q, title, url, 0) > 0) addSuggestion({ title: title, subtitle: url, badge: "Lịch sử", ico: "🕒", cmd: "navigate_active", url: url, kind: "history", categoryOrder: 2 }, Math.max(0, 48 - index));
      });
      items.sort(function(a, b) { return b.score - a.score || (a.categoryOrder || 0) - (b.categoryOrder || 0); });
      verticalUrlDropdownItems = items.slice(0, 20);
      verticalUrlDropdownSelected = -1;
      box.replaceChildren();
      verticalUrlDropdownItems.forEach(function(item) {
        var row = document.createElement("div");

        row.onmousedown = function(event) { event.preventDefault(); executeVerticalUrlDropdownItem(item); };
        box.appendChild(row);

    function appendVerticalEndDropTarget(container, tabs) {
      if (!tabs.length) return;
      var target = tabs[tabs.length - 1];
      var zone = document.createElement("div");
      zone.className = "tab-drop-end";
      zone.textContent = "Thả ở cuối danh sách";
      zone.addEventListener("dragover", function(event) {
        if (verticalDragTabId && verticalDragTabId !== target.id) {
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          zone.classList.add("active");
        }
      });
      zone.addEventListener("dragleave", function() { zone.classList.remove("active"); });
      zone.addEventListener("drop", function(event) {
        zone.classList.remove("active");
        var sourceId = Number(event.dataTransfer.getData("text/tp-tab-id"));
        verticalDragTabId = null;
        if (!sourceId || sourceId === target.id) return;
        event.preventDefault();
        sendRust({ cmd: "reorder_tab", source_id: sourceId, target_id: target.id, after: true });
      });
      container.appendChild(zone);
    }

    function renderVerticalTab(t, isAct, iconOnly) {
      var title = t.title || (t.url === "tp://newtab" ? "Không gian bắt đầu" : t.url);
      if (title === "Trang Bắt Đầu Trắng") title = "Không gian bắt đầu";
      var favUrl = resolveTabFavicon(t);

      var row = document.createElement("div");
      row.className = "v-tab-item " + (isAct ? "active " : "") + (t.selected ? "selected " : "") + (t.group_id ? "grouped " : "") + (t.sleeping ? "sleeping " : "");
      row.title = title + (t.sleeping ? " (Đang ngủ đông)" : "");
      if (!t.worker_kind) {
        row.draggable = true;
        row.addEventListener("dragstart", function(event) {
          verticalDragTabId = t.id;
          event.dataTransfer.setData("text/tp-tab-id", String(t.id));
          event.dataTransfer.effectAllowed = "move";
        });
        row.addEventListener("dragend", function(event) {
          var rect = verticalRoot.getBoundingClientRect();
          var outsideStrip = event.clientX < rect.left - 24 || event.clientX > rect.right + 24
            || event.clientY < rect.top - 24 || event.clientY > rect.bottom + 24;
          if (outsideStrip && verticalDragTabId === t.id) {
            requestTabDetach(t.id, "drag_out", event);
          }
          verticalDragTabId = null;
          row.classList.remove("drop-before", "drop-after");
        });
        row.addEventListener("dragover", function(event) {
          if (verticalDragTabId && verticalDragTabId !== t.id) {
            event.preventDefault();
            event.dataTransfer.dropEffect = "move";
            var rect = row.getBoundingClientRect();
            var rel = (event.clientY - rect.top) / Math.max(1, rect.height);
            row.classList.toggle("drop-before", rel < 0.5);
            row.classList.toggle("drop-after", rel >= 0.5);
          }
        });
        row.addEventListener("dragleave", function() {
          row.classList.remove("drop-before", "drop-after");
        });
        row.addEventListener("drop", function(event) {
          row.classList.remove("drop-before", "drop-after");
          var sourceId = Number(event.dataTransfer.getData("text/tp-tab-id"));
          verticalDragTabId = null;
          if (!sourceId || sourceId === t.id) return;
          event.preventDefault();
          var rect = row.getBoundingClientRect();
          var rel = (event.clientY - rect.top) / Math.max(1, rect.height);
          sendRust({ cmd: "reorder_tab", source_id: sourceId, target_id: t.id, after: rel >= 0.5 });
        });
        row.addEventListener("contextmenu", function(event) {
          event.preventDefault();
          event.stopPropagation();
          closeVerticalContextMenu();
          openTabContextMenu(event.clientX, event.clientY, t, isAct);
        });
      }
      row.onclick = function(event) {
        if (t.worker_kind) { sendRust({ cmd: "focus_tab_by_id", tab_id: t.id }); return; }
        var mode = event.ctrlKey || event.metaKey ? "toggle" : (event.shiftKey ? "range" : "replace");
        sendRust({ cmd: "set_tab_selection", tab_id: t.id, mode: mode });
        if (mode === "replace") sendRust({ cmd: "focus_tab_by_id", tab_id: t.id });
      };

      var img = document.createElement("img");
      img.className = "tab-fav";
      img.src = favUrl || fallbackWebFavicon();
      img.alt = "";
      img.onerror = function() {
        img.onerror = null;
        img.src = fallbackWebFavicon();
      };
      row.appendChild(img);

      var meta = document.createElement("div");
      meta.className = "tab-meta hide-when-collapsed";
      var tDiv = document.createElement("div");
      tDiv.className = "tab-title";
      tDiv.textContent = title;
      meta.appendChild(tDiv);
      if (!iconOnly) row.appendChild(meta);

      if (!iconOnly && t.sleeping) {
        var slp = document.createElement("span");
        slp.className = "tab-sleep-dot hide-when-collapsed";
        slp.textContent = "☾";
        slp.title = "Tab đang ngủ đông để tiết kiệm RAM";
        row.appendChild(slp);
      }

      if (isAct && !iconOnly && !t.worker_kind) {
        var pin = document.createElement("button");
        pin.type = "button";
        pin.className = "tab-pin hide-when-collapsed";
        pin.title = t.pinned ? "Bỏ ghim tab hiện tại" : "Ghim tab hiện tại";
        pin.setAttribute("aria-label", pin.title);
        pin.appendChild(createSvgIcon([
          { d: "M5 2.5h6l-.8 3 2 2v1H8.8v4l-.8 1-1-1v-4H3.8v-1l2-2z", fill: t.pinned ? "currentColor" : "" }
        ]));
        if (t.pinned) pin.style.color = "var(--accent)";
        pin.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "toggle_tab_pinned" });
        };
        row.appendChild(pin);
      }

      if (!iconOnly && (t.worker_kind === "bot" || t.worker_kind === "ai")) {
        var wb = document.createElement("span");
        wb.className = "tab-worker-badge hide-when-collapsed " + t.worker_kind;
        wb.textContent = t.worker_kind === "ai" ? "AI" : "BOT";
        row.appendChild(wb);
      }

      if (!iconOnly && (t.audible || t.muted)) {
        var audBtn = document.createElement("button");
        audBtn.type = "button";
        audBtn.className = "tab-audio-btn hide-when-collapsed" + (t.muted ? " is-muted" : "");
        audBtn.title = t.muted ? "Bật tiếng Tab" : "Tắt tiếng Tab";
        audBtn.setAttribute("aria-label", audBtn.title);
        audBtn.appendChild(createAudioSvg(!!t.muted));
        audBtn.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "toggle_tab_mute", tab_id: t.id });
        };
        row.appendChild(audBtn);
      }

      if (!iconOnly) {
        var cls = document.createElement("button");
        cls.type = "button";
        cls.className = "tab-close hide-when-collapsed";
        cls.textContent = "×";
        cls.title = "Đóng tab";
        cls.setAttribute("aria-label", "Đóng tab");
        cls.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "close_tab_by_id", tab_id: t.id });
        };
        row.appendChild(cls);
      }
      return row;
    }

        sendRust({ cmd: "toggle_tab_folder_collapsed", folder_id: folder.id });
      });
      header.addEventListener("dragover", function(ev) {
        if (verticalDragTabId) { ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; header.classList.add("drop-target"); }
      });
      header.addEventListener("dragleave", function() { header.classList.remove("drop-target"); });
      header.addEventListener("drop", function(ev) {
        header.classList.remove("drop-target");
        var sourceId = Number(ev.dataTransfer.getData("text/tp-tab-id"));
        verticalDragTabId = null;
        if (sourceId) { ev.preventDefault(); sendRust({ cmd: "add_tab_to_folder", tab_id: sourceId, folder_id: folder.id }); }
      });

      var caret = createSvgIcon([{ d: "M5 3l6 5-6 5z", fill: "currentColor", stroke: "none" }], "v-folder-caret");
      header.appendChild(caret);

      var folderIco = createSvgIcon([{ d: "M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.4 1.5h4.6A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" }], "ui-ico v-folder-ico");
      header.appendChild(folderIco);

      var nameEl = document.createElement("span");
      nameEl.className = "v-folder-name hide-when-collapsed";
      nameEl.textContent = folder.name;
      header.appendChild(nameEl);

      var countEl = document.createElement("span");
      countEl.className = "v-folder-count hide-when-collapsed";
      countEl.textContent = String(childTabs.length);
      header.appendChild(countEl);

      var renameBtn = document.createElement("button");
      renameBtn.className = "v-folder-btn hide-when-collapsed";
      renameBtn.type = "button";
      renameBtn.title = "Đổi tên thư mục";
      renameBtn.textContent = "✎";
      renameBtn.onclick = function(ev) {
        ev.stopPropagation();
        if (header.querySelector(".v-folder-rename-inp")) return;
        var inp = document.createElement("input");
        inp.className = "v-folder-rename-inp";
        inp.maxLength = 64;
        inp.value = folder.name;
        nameEl.style.display = "none";
        header.insertBefore(inp, countEl);
        inp.focus();
        inp.select();
        var done = false;
        function finish(save) {
          if (done) return;
          done = true;
          var val = inp.value.trim().slice(0, 64);
          if (inp.parentNode) inp.parentNode.removeChild(inp);
          nameEl.style.display = "";
          if (save && val && val !== folder.name) {
            sendRust({ cmd: "rename_tab_folder", folder_id: folder.id, name: val });
          }
        }
        inp.addEventListener("keydown", function(e) {
          e.stopPropagation();
          if (e.key === "Enter") { e.preventDefault(); finish(true); }
          else if (e.key === "Escape") { e.preventDefault(); finish(false); }
        });
        inp.addEventListener("blur", function() { finish(true); });
        inp.addEventListener("click", function(e) { e.stopPropagation(); });
      };
      header.appendChild(renameBtn);

      var splitBtn = document.createElement("button");
      splitBtn.className = "v-folder-btn hide-when-collapsed";
      splitBtn.type = "button";
      splitBtn.title = "Tách nhóm";
      splitBtn.textContent = "×";
      splitBtn.onclick = function(ev) {
        ev.stopPropagation();
        sendRust({ cmd: "split_tab_group", tab_ids: childTabs.map(function(ct) { return ct.id; }) });
      };
      header.appendChild(splitBtn);

      block.appendChild(header);

      var childrenEl = document.createElement("div");
      var visibleCount = 0;
      childTabs.forEach(function(ct) {
        var isAct = tabs.indexOf(ct) === activeIdx;
        if (folder.collapsed && !isAct) return;
        childrenEl.appendChild(renderVerticalTab(ct, isAct, false));
        visibleCount++;
      });
      childrenEl.className = "v-folder-children" + (visibleCount === 0 ? " collapsed" : "");
      block.appendChild(childrenEl);
      return block;
    }

    function renderMediaCard(state) {
      var card = document.getElementById("v_media_card");
      if (!card) return;
      var tabs = (state && Array.isArray(state.tabs)) ? state.tabs : [];
      var activeIdx = state ? (state.active_idx || 0) : 0;
      var activeTab = tabs[activeIdx];

      var targetTab = null;
      var bgAudible = tabs.find(function(t, idx) { return idx !== activeIdx && t.audible; });
      if (bgAudible) {
        targetTab = bgAudible;
      } else if (activeTab && activeTab.audible) {
        targetTab = activeTab;
      } else {
        targetTab = tabs.find(function(t) { return (t.audible || t.muted) && (t.media_title || t.media_artist); }) || null;
      }

      if (!targetTab) {
        card.hidden = true;
        card.classList.remove("playing");
        return;
      }

      card.hidden = false;
      card.classList.toggle("playing", !!targetTab.audible && !targetTab.muted);

      var titleEl = document.getElementById("v_media_title");
      var artistEl = document.getElementById("v_media_artist");
      var muteBtn = document.getElementById("v_media_mute_btn");
      var playBtn = document.getElementById("v_media_play_btn");

      if (titleEl) titleEl.textContent = targetTab.media_title || targetTab.title || "Đang phát âm thanh";
      if (artistEl) {
        var host = "";
        try { if (targetTab.url) host = new URL(targetTab.url).hostname; } catch (_) {}
        artistEl.textContent = targetTab.media_artist || host || "TPbrowser";
      }
      if (muteBtn) {
        muteBtn.replaceChildren(createAudioSvg(!!targetTab.muted));
        muteBtn.title = targetTab.muted ? "Bật tiếng" : "Tắt tiếng";
        muteBtn.setAttribute("aria-label", muteBtn.title);
        muteBtn.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "toggle_tab_mute", tab_id: targetTab.id });
        };
      }
      if (playBtn) {
        playBtn.replaceChildren(
          targetTab.audible
            ? createSvgIcon([{ d: "M5 3.5h2.4v9H5zM9.2 3.5h2.4v9H9.2z", fill: "currentColor", stroke: "none" }])
            : createSvgIcon([{ d: "M5 3.5l7 4.5-7 4.5z", fill: "currentColor", stroke: "none" }])
        );
        playBtn.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "media_control", tab_id: targetTab.id, action: "toggle_play" });
        };
      }
      var prevBtn = document.getElementById("v_media_prev_btn");
      if (prevBtn) {
        prevBtn.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "media_control", tab_id: targetTab.id, action: "prev" });
        };
      }
      var nextBtn = document.getElementById("v_media_next_btn");
      if (nextBtn) {
        nextBtn.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "media_control", tab_id: targetTab.id, action: "next" });
        };
      }
      var pipBtn = document.getElementById("v_media_pip_btn");
      if (pipBtn) {
        pipBtn.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "media_control", tab_id: targetTab.id, action: "pip" });
        };
      }
      var focusArea = document.getElementById("v_media_focus_area");
      if (focusArea) {
        focusArea.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "focus_tab_by_id", tab_id: targetTab.id });
        };
      }
    }

    window.__tpSyncShellState = function (state) {
      if (!state) return;
      lastShellState = state;
      if (state.ui_theme) {
        currentTheme = state.ui_theme;
        document.documentElement.setAttribute("data-theme", state.ui_theme);
      }
      if (state.logo_style) {
        currentLogoStyle = state.logo_style;
      }
      var body = document.body;
      if (state.orientation === "horizontal") {
        body.classList.remove("mode-vertical");
        body.classList.add("mode-horizontal");
      } else {
        body.classList.remove("mode-horizontal");
        body.classList.add("mode-vertical");
      }

      body.classList.toggle("collapsed", !!state.sidebar_collapsed);
      body.classList.toggle("compact-mode", !!state.compact_mode);
      if (state.sidebar_width) {
        document.documentElement.style.setProperty("--sb-w", String(state.sidebar_width) + "px");
      }
      syncOverlayHostClass();
      var vUrlInp = document.getElementById("v_url_input");
      var activeTabObj = (state.tabs || [])[state.active_idx || 0];
      if (vUrlInp && activeTabObj && document.activeElement !== vUrlInp) {
        vUrlInp.value = (activeTabObj.url === "tp://newtab" || activeTabObj.url === "tp://history") ? "" : (activeTabObj.url || "");
      }
      var cmdOverlay = document.getElementById("command_bar_overlay");
      if (cmdOverlay && cmdOverlay.style.display === "flex") {
        renderCommandBar();
      }

      var tabs = state.tabs || [];
      var activeIdx = state.active_idx || 0;
      renderSpaces(state);
      renderSpaceIconStrip(state);

      var workerTabs = tabs.filter(isWorkerTab);
      var pinnedTabs = tabs.filter(function(t) { return !isWorkerTab(t) && !!t.pinned; });
      var normalTabs = tabs.filter(function(t) { return !isWorkerTab(t) && !t.pinned; });
      var essentialTabs = tabs.filter(function(t) { return !isWorkerTab(t) && !!t.essential; });
      pinnedTabs = pinnedTabs.filter(function(t) { return !t.essential; });
      normalTabs = normalTabs.filter(function(t) { return !t.essential; });

      var essentialsSection = document.getElementById("v_essentials_section");
      var essentialsGrid = document.getElementById("v_essentials_grid");
      var pinnedSection = document.getElementById("v_pinned_section");
      var pinnedGrid = document.getElementById("v_pinned_grid");
      var vListEl = document.getElementById("v_tab_list");
      var workerSection = document.getElementById("v_worker_section");
      var workerList = document.getElementById("v_worker_list");


      essentialsGrid.replaceChildren();
      pinnedGrid.replaceChildren();
      vListEl.replaceChildren();
      workerList.replaceChildren();

      essentialsSection.hidden = essentialTabs.length === 0;
      pinnedSection.hidden = pinnedTabs.length === 0;
      workerSection.hidden = workerTabs.length === 0;
      essentialTabs.forEach(function(t) {
        essentialsGrid.appendChild(renderVerticalTab(t, tabs.indexOf(t) === activeIdx, true));
      });
      appendVerticalEndDropTarget(essentialsGrid, essentialTabs);
      pinnedTabs.forEach(function(t) {
        pinnedGrid.appendChild(renderVerticalTab(t, tabs.indexOf(t) === activeIdx, true));
      });
      appendVerticalEndDropTarget(pinnedGrid, pinnedTabs);

      var foldersById = {};
      (lastShellState && lastShellState.folders || []).forEach(function(f) { foldersById[f.id] = f; });
      var renderedFolderIds = {};
      normalTabs.forEach(function(t) {
        var gid = t.group_id;
        var folder = gid ? foldersById[gid] : null;
        if (folder && !renderedFolderIds[gid]) {
          renderedFolderIds[gid] = true;
          var childTabs = normalTabs.filter(function(ct) { return ct.group_id === gid; });
          vListEl.appendChild(renderFolderBlock(folder, childTabs, tabs, activeIdx));
        } else if (!folder) {
          vListEl.appendChild(renderVerticalTab(t, tabs.indexOf(t) === activeIdx, false));
        }
      });
      appendVerticalEndDropTarget(vListEl, normalTabs);

      workerTabs.forEach(function(t) {
        workerList.appendChild(renderVerticalTab(t, tabs.indexOf(t) === activeIdx, false));
      });

      renderMediaCard(state);
      renderDownloadsCard(state);
    };

    function renderDownloadsCard(state) {
      var card = document.getElementById("v_downloads_card");
      var listEl = document.getElementById("v_download_list");
      if (!card || !listEl) return;
      var list = (state && Array.isArray(state.downloads)) ? state.downloads : [];
      if (!list.length) {
        card.hidden = true;
        listEl.replaceChildren();
        return;
      }
      card.hidden = false;
      listEl.replaceChildren();
      list.slice(-4).reverse().forEach(function(item) {
        var row = document.createElement("div");
        row.className = "v-download-row";
        var meta = document.createElement("div");
        meta.className = "v-download-meta";
        var fullPath = String(item.path || item.uri || "Tệp tải xuống");
        var baseName = fullPath.split(/[\\/]/).pop() || fullPath;
        var nm = document.createElement("div");
        nm.className = "v-download-name";
        nm.title = fullPath;
        nm.textContent = baseName;
        var st = document.createElement("div");
        st.className = "v-download-status";
        st.textContent = item.status === "complete" ? "Đã tải xong" : (item.status === "failed" ? "Tải thất bại" : "Đang tải...");
        meta.appendChild(nm);
        meta.appendChild(st);
        row.appendChild(meta);
        if (item.path && item.status === "complete") {
          var openBtn = document.createElement("button");
          openBtn.type = "button";
          openBtn.className = "v-download-btn";
          openBtn.textContent = "Mở";
          openBtn.onclick = function(ev) {
            ev.stopPropagation();
            sendRust({ cmd: "open_downloaded_file", path: item.path });
          };
          row.appendChild(openBtn);
        }
        var dirBtn = document.createElement("button");
        dirBtn.type = "button";
        dirBtn.className = "v-download-btn";
        dirBtn.title = "Mở thư mục chứa tệp";
        dirBtn.textContent = "📁";
        dirBtn.onclick = function(ev) {
          ev.stopPropagation();
          sendRust({ cmd: "open_download_folder", path: item.path || "" });
        };
        row.appendChild(dirBtn);
        listEl.appendChild(row);
      });
    }

    /*__TP_BOOTSTRAP_JS__*/
    if (window.__TP_BOOTSTRAP__ && window.__tpSyncShellState) {
      window.__tpSyncShellState(window.__TP_BOOTSTRAP__);
    }
    sendRust({ cmd: "ui_shell_ready", shell: "tab_shell" });
  </script>
</body>
</html>
